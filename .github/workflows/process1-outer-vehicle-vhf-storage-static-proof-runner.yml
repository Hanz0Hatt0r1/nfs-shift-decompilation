name: Process 1 outer Vehicle VHF storage static proof runner

on:
  push:
    paths:
      - 'tools/ghidra/run_outer_vehicle_vhf_storage_static_proof.py'
      - 'tests/test_ghidra_run_outer_vehicle_vhf_storage_static_proof.py'
      - 'tools/ghidra/run_outer_vehicle_vhf_receiver_static_proof.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_storage_domain.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_sink_receiver_provenance.py'
      - 'tools/ghidra/run_shift_function_instructions.sh'
      - '.github/workflows/process1-outer-vehicle-vhf-storage-static-proof-runner.yml'
  pull_request:
    paths:
      - 'tools/ghidra/run_outer_vehicle_vhf_storage_static_proof.py'
      - 'tests/test_ghidra_run_outer_vehicle_vhf_storage_static_proof.py'
      - 'tools/ghidra/run_outer_vehicle_vhf_receiver_static_proof.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_storage_domain.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_sink_receiver_provenance.py'
      - 'tools/ghidra/run_shift_function_instructions.sh'
      - '.github/workflows/process1-outer-vehicle-vhf-storage-static-proof-runner.yml'

jobs:
  storage-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run storage-runner regressions
        run: python -m pytest -q tests/test_ghidra_run_outer_vehicle_vhf_storage_static_proof.py
      - name: Preserve receiver-runner regressions
        run: python -m pytest -q tests/test_ghidra_run_outer_vehicle_vhf_receiver_static_proof.py
      - name: Preserve storage-domain regressions
        run: python -m pytest -q tests/test_ghidra_outer_vehicle_transform_storage_domain.py
      - name: Verify runner CLI
        run: python tools/ghidra/run_outer_vehicle_vhf_storage_static_proof.py --help >/dev/null
      - name: Verify targeted exporter CLI
        run: bash tools/ghidra/run_shift_function_instructions.sh 2>&1 | grep -q 'Usage:'
