name: native-physics-phase690

on:
  push:
    paths:
      - 'src/physics/explicit_outer_update_runtime_state.py'
      - 'tests/test_explicit_outer_update_runtime_state.py'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/explicit_outer_update_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase690.cmake'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE690_EXPLICIT_OUTER_UPDATE_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase690.yml'
  pull_request:
    paths:
      - 'src/physics/explicit_outer_update_runtime_state.py'
      - 'tests/test_explicit_outer_update_runtime_state.py'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/explicit_outer_update_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase690.cmake'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE690_EXPLICIT_OUTER_UPDATE_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase690.yml'

jobs:
  explicit-outer-update-runtime-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 690 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_explicit_outer_update_runtime_state.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 690 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_explicit_outer_update_runtime_state_check

      - name: Run Phase 690 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_explicit_outer_update_runtime_state$'

      - name: Verify Phase 690 report
        run: |
          mkdir -p out/native-physics-phase690
          native_runtime/build/shift_runtime_explicit_outer_update_runtime_state_check \
            > out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"format":"SHIFT.NativeExplicitOuterUpdateRuntimeState/1"' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"explicit_update_count":2' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"phase689_composed_outer_update_reused":true' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"persistent_body_bytes_carried_between_explicit_updates":true' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"workspace_admission_required":true' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"participant_identity_admission_required":true' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"fun_007afdd0_machine_scalar_gate_closed":false' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
          grep -q '"rendered_frame_cadence_proven":false' \
            out/native-physics-phase690/explicit_outer_update_runtime_state.json
