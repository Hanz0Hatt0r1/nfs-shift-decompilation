name: Process 1 vehicle render root pose transport frontier

on:
  push:
    paths:
      - 'tools/ghidra/build_vehicle_render_root_pose_transport_frontier.py'
      - 'tests/test_ghidra_vehicle_render_root_pose_transport_frontier.py'
      - 'docs/PROCESS_1_VEHICLE_RENDER_ROOT_POSE_TRANSPORT_FRONTIER.md'
      - '.github/workflows/process1-vehicle-render-root-pose-transport-frontier.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_vehicle_render_root_pose_transport_frontier.py'
      - 'tests/test_ghidra_vehicle_render_root_pose_transport_frontier.py'
      - 'docs/PROCESS_1_VEHICLE_RENDER_ROOT_POSE_TRANSPORT_FRONTIER.md'
      - '.github/workflows/process1-vehicle-render-root-pose-transport-frontier.yml'

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run vehicle render root-pose frontier regressions
        run: python -m pytest -q tests/test_ghidra_vehicle_render_root_pose_transport_frontier.py
      - name: Verify CLI surface
        run: python tools/ghidra/build_vehicle_render_root_pose_transport_frontier.py --help >/dev/null
