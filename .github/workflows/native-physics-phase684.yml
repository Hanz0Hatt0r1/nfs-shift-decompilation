name: native-physics-phase684

on:
  push:
    paths:
      - 'src/physics/fun_0076d100_anchor_sequence_runtime.py'
      - 'tests/test_fun_0076d100_anchor_sequence_runtime.py'
      - 'native_runtime/include/shift_fun_0076d100_anchor_sequence.hpp'
      - 'native_runtime/src/fun_0076d100_anchor_sequence.cpp'
      - 'native_runtime/tests/fun_0076d100_anchor_sequence_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE684_FUN_0076D100_ANCHOR_SEQUENCE.md'
      - '.github/workflows/native-physics-phase684.yml'
  pull_request:
    paths:
      - 'src/physics/fun_0076d100_anchor_sequence_runtime.py'
      - 'tests/test_fun_0076d100_anchor_sequence_runtime.py'
      - 'native_runtime/include/shift_fun_0076d100_anchor_sequence.hpp'
      - 'native_runtime/src/fun_0076d100_anchor_sequence.cpp'
      - 'native_runtime/tests/fun_0076d100_anchor_sequence_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE684_FUN_0076D100_ANCHOR_SEQUENCE.md'
      - '.github/workflows/native-physics-phase684.yml'

jobs:
  fun-0076d100-anchor-sequence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 684 Python anchor oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_0076d100_anchor_sequence_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 684 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_0076d100_anchor_sequence_check

      - name: Run Phase 684 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_0076d100_anchor_sequence$'

      - name: Verify Phase 684 report
        run: |
          mkdir -p out/native-physics-phase684
          native_runtime/build/shift_runtime_fun_0076d100_anchor_sequence_check \
            > out/native-physics-phase684/fun_0076d100_anchor_sequence.json
          grep -q '"format":"SHIFT.NativeFun0076d100AnchorSequence/1"' \
            out/native-physics-phase684/fun_0076d100_anchor_sequence.json
          grep -q '"nested_outer_two_pass_schedule_proven":true' \
            out/native-physics-phase684/fun_0076d100_anchor_sequence.json
          grep -q '"persistent_body_crosses_nested_schedule":true' \
            out/native-physics-phase684/fun_0076d100_anchor_sequence.json
          grep -q '"intervening_local_work_modeled":false' \
            out/native-physics-phase684/fun_0076d100_anchor_sequence.json
          grep -q '"complete_fun_0076d100_semantics":false' \
            out/native-physics-phase684/fun_0076d100_anchor_sequence.json
