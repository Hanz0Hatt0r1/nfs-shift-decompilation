name: Native runtime Phase 714

on:
  push:
    branches: [main]
    paths:
      - 'native_runtime/src/runtime_body_feedback_scheduler.hpp'
      - 'native_runtime/tests/runtime_body_feedback_scheduler_check.cpp'
      - 'tests/test_native_runtime_phase713_transactional_fixed_step.py'
      - 'tests/test_native_runtime_phase714_continuous_body_state_generation.py'
      - 'docs/PHASE714_CONTINUOUS_BODY_STATE_GENERATION.md'
      - '.github/workflows/native-runtime-phase714.yml'
  pull_request:
    paths:
      - 'native_runtime/src/runtime_body_feedback_scheduler.hpp'
      - 'native_runtime/tests/runtime_body_feedback_scheduler_check.cpp'
      - 'tests/test_native_runtime_phase713_transactional_fixed_step.py'
      - 'tests/test_native_runtime_phase714_continuous_body_state_generation.py'
      - 'docs/PHASE714_CONTINUOUS_BODY_STATE_GENERATION.md'
      - '.github/workflows/native-runtime-phase714.yml'

jobs:
  phase714:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libvulkan-dev libxcb1-dev glslang-tools python3-pytest
      - name: Configure
        run: cmake -S native_runtime -B native_runtime/build -G Ninja -DBUILD_TESTING=ON
      - name: Build BODY feedback scheduler regression
        run: cmake --build native_runtime/build --target shift_runtime_body_feedback_scheduler_check
      - name: CTest continuous BODY state lineage
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_body_feedback_scheduler$'
      - name: Source-contract regressions
        run: >-
          python3 -m pytest -q
          tests/test_native_runtime_phase713_transactional_fixed_step.py
          tests/test_native_runtime_phase714_continuous_body_state_generation.py
          tests/test_native_runtime_contract.py
      - name: Verify generation report
        run: |
          native_runtime/build/shift_runtime_body_feedback_scheduler_check > phase714.json
          grep -q '"continuous_body_state_lineage_ready":true' phase714.json
          grep -q '"steps":2' phase714.json
          grep -q '"body_state_generation":2' phase714.json
          grep -q '"last_input_body_state_generation":1' phase714.json
