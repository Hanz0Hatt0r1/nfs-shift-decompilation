name: native-physics-phase722

on:
  push:
    paths:
      - 'evidence/fun_00765c40_load_term_ownership.json'
      - 'native_runtime/include/shift_fun_00765c40_load_terms.hpp'
      - 'native_runtime/include/shift_fun_007682c0_projection_state.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_load_term_ownership_check.cpp'
      - 'native_runtime/tests/fun_007682c0_projection_state_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase721.cmake'
      - 'native_runtime/cmake/phase722.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_00765c40_load_term_ownership.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase722.yml'
  pull_request:
    paths:
      - 'evidence/fun_00765c40_load_term_ownership.json'
      - 'native_runtime/include/shift_fun_00765c40_load_terms.hpp'
      - 'native_runtime/include/shift_fun_007682c0_projection_state.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_load_term_ownership_check.cpp'
      - 'native_runtime/tests/fun_007682c0_projection_state_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase721.cmake'
      - 'native_runtime/cmake/phase722.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_00765c40_load_term_ownership.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase722.yml'

jobs:
  fun-00765c40-load-term-ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 722 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00765c40_load_term_ownership.py
          tests/test_native_vehicle_external_provider_frontier_current.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 722 and dependent session regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00765c40_load_term_ownership_check
          shift_runtime_fun_007682c0_projection_state_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00765c40_load_term_ownership|shift_runtime_fun_007682c0_projection_state|shift_runtime_fun_007594e0_session_angle|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 722 report
        run: |
          mkdir -p out/native-physics-phase722
          native_runtime/build/shift_runtime_fun_00765c40_load_term_ownership_check \
            > out/native-physics-phase722/fun_00765c40_load_term_ownership.json
          grep -q '"format":"SHIFT.Fun00765c40LoadTerms/1"' \
            out/native-physics-phase722/fun_00765c40_load_term_ownership.json
          grep -q '"external_motion_read_load_terms_present":false' \
            out/native-physics-phase722/fun_00765c40_load_term_ownership.json
          grep -q '"typed_contact_factor_load_terms_consumed":true' \
            out/native-physics-phase722/fun_00765c40_load_term_ownership.json
          grep -q '"per_pass_refresh_required":true' \
            out/native-physics-phase722/fun_00765c40_load_term_ownership.json
