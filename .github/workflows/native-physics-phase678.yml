name: native-physics-phase678

on:
  push:
    paths:
      - ".github/workflows/native-physics-phase678.yml"
      - "native_runtime/include/shift_body_feedback_record_bridge.hpp"
      - "native_runtime/src/body_feedback_record_bridge.cpp"
      - "native_runtime/tests/body_feedback_record_bridge_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_feedback_record_bridge_runtime.py"
      - "tests/test_body_feedback_record_bridge_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/native-physics-phase678.yml"
      - "native_runtime/include/shift_body_feedback_record_bridge.hpp"
      - "native_runtime/src/body_feedback_record_bridge.cpp"
      - "native_runtime/tests/body_feedback_record_bridge_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_feedback_record_bridge_runtime.py"
      - "tests/test_body_feedback_record_bridge_runtime.py"

jobs:
  body-feedback-record-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            python3-pytest \
            libvulkan-dev \
            glslang-tools \
            libxcb1-dev
      - name: Run Phase 678 Python oracle regression
        run: PYTHONPATH=src/physics python3 -m pytest -q tests/test_body_feedback_record_bridge_runtime.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 678 native regression
        run: cmake --build native_runtime/build --config Release --parallel --target shift_runtime_body_feedback_record_bridge_check
      - name: Run Phase 678 CTest regression
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_body_feedback_record_bridge$'
      - name: Verify Phase 678 report
        run: |
          mkdir -p out/native-physics-phase678
          native_runtime/build/shift_runtime_body_feedback_record_bridge_check \
            | tee out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"format":"SHIFT.NativeBodyFeedbackRecordBridge/1"' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"body_record_size":368' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"accumulator_writer_bytes":48' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"raw_feedback_seed_proven":true' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"post_solve_accumulator_write_proven":true' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"unrelated_bytes_preserved":true' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"size_mismatch_rejected":true' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"non_finite_rejected":true' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"body_integration_scheduled":false' \
            out/native-physics-phase678/body_feedback_record_bridge.json
          grep -q '"runtime_scheduling_proven":false' \
            out/native-physics-phase678/body_feedback_record_bridge.json
