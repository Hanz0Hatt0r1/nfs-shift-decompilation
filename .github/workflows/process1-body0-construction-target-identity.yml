name: Process 1 BODY0 construction target identity

on:
  push:
    paths:
      - 'tools/ghidra/build_bmw_body0_construction_target_identity.py'
      - 'tests/test_ghidra_bmw_body0_construction_target_identity.py'
      - 'tools/ghidra/analyze_bmw_body0_construction_pose_stores.py'
      - 'tools/ghidra/build_bmw_body0_construction_bind_continuity.py'
      - 'docs/PROCESS_1_BMW_BODY0_CONSTRUCTION_TARGET_IDENTITY.md'
      - '.github/workflows/process1-body0-construction-target-identity.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_bmw_body0_construction_target_identity.py'
      - 'tests/test_ghidra_bmw_body0_construction_target_identity.py'
      - 'tools/ghidra/analyze_bmw_body0_construction_pose_stores.py'
      - 'tools/ghidra/build_bmw_body0_construction_bind_continuity.py'
      - 'docs/PROCESS_1_BMW_BODY0_CONSTRUCTION_TARGET_IDENTITY.md'
      - '.github/workflows/process1-body0-construction-target-identity.yml'

jobs:
  target-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run construction target identity regressions
        run: >-
          python -m pytest -q
          tests/test_ghidra_bmw_body0_construction_target_identity.py
          tests/test_ghidra_bmw_body0_construction_pose_stores.py
          tests/test_ghidra_bmw_body0_construction_bind_continuity.py
      - name: Verify CLI surface
        run: python tools/ghidra/build_bmw_body0_construction_target_identity.py --help >/dev/null
