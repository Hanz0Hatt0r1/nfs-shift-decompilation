name: Process 1 player vehicle renderables anchor

on:
  push:
    paths:
      - 'tools/ghidra/ShiftGlobalReferenceExporter.java'
      - 'tools/ghidra/run_shift_global_references.sh'
      - 'tools/ghidra/validate_global_reference_export.py'
      - 'tests/test_ghidra_global_reference_export_validation.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDERABLES_MANAGER_ANCHOR.md'
      - '.github/workflows/process1-player-vehicle-renderables-anchor.yml'
  pull_request:
    paths:
      - 'tools/ghidra/ShiftGlobalReferenceExporter.java'
      - 'tools/ghidra/run_shift_global_references.sh'
      - 'tools/ghidra/validate_global_reference_export.py'
      - 'tests/test_ghidra_global_reference_export_validation.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDERABLES_MANAGER_ANCHOR.md'
      - '.github/workflows/process1-player-vehicle-renderables-anchor.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run validator regressions
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_ghidra_global_reference_export_validation.py
      - name: Check shell runner syntax
        run: bash -n tools/ghidra/run_shift_global_references.sh
      - name: Check Python validator syntax
        run: python -m py_compile tools/ghidra/validate_global_reference_export.py
