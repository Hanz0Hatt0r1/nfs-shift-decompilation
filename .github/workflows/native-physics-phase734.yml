name: native-physics-phase734

on:
  push:
    paths:
      - 'evidence/fun_007675f0_param3_ownership.json'
      - 'evidence/phase734_next_blocker.md'
      - 'docs/PHASE734_FUN_007675F0_PARAM3_OWNERSHIP.md'
      - 'docs/PHASE734_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_fun_00769ef0_param3.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_007675f0_param3_ownership_check.cpp'
      - 'native_runtime/cmake/phase733.cmake'
      - 'native_runtime/cmake/phase734.cmake'
      - 'tests/test_s6_fun_007675f0_param3_ownership.py'
      - '.github/workflows/native-physics-phase734.yml'
  pull_request:
    paths:
      - 'evidence/fun_007675f0_param3_ownership.json'
      - 'evidence/phase734_next_blocker.md'
      - 'docs/PHASE734_FUN_007675F0_PARAM3_OWNERSHIP.md'
      - 'docs/PHASE734_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_fun_00769ef0_param3.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_007675f0_param3_ownership_check.cpp'
      - 'native_runtime/cmake/phase733.cmake'
      - 'native_runtime/cmake/phase734.cmake'
      - 'tests/test_s6_fun_007675f0_param3_ownership.py'
      - '.github/workflows/native-physics-phase734.yml'

jobs:
  fun-007675f0-param3-ownership:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 734 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007675f0_param3_ownership.py
          tests/test_s6_fun_007675f0_surface_probe_join.py
          tests/test_s6_fun_007675f0_surface_probe_node_cache.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 734 and dependent regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007675f0_param3_ownership_check
          shift_runtime_fun_007675f0_surface_probe_node_cache_check
          shift_runtime_fun_007675f0_surface_probe_join_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007675f0_param3_ownership|shift_runtime_fun_007675f0_surface_probe_node_cache|shift_runtime_fun_007675f0_surface_probe_join)$'

      - name: Verify Phase 734 report
        run: |
          mkdir -p out/native-physics-phase734
          native_runtime/build/shift_runtime_fun_007675f0_param3_ownership_check \
            > out/native-physics-phase734/fun_007675f0_param3_ownership.json
          grep -q '"format":"SHIFT.Fun00769ef0Param3/1"' \
            out/native-physics-phase734/fun_007675f0_param3_ownership.json
          grep -q '"gravity_bits":"0x40239eb851eb851f"' \
            out/native-physics-phase734/fun_007675f0_param3_ownership.json
          grep -q '"load_term_count":4' \
            out/native-physics-phase734/fun_007675f0_param3_ownership.json
          grep -q '"precision_witness_locked":true' \
            out/native-physics-phase734/fun_007675f0_param3_ownership.json
