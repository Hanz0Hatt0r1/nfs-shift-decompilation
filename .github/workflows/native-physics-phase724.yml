name: native-physics-phase724

on:
  push:
    paths:
      - 'evidence/bmw_native_session_player_difficulty.json'
      - 'evidence/bmw_offset33b_native_silverstone_session.json'
      - 'native_runtime/include/shift_bmw_native_session_player_difficulty.hpp'
      - 'native_runtime/include/shift_fun_007682c0_projection_state.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/bmw_native_session_player_difficulty_check.cpp'
      - 'native_runtime/tests/fun_007560c0_motion_read_gate_setup_check.cpp'
      - 'native_runtime/tests/fun_00765c40_load_term_ownership_check.cpp'
      - 'native_runtime/tests/fun_007682c0_projection_state_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase723.cmake'
      - 'native_runtime/cmake/phase724.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_bmw_native_session_player_difficulty.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase724.yml'
  pull_request:
    paths:
      - 'evidence/bmw_native_session_player_difficulty.json'
      - 'evidence/bmw_offset33b_native_silverstone_session.json'
      - 'native_runtime/include/shift_bmw_native_session_player_difficulty.hpp'
      - 'native_runtime/include/shift_fun_007682c0_projection_state.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/bmw_native_session_player_difficulty_check.cpp'
      - 'native_runtime/tests/fun_007560c0_motion_read_gate_setup_check.cpp'
      - 'native_runtime/tests/fun_00765c40_load_term_ownership_check.cpp'
      - 'native_runtime/tests/fun_007682c0_projection_state_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase723.cmake'
      - 'native_runtime/cmake/phase724.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_bmw_native_session_player_difficulty.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase724.yml'

jobs:
  selected-session-player-difficulty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 724 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_bmw_native_session_player_difficulty.py
          tests/test_native_vehicle_external_provider_frontier_current.py
          tests/test_s6_fun_007682c0_derived_projection_state.py
          tests/test_s6_fun_007594e0_machine_angle.py
          tests/test_s6_fun_00765c40_load_term_ownership.py
          tests/test_s6_fun_007560c0_motion_read_gate_setup.py
          tests/test_s6_fun_007560c0_motion_read_gate_setup_static.py
          tests/test_s6_fun_007682c0_machine_effect_production.py
          tests/test_s6_fun_007682c0_body0_delta_destination.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 724 and dependent session regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_bmw_native_session_player_difficulty_check
          shift_runtime_fun_007560c0_motion_read_gate_setup_check
          shift_runtime_fun_00765c40_load_term_ownership_check
          shift_runtime_fun_007682c0_projection_state_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_bmw_native_session_player_difficulty|shift_runtime_fun_007560c0_motion_read_gate_setup|shift_runtime_fun_00765c40_load_term_ownership|shift_runtime_fun_007682c0_projection_state|shift_runtime_fun_007594e0_session_angle|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 724 report
        run: |
          mkdir -p out/native-physics-phase724
          native_runtime/build/shift_runtime_bmw_native_session_player_difficulty_check \
            > out/native-physics-phase724/bmw_native_session_player_difficulty.json
          grep -q '"format":"SHIFT.BMWNativeSessionPlayerDifficulty/1"' \
            out/native-physics-phase724/bmw_native_session_player_difficulty.json
          grep -q '"selected_player_difficulty":1' \
            out/native-physics-phase724/bmw_native_session_player_difficulty.json
          grep -q '"late_raw_input_provider_required":false' \
            out/native-physics-phase724/bmw_native_session_player_difficulty.json
