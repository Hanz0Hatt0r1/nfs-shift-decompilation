name: Process 1 render-manager global xref ranker

on:
  push:
    paths:
      - 'tools/ghidra/rank_player_vehicle_render_manager_global_refs.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_global_xref_ranker.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDER_MANAGER_GLOBAL_XREF_RANK.md'
      - '.github/workflows/process1-render-manager-global-xref-ranker.yml'
  pull_request:
    paths:
      - 'tools/ghidra/rank_player_vehicle_render_manager_global_refs.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_global_xref_ranker.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDER_MANAGER_GLOBAL_XREF_RANK.md'
      - '.github/workflows/process1-render-manager-global-xref-ranker.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run global-xref ranker regressions
        run: python -m pytest -q tests/test_ghidra_player_vehicle_render_manager_global_xref_ranker.py
      - name: Verify CLI surface
        run: python tools/ghidra/rank_player_vehicle_render_manager_global_refs.py --help >/dev/null
