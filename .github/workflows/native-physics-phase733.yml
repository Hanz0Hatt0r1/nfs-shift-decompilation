name: native-physics-phase733

on:
  push:
    paths:
      - 'evidence/fun_007675f0_surface_probe_node_cache.json'
      - 'evidence/phase733_next_blocker.md'
      - 'docs/PHASE733_FUN_007675F0_SURFACE_PROBE_NODE_CACHE.md'
      - 'docs/PHASE733_SCOPE.md'
      - 'native_runtime/include/shift_fun_007675f0_surface_probe_node_cache.hpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_node_cache_check.cpp'
      - 'native_runtime/cmake/phase732.cmake'
      - 'native_runtime/cmake/phase733.cmake'
      - 'tests/test_s6_fun_007675f0_surface_probe_node_cache.py'
      - '.github/workflows/native-physics-phase733.yml'
  pull_request:
    paths:
      - 'evidence/fun_007675f0_surface_probe_node_cache.json'
      - 'evidence/phase733_next_blocker.md'
      - 'docs/PHASE733_FUN_007675F0_SURFACE_PROBE_NODE_CACHE.md'
      - 'docs/PHASE733_SCOPE.md'
      - 'native_runtime/include/shift_fun_007675f0_surface_probe_node_cache.hpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_node_cache_check.cpp'
      - 'native_runtime/cmake/phase732.cmake'
      - 'native_runtime/cmake/phase733.cmake'
      - 'tests/test_s6_fun_007675f0_surface_probe_node_cache.py'
      - '.github/workflows/native-physics-phase733.yml'

jobs:
  fun-007675f0-surface-probe-node-cache:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 733 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007675f0_surface_probe_node_cache.py
          tests/test_s6_fun_007675f0_surface_probe_join.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 733 and dependent regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007675f0_surface_probe_node_cache_check
          shift_runtime_fun_007675f0_surface_probe_join_check
          shift_runtime_surface_probe_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007675f0_surface_probe_node_cache|shift_runtime_fun_007675f0_surface_probe_join|shift_runtime_surface_probe)$'

      - name: Verify Phase 733 report
        run: |
          mkdir -p out/native-physics-phase733
          native_runtime/build/shift_runtime_fun_007675f0_surface_probe_node_cache_check \
            > out/native-physics-phase733/fun_007675f0_surface_probe_node_cache.json
          grep -q '"format":"SHIFT.Fun007675f0SurfaceProbeNodeCache/1"' \
            out/native-physics-phase733/fun_007675f0_surface_probe_node_cache.json
          grep -q '"node_offset":"HDVehicle+0x120"' \
            out/native-physics-phase733/fun_007675f0_surface_probe_node_cache.json
          grep -q '"null_node_forces_lookup":true' \
            out/native-physics-phase733/fun_007675f0_surface_probe_node_cache.json
          grep -q '"lookup_provider_still_external":true' \
            out/native-physics-phase733/fun_007675f0_surface_probe_node_cache.json
