name: Process 1 BMW offset33b reduced static proof runner

on:
  push:
    paths:
      - 'tools/ghidra/run_bmw_offset33b_reduced_static_proof.py'
      - 'tests/test_ghidra_run_bmw_offset33b_reduced_static_proof.py'
      - 'tools/ghidra/run_bmw_offset33b_static_proof.py'
      - 'tools/ghidra/analyze_bmw_offset33b_store_provenance.py'
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tools/ghidra/analyze_bmw_offset33b_memory_load_provenance.py'
      - '.github/workflows/process1-bmw-offset33b-reduced-static-proof-runner.yml'
  pull_request:
    paths:
      - 'tools/ghidra/run_bmw_offset33b_reduced_static_proof.py'
      - 'tests/test_ghidra_run_bmw_offset33b_reduced_static_proof.py'
      - 'tools/ghidra/run_bmw_offset33b_static_proof.py'
      - 'tools/ghidra/analyze_bmw_offset33b_store_provenance.py'
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tools/ghidra/analyze_bmw_offset33b_memory_load_provenance.py'
      - '.github/workflows/process1-bmw-offset33b-reduced-static-proof-runner.yml'

jobs:
  reduced-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run reduced-runner regressions
        run: python -m pytest -q tests/test_ghidra_run_bmw_offset33b_reduced_static_proof.py
      - name: Preserve base runner regressions
        run: python -m pytest -q tests/test_ghidra_run_bmw_offset33b_static_proof.py
      - name: Preserve memory-LOAD regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_memory_load_provenance.py
      - name: Preserve bootstrap-zero regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py
      - name: Verify runner CLI
        run: python tools/ghidra/run_bmw_offset33b_reduced_static_proof.py --help >/dev/null
