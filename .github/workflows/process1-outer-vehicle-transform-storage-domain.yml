name: Process 1 outer Vehicle transform storage domain

on:
  push:
    paths:
      - 'tools/ghidra/analyze_outer_vehicle_transform_storage_domain.py'
      - 'tests/test_ghidra_outer_vehicle_transform_storage_domain.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_sink_receiver_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'tools/ghidra/build_outer_vehicle_vhf_root_relation_frontier.py'
      - '.github/workflows/process1-outer-vehicle-transform-storage-domain.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_outer_vehicle_transform_storage_domain.py'
      - 'tests/test_ghidra_outer_vehicle_transform_storage_domain.py'
      - 'tools/ghidra/analyze_outer_vehicle_transform_sink_receiver_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'tools/ghidra/build_outer_vehicle_vhf_root_relation_frontier.py'
      - '.github/workflows/process1-outer-vehicle-transform-storage-domain.yml'

jobs:
  storage-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run storage-domain regressions
        run: python -m pytest -q tests/test_ghidra_outer_vehicle_transform_storage_domain.py
      - name: Preserve upstream receiver-provenance regressions
        run: python -m pytest -q tests/test_ghidra_outer_vehicle_transform_sink_receiver_provenance.py
      - name: Verify CLI
        run: python tools/ghidra/analyze_outer_vehicle_transform_storage_domain.py --help >/dev/null
