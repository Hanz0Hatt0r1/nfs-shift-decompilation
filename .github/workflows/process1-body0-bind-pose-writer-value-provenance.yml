name: process1-body0-bind-pose-writer-value-provenance

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tests/test_ghidra_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_target_role.py'
      - 'tests/test_ghidra_bmw_body0_bind_pose_writer_target_role.py'
      - 'tools/ghidra/analyze_fun_007afdd0_scalar_provenance.py'
      - 'tests/test_ghidra_fun_007afdd0_scalar_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_POSE_WRITER_VALUE_PROVENANCE.md'
      - '.github/workflows/process1-body0-bind-pose-writer-value-provenance.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tests/test_ghidra_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_target_role.py'
      - 'tests/test_ghidra_bmw_body0_bind_pose_writer_target_role.py'
      - 'tools/ghidra/analyze_fun_007afdd0_scalar_provenance.py'
      - 'tests/test_ghidra_fun_007afdd0_scalar_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_POSE_WRITER_VALUE_PROVENANCE.md'
      - '.github/workflows/process1-body0-bind-pose-writer-value-provenance.yml'

jobs:
  pose-writer-value-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run value provenance frontier regression
        run: python -m pytest -q tests/test_ghidra_bmw_body0_bind_pose_writer_value_provenance.py
      - name: Preserve target-role regression
        run: python -m pytest -q tests/test_ghidra_bmw_body0_bind_pose_writer_target_role.py
      - name: Preserve existing p-code/x87 fail-closed policy
        run: python -m pytest -q tests/test_ghidra_fun_007afdd0_scalar_provenance.py
      - name: Verify CLI surface
        run: python tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py --help >/dev/null
