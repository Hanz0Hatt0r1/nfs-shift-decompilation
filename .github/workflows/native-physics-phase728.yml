name: native-physics-phase728

on:
  push:
    paths:
      - 'evidence/fun_007618f0_local_sample_producer.json'
      - 'native_runtime/include/shift_fun_007618f0_local_sample_producer.hpp'
      - 'native_runtime/src/fun_007618f0_local_sample_producer.cpp'
      - 'native_runtime/tests/fun_007618f0_local_sample_producer_check.cpp'
      - 'native_runtime/cmake/phase727.cmake'
      - 'native_runtime/cmake/phase728.cmake'
      - 'tests/test_s6_fun_007618f0_local_sample_producer.py'
      - '.github/workflows/native-physics-phase728.yml'
  pull_request:
    paths:
      - 'evidence/fun_007618f0_local_sample_producer.json'
      - 'native_runtime/include/shift_fun_007618f0_local_sample_producer.hpp'
      - 'native_runtime/src/fun_007618f0_local_sample_producer.cpp'
      - 'native_runtime/tests/fun_007618f0_local_sample_producer_check.cpp'
      - 'native_runtime/cmake/phase727.cmake'
      - 'native_runtime/cmake/phase728.cmake'
      - 'tests/test_s6_fun_007618f0_local_sample_producer.py'
      - '.github/workflows/native-physics-phase728.yml'

jobs:
  fun-007618f0-local-sample-producer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 728 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007618f0_local_sample_producer.py
          tests/test_s6_fun_00765c40_world_position_transform.py
          tests/test_s6_fun_00765c40_query_input_boundary.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 728 and composed world-position checks
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007618f0_local_sample_producer_check
          shift_runtime_fun_00765c40_world_position_transform_check
          shift_runtime_fun_00765c40_query_input_boundary_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007618f0_local_sample_producer|shift_runtime_fun_00765c40_world_position_transform|shift_runtime_fun_00765c40_query_input_boundary)$'

      - name: Verify Phase 728 report
        run: |
          mkdir -p out/native-physics-phase728
          native_runtime/build/shift_runtime_fun_007618f0_local_sample_producer_check \
            > out/native-physics-phase728/fun_007618f0_local_sample_producer.json
          grep -q '"format":"SHIFT.Fun007618f0LocalSampleProducer/1"' \
            out/native-physics-phase728/fun_007618f0_local_sample_producer.json
          grep -q '"midpoint_scale":0.5' \
            out/native-physics-phase728/fun_007618f0_local_sample_producer.json
          grep -q '"phase727_transform_composes":true' \
            out/native-physics-phase728/fun_007618f0_local_sample_producer.json
          grep -q '"input_storage_owners_joined":false' \
            out/native-physics-phase728/fun_007618f0_local_sample_producer.json
