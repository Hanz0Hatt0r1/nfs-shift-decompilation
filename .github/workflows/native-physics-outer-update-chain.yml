concurrency:
  group: native-physics-outer-update-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  outer-update-chain-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Python regressions
        run: >-
          PYTHONPATH=src/physics:src/core python3 -m pytest -q
          tests/test_fun_00770e80_two_half_step_schedule_runtime.py
          tests/test_fun_0076d100_anchor_sequence_runtime.py
          tests/test_fun_00765470_wheel_feedback_join_runtime.py
          tests/test_fun_00763570_precomputed_feedback_join_runtime.py
          tests/test_matrix_vector_transform_runtime.py
          tests/test_fun_00763570_machine_feedback_join_runtime.py
          tests/test_fun_00770e80_composed_anchor_chain_runtime.py
          tests/test_explicit_outer_update_runtime_state.py
          tests/test_fun_00770e80_scalar_provider_anchor_chain_runtime.py
          tests/test_ci_workflow_migration_outer_update_chain.py

      - name: Validate Phase 687 machine evidence JSON
        run: python3 -m json.tool evidence/transform_machine_precision.json >/dev/null

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build consolidated native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_physics
          shift_runtime_constraint_sample_refresh_check
          shift_runtime_fun_00770e80_two_half_step_schedule_check
          shift_runtime_fun_0076d100_anchor_sequence_check
          shift_runtime_fun_00765470_wheel_feedback_join_check
          shift_runtime_fun_00763570_precomputed_feedback_join_check
          shift_runtime_fun_00763570_machine_feedback_join_check
          shift_runtime_fun_00770e80_composed_anchor_chain_check
          shift_runtime_explicit_outer_update_runtime_state_check
          shift_runtime_fun_00770e80_scalar_provider_anchor_chain_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_constraint_sample_refresh|shift_runtime_fun_00770e80_two_half_step_schedule|shift_runtime_fun_0076d100_anchor_sequence|shift_runtime_fun_00765470_wheel_feedback_join|shift_runtime_fun_00763570_precomputed_feedback_join|shift_runtime_fun_00763570_machine_feedback_join|shift_runtime_fun_00770e80_composed_anchor_chain|shift_runtime_explicit_outer_update_runtime_state|shift_runtime_fun_00770e80_scalar_provider_anchor_chain)$'

      - name: Compile machine precision discriminator regression
        run: |
          mkdir -p out/native-physics-outer-update-chain
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I native_runtime/include \
            native_runtime/tests/transform_machine_precision_check.cpp \
            native_runtime/build/libshift_runtime_physics.a \
            -o out/native-physics-outer-update-chain/transform_machine_precision_check

      - name: Verify native reports and semantic gates
        run: |
          OUT=out/native-physics-outer-update-chain
          mkdir -p "$OUT"

          native_runtime/build/shift_runtime_fun_00770e80_two_half_step_schedule_check > "$OUT/fun_00770e80_two_half_step_schedule.json"
          grep -q '"format":"SHIFT.NativeFun00770e80TwoHalfStepSchedule/1"' "$OUT/fun_00770e80_two_half_step_schedule.json"
          grep -q '"persistent_body_crosses_both_half_steps":true' "$OUT/fun_00770e80_two_half_step_schedule.json"
          grep -q '"callback_bodies_external":true' "$OUT/fun_00770e80_two_half_step_schedule.json"
          grep -q '"rendered_frame_cadence_proven":false' "$OUT/fun_00770e80_two_half_step_schedule.json"

          native_runtime/build/shift_runtime_fun_0076d100_anchor_sequence_check > "$OUT/fun_0076d100_anchor_sequence.json"
          grep -q '"format":"SHIFT.NativeFun0076d100AnchorSequence/1"' "$OUT/fun_0076d100_anchor_sequence.json"
          grep -q '"nested_outer_two_pass_schedule_proven":true' "$OUT/fun_0076d100_anchor_sequence.json"
          grep -q '"persistent_body_crosses_nested_schedule":true' "$OUT/fun_0076d100_anchor_sequence.json"
          grep -q '"intervening_local_work_modeled":false' "$OUT/fun_0076d100_anchor_sequence.json"
          grep -q '"complete_fun_0076d100_semantics":false' "$OUT/fun_0076d100_anchor_sequence.json"

          native_runtime/build/shift_runtime_fun_00765470_wheel_feedback_join_check > "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"format":"SHIFT.NativeFun00765470WheelFeedbackJoin/1"' "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"wheel_anchor_before_feedback_integration_proven":true' "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"phase679_join_reused":true' "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"persistent_body_result_preserved":true' "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"intervening_local_work_modeled":false' "$OUT/fun_00765470_wheel_feedback_join.json"
          grep -q '"complete_fun_00765470_semantics":false' "$OUT/fun_00765470_wheel_feedback_join.json"

          native_runtime/build/shift_runtime_fun_00763570_precomputed_feedback_join_check > "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"format":"SHIFT.NativeFun00763570PrecomputedFeedbackJoin/1"' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"native_fun_00763570_batch_used":true' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"phase685_join_reused":true' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"persistent_body_result_preserved":true' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"fun_007af010_implemented":false' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"complete_fun_00763570_semantics":false' "$OUT/fun_00763570_precomputed_feedback_join.json"
          grep -q '"complete_fun_00765470_semantics":false' "$OUT/fun_00763570_precomputed_feedback_join.json"

          "$OUT/transform_machine_precision_check" > "$OUT/transform_machine_precision.json"
          grep -q '"format":"SHIFT.NativeTransformMachinePrecision/1"' "$OUT/transform_machine_precision.json"
          grep -q '"qword_vector_operands_preserved":true' "$OUT/transform_machine_precision.json"
          grep -q '"qword_scalar_operand_preserved":true' "$OUT/transform_machine_precision.json"
          grep -q '"retail_add_order_preserved":true' "$OUT/transform_machine_precision.json"
          grep -q '"ambient_x87_control_word_proven":false' "$OUT/transform_machine_precision.json"

          native_runtime/build/shift_runtime_fun_00763570_machine_feedback_join_check > "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"format":"SHIFT.NativeFun00763570MachineFeedbackJoin/1"' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"fun_007af0a0_machine_helper_used":true' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"fun_007af010_machine_helper_used":true' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"phase686_join_reused":true' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"precomputed_reconstructed_vector_provider_removed":true' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"persistent_body_result_preserved":true' "$OUT/fun_00763570_machine_feedback_join.json"
          grep -q '"ambient_x87_control_word_proven":false' "$OUT/fun_00763570_machine_feedback_join.json"

          native_runtime/build/shift_runtime_fun_00770e80_composed_anchor_chain_check > "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"format":"SHIFT.NativeFun00770e80ComposedAnchorChain/1"' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"physics_pass_count":2' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"half_step_count":2' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"phase684_required_anchor_sequence_reused":true' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"phase688_machine_half_step_reused":true' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"persistent_body_bytes_carried_between_half_steps":true' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"per_half_step_solver_refresh_proven":false' "$OUT/fun_00770e80_composed_anchor_chain.json"
          grep -q '"rendered_frame_cadence_proven":false' "$OUT/fun_00770e80_composed_anchor_chain.json"

          native_runtime/build/shift_runtime_explicit_outer_update_runtime_state_check > "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"format":"SHIFT.NativeExplicitOuterUpdateRuntimeState/1"' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"explicit_update_count":2' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"phase689_composed_outer_update_reused":true' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"persistent_body_bytes_carried_between_explicit_updates":true' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"workspace_admission_required":true' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"participant_identity_admission_required":true' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"fixed_step_auto_schedule":false' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"fun_007afdd0_machine_scalar_gate_closed":false' "$OUT/explicit_outer_update_runtime_state.json"
          grep -q '"rendered_frame_cadence_proven":false' "$OUT/explicit_outer_update_runtime_state.json"

          native_runtime/build/shift_runtime_fun_00770e80_scalar_provider_anchor_chain_check > "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"format":"SHIFT.NativeFun00770e80ScalarProviderAnchorChain/1"' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"scalar_provider_call_count":4' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"zero_noop_count":4' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"fun_007afdd0_source_core_used":true' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"arbitrary_basis_callback_external":false' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"machine_scalar_production_external":true' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"host_libm_substitution":false' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
          grep -q '"fixed_step_auto_schedule":false' "$OUT/fun_00770e80_scalar_provider_anchor_chain.json"
