name: process1-body0-bind-pose-writer-abi

on:
  pull_request:
    paths:
      - ".github/workflows/process1-body0-bind-pose-writer-abi.yml"
      - "tools/ghidra/join_bmw_body0_bind_pose_writer_abi.py"
      - "tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py"
      - "tools/ghidra/ShiftEvidenceExporter.java"
      - "tests/test_ghidra_bmw_body0_bind_pose_writer_abi.py"
      - "tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py"
      - "docs/PROCESS_1_BMW_BODY0_BIND_POSE_WRITER_ABI.md"
  workflow_dispatch:

jobs:
  pose-writer-abi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Regress pose-writer physical ABI join
        run: python -m pytest -q tests/test_ghidra_bmw_body0_bind_pose_writer_abi.py
      - name: Preserve prior callsite provenance regression
        run: python -m pytest -q tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py
      - name: Assert source exporter retains physical parameter storage
        run: |
          grep -Fq '"\\\"parameters\\\":" + params' tools/ghidra/ShiftEvidenceExporter.java
          grep -Fq 'p.getVariableStorage().toString()' tools/ghidra/ShiftEvidenceExporter.java
          grep -Fq 'p.getName()' tools/ghidra/ShiftEvidenceExporter.java
          grep -Fq 'p.getDataType().getDisplayName()' tools/ghidra/ShiftEvidenceExporter.java
