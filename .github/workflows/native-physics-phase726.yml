name: native-physics-phase726

on:
  push:
    paths:
      - 'evidence/fun_00765c40_query_input_boundary.json'
      - 'evidence/fun_00765c40_external_pass_result.json'
      - 'native_runtime/include/shift_fun_00765c40_query_input_boundary.hpp'
      - 'native_runtime/include/shift_fun_00765c40_external_pass_result.hpp'
      - 'native_runtime/include/shift_collision_query_contract.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_query_input_boundary_check.cpp'
      - 'native_runtime/tests/fun_00765c40_external_pass_result_check.cpp'
      - 'native_runtime/tests/collision_query_contract_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase725.cmake'
      - 'native_runtime/cmake/phase726.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_00765c40_query_input_boundary.py'
      - 'tests/test_s6_fun_00765c40_external_pass_result.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase726.yml'
  pull_request:
    paths:
      - 'evidence/fun_00765c40_query_input_boundary.json'
      - 'evidence/fun_00765c40_external_pass_result.json'
      - 'native_runtime/include/shift_fun_00765c40_query_input_boundary.hpp'
      - 'native_runtime/include/shift_fun_00765c40_external_pass_result.hpp'
      - 'native_runtime/include/shift_collision_query_contract.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_query_input_boundary_check.cpp'
      - 'native_runtime/tests/fun_00765c40_external_pass_result_check.cpp'
      - 'native_runtime/tests/collision_query_contract_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase725.cmake'
      - 'native_runtime/cmake/phase726.cmake'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_00765c40_query_input_boundary.py'
      - 'tests/test_s6_fun_00765c40_external_pass_result.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - '.github/workflows/native-physics-phase726.yml'

jobs:
  fun-00765c40-query-input-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 726 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00765c40_query_input_boundary.py
          tests/test_s6_fun_00765c40_external_pass_result.py
          tests/test_native_vehicle_external_provider_frontier_current.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 726 and dependent query/session regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00765c40_query_input_boundary_check
          shift_runtime_fun_00765c40_external_pass_result_check
          shift_runtime_collision_query_contract_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00765c40_query_input_boundary|shift_runtime_fun_00765c40_external_pass_result|shift_runtime_collision_query_contract|shift_runtime_fun_007594e0_session_angle|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 726 report
        run: |
          mkdir -p out/native-physics-phase726
          native_runtime/build/shift_runtime_fun_00765c40_query_input_boundary_check \
            > out/native-physics-phase726/fun_00765c40_query_input_boundary.json
          grep -q '"format":"SHIFT.Fun00765c40QueryInputBoundary/1"' \
            out/native-physics-phase726/fun_00765c40_query_input_boundary.json
          grep -q '"cache_handle_propagated":true' \
            out/native-physics-phase726/fun_00765c40_query_input_boundary.json
          grep -q '"world_position_producer_internalized":false' \
            out/native-physics-phase726/fun_00765c40_query_input_boundary.json
          grep -q '"collision_provider_internalized":false' \
            out/native-physics-phase726/fun_00765c40_query_input_boundary.json
