name: native-physics-phase727

on:
  push:
    paths:
      - 'evidence/fun_00765c40_world_position_transform.json'
      - 'native_runtime/include/shift_fun_00765c40_world_position_transform.hpp'
      - 'native_runtime/src/fun_00765c40_world_position_transform.cpp'
      - 'native_runtime/tests/fun_00765c40_world_position_transform_check.cpp'
      - 'native_runtime/cmake/phase726.cmake'
      - 'native_runtime/cmake/phase727.cmake'
      - 'tests/test_s6_fun_00765c40_world_position_transform.py'
      - '.github/workflows/native-physics-phase727.yml'
  pull_request:
    paths:
      - 'evidence/fun_00765c40_world_position_transform.json'
      - 'native_runtime/include/shift_fun_00765c40_world_position_transform.hpp'
      - 'native_runtime/src/fun_00765c40_world_position_transform.cpp'
      - 'native_runtime/tests/fun_00765c40_world_position_transform_check.cpp'
      - 'native_runtime/cmake/phase726.cmake'
      - 'native_runtime/cmake/phase727.cmake'
      - 'tests/test_s6_fun_00765c40_world_position_transform.py'
      - '.github/workflows/native-physics-phase727.yml'

jobs:
  fun-00765c40-world-position-transform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 727 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00765c40_world_position_transform.py
          tests/test_s6_fun_00765c40_query_input_boundary.py
          tests/test_native_vehicle_external_provider_frontier_current.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 727 and dependent query regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00765c40_world_position_transform_check
          shift_runtime_fun_00765c40_query_input_boundary_check
          shift_runtime_collision_query_contract_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00765c40_world_position_transform|shift_runtime_fun_00765c40_query_input_boundary|shift_runtime_collision_query_contract)$'

      - name: Verify Phase 727 report
        run: |
          mkdir -p out/native-physics-phase727
          native_runtime/build/shift_runtime_fun_00765c40_world_position_transform_check \
            > out/native-physics-phase727/fun_00765c40_world_position_transform.json
          grep -q '"format":"SHIFT.Fun00765c40WorldPositionTransform/1"' \
            out/native-physics-phase727/fun_00765c40_world_position_transform.json
          grep -q '"origin_add_native":true' \
            out/native-physics-phase727/fun_00765c40_world_position_transform.json
          grep -q '"local_sample_producer_internalized":false' \
            out/native-physics-phase727/fun_00765c40_world_position_transform.json
          grep -q '"per_pass_body_snapshot_joined":false' \
            out/native-physics-phase727/fun_00765c40_world_position_transform.json
