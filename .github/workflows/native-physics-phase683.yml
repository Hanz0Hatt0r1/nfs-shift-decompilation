name: native-physics-phase683

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_two_half_step_schedule_runtime.py'
      - 'tests/test_fun_00770e80_two_half_step_schedule_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_two_half_step_schedule.hpp'
      - 'native_runtime/src/fun_00770e80_two_half_step_schedule.cpp'
      - 'native_runtime/tests/fun_00770e80_two_half_step_schedule_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE683_FUN_00770E80_TWO_HALF_STEP_SCHEDULE.md'
      - '.github/workflows/native-physics-phase683.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_two_half_step_schedule_runtime.py'
      - 'tests/test_fun_00770e80_two_half_step_schedule_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_two_half_step_schedule.hpp'
      - 'native_runtime/src/fun_00770e80_two_half_step_schedule.cpp'
      - 'native_runtime/tests/fun_00770e80_two_half_step_schedule_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE683_FUN_00770E80_TWO_HALF_STEP_SCHEDULE.md'
      - '.github/workflows/native-physics-phase683.yml'

jobs:
  fun-00770e80-two-half-step-schedule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 683 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_two_half_step_schedule_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 683 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_two_half_step_schedule_check

      - name: Run Phase 683 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_two_half_step_schedule$'

      - name: Verify Phase 683 report
        run: |
          mkdir -p out/native-physics-phase683
          native_runtime/build/shift_runtime_fun_00770e80_two_half_step_schedule_check \
            > out/native-physics-phase683/fun_00770e80_two_half_step_schedule.json
          grep -q '"format":"SHIFT.NativeFun00770e80TwoHalfStepSchedule/1"' \
            out/native-physics-phase683/fun_00770e80_two_half_step_schedule.json
          grep -q '"persistent_body_crosses_both_half_steps":true' \
            out/native-physics-phase683/fun_00770e80_two_half_step_schedule.json
          grep -q '"callback_bodies_external":true' \
            out/native-physics-phase683/fun_00770e80_two_half_step_schedule.json
          grep -q '"rendered_frame_cadence_proven":false' \
            out/native-physics-phase683/fun_00770e80_two_half_step_schedule.json
