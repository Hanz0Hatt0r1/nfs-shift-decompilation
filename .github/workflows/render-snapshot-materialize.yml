name: render-snapshot-materialize

on:
  push:
    paths:
      - "docs/render-snapshots/*.png.b64"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize PNG snapshots
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for src in docs/render-snapshots/*.png.b64; do
            dst="${src%.b64}"
            base64 --decode "$src" > "$dst"
            file "$dst"
          done
      - name: Commit rendered PNG snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/render-snapshots/*.png
          if git diff --cached --quiet; then
            echo "No snapshot changes."
            exit 0
          fi
          git commit -m "docs: materialize rendered scene snapshots"
          git push
