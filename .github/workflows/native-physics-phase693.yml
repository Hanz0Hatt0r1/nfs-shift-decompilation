name: native-physics-phase693

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_contact_outer_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_contact_outer_provider_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_contact_outer_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_00770e80_contact_outer_provider_chain_check.cpp'
      - 'native_runtime/cmake/phase691.cmake'
      - 'native_runtime/cmake/phase693.cmake'
      - 'docs/PHASE693_FUN_007675F0_CONTACT_OUTER_PROVIDER_JOIN.md'
      - '.github/workflows/native-physics-phase693.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_contact_outer_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_contact_outer_provider_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_contact_outer_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_00770e80_contact_outer_provider_chain_check.cpp'
      - 'native_runtime/cmake/phase691.cmake'
      - 'native_runtime/cmake/phase693.cmake'
      - 'docs/PHASE693_FUN_007675F0_CONTACT_OUTER_PROVIDER_JOIN.md'
      - '.github/workflows/native-physics-phase693.yml'

jobs:
  fun-007675f0-contact-outer-provider-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 693 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_contact_outer_provider_chain_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 693 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_contact_outer_provider_chain_check

      - name: Run Phase 693 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_contact_outer_provider_chain$'

      - name: Verify Phase 693 report
        run: |
          mkdir -p out/native-physics-phase693
          native_runtime/build/shift_runtime_fun_00770e80_contact_outer_provider_chain_check \
            > out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"format":"SHIFT.NativeFun00770e80ContactOuterProviderChain/1"' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"fun_007675f0_typed_input_provider":true' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"fun_007675f0_native_kernel_internal":true' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"fun_007675f0_arbitrary_callback_external":false' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"fun_007675f0_input_production_external":true' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"machine_scalar_production_external":true' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase693/fun_00770e80_contact_outer_provider_chain.json
