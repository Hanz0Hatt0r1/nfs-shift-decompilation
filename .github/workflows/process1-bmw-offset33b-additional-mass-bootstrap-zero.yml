name: Process 1 BMW offset33b additional mass object correction

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ADDITIONAL_MASS_BOOTSTRAP_ZERO.md'
      - '.github/workflows/process1-bmw-offset33b-additional-mass-bootstrap-zero.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ADDITIONAL_MASS_BOOTSTRAP_ZERO.md'
      - '.github/workflows/process1-bmw-offset33b-additional-mass-bootstrap-zero.yml'

jobs:
  correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Enforce retraction and actual-object frontier
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py
      - name: Preserve source-backed offset33b store frontier regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_store_provenance.py
      - name: Verify corrected CLI surface
        run: python tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py --help >/dev/null
