name: native-physics-phase748

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00713630_reference_source.hpp'
      - 'native_runtime/tests/fun_00713630_reference_source_check.cpp'
      - 'native_runtime/cmake/phase747.cmake'
      - 'native_runtime/cmake/phase748.cmake'
      - 'tests/test_s6_fun_00713630_reference_source.py'
      - 'evidence/fun_00713630_reference_source.json'
      - 'evidence/phase748_next_blocker.md'
      - 'docs/PHASE748_FUN_00713630_REFERENCE_SOURCE.md'
      - 'docs/PHASE748_SCOPE.md'
      - '.github/workflows/native-physics-phase748.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00713630_reference_source.hpp'
      - 'native_runtime/tests/fun_00713630_reference_source_check.cpp'
      - 'native_runtime/cmake/phase747.cmake'
      - 'native_runtime/cmake/phase748.cmake'
      - 'tests/test_s6_fun_00713630_reference_source.py'
      - 'evidence/fun_00713630_reference_source.json'
      - 'evidence/phase748_next_blocker.md'
      - 'docs/PHASE748_FUN_00713630_REFERENCE_SOURCE.md'
      - 'docs/PHASE748_SCOPE.md'
      - '.github/workflows/native-physics-phase748.yml'

jobs:
  reference-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 748 Python regression
        run: python3 -m pytest -q tests/test_s6_fun_00713630_reference_source.py

      - name: Validate Phase 748 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00713630_reference_source.json').read_text())
          assert e['format'] == 'SHIFT.Fun00713630ReferenceSource/1'
          assert e['ready'] is True
          assert e['participant_input']['sample_count'] == 3
          assert e['manager_geometry']['record_stride'] == '0x1fa0'
          assert e['native_join']['FSIN_FCOS_x87_path_native_on_x86'] is True
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['contact_response_provider_removed'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 748 and Phase 747 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00713630_reference_source_check
          shift_runtime_fun_00766510_shared_reference_vector_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00713630_reference_source|shift_runtime_fun_00766510_shared_reference_vector)$'

      - name: Verify native report
        run: |
          mkdir -p out/native-physics-phase748
          native_runtime/build/shift_runtime_fun_00713630_reference_source_check \
            > out/native-physics-phase748/fun_00713630_reference_source.json
          grep -q '"format":"SHIFT.Fun00713630ReferenceSource/1"' \
            out/native-physics-phase748/fun_00713630_reference_source.json
          grep -q '"sample_count":3' \
            out/native-physics-phase748/fun_00713630_reference_source.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-phase748/fun_00713630_reference_source.json
