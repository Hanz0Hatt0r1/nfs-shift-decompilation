name: native-physics-phase705

on:
  push:
    paths:
      - 'src/physics/bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'native_runtime/include/shift_bmw_vehicle_world_matrix_runtime_handoff.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/bmw_vehicle_world_matrix_runtime_handoff.cpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/bmw_vehicle_world_matrix_runtime_handoff_check.cpp'
      - 'native_runtime/cmake/phase704.cmake'
      - 'native_runtime/cmake/phase705.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'docs/PHASE705_BMW_VEHICLE_WORLD_MATRIX_RUNTIME_HANDOFF.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/native-physics-phase705.yml'
  pull_request:
    paths:
      - 'src/physics/bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'native_runtime/include/shift_bmw_vehicle_world_matrix_runtime_handoff.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/bmw_vehicle_world_matrix_runtime_handoff.cpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/bmw_vehicle_world_matrix_runtime_handoff_check.cpp'
      - 'native_runtime/cmake/phase704.cmake'
      - 'native_runtime/cmake/phase705.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'docs/PHASE705_BMW_VEHICLE_WORLD_MATRIX_RUNTIME_HANDOFF.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/native-physics-phase705.yml'

jobs:
  bmw-vehicle-world-matrix-runtime-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 705/707 Python oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py
          tests/test_global_vehicle_body_owner_selection_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 700, 703, 704, 705 and 707 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_vehicle_body_pose_runtime_handoff_check
          shift_runtime_global_vehicle_body_owner_selection_check
          shift_runtime_bmw_body0_vhf_world_matrix_composition_check
          shift_runtime_bmw_vehicle_world_matrix_runtime_handoff_check
          shift_runtime_retail_global_vehicle_body_owner_identity_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_vehicle_body_pose_runtime_handoff|shift_runtime_global_vehicle_body_owner_selection|shift_runtime_bmw_body0_vhf_world_matrix_composition|shift_runtime_bmw_vehicle_world_matrix_runtime_handoff|shift_runtime_retail_global_vehicle_body_owner_identity)$'

      - name: Verify Phase 705 report
        run: |
          mkdir -p out/native-physics-phase705
          native_runtime/build/shift_runtime_bmw_vehicle_world_matrix_runtime_handoff_check \
            > out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"format":"SHIFT.NativeBMWVehicleWorldMatrixRuntimeHandoff/1"' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"phase":705' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"phase703_identity_admission_reused":true' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"phase700_runtime_pose_handoff_reused":true' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"phase704_composition_reused":true' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"selected_body_index":0' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"current_retail_identity_ready":true' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"retail_identity_injected_by_caller":false' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"current_retail_body0_bind_ready":false' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"current_retail_world_matrix_ready":false' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"runtime_state_mutated":false' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"phase646_matrix_output":true' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
          grep -q '"live_vulkan_buffer_mutation_enabled":false' \
            out/native-physics-phase705/bmw_vehicle_world_matrix_runtime_handoff.json
