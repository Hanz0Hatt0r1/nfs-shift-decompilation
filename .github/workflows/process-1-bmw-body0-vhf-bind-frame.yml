name: process-1-bmw-body0-vhf-bind-frame

on:
  push:
    paths:
      - 'tools/ghidra/build_bmw_body0_vhf_bind_frame_frontier.py'
      - 'tests/test_ghidra_bmw_body0_vhf_bind_frame_frontier.py'
      - 'docs/PROCESS_1_BMW_BODY0_VHF_BIND_FRAME_FRONTIER.md'
      - '.github/workflows/process-1-bmw-body0-vhf-bind-frame.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_bmw_body0_vhf_bind_frame_frontier.py'
      - 'tests/test_ghidra_bmw_body0_vhf_bind_frame_frontier.py'
      - 'docs/PROCESS_1_BMW_BODY0_VHF_BIND_FRAME_FRONTIER.md'
      - '.github/workflows/process-1-bmw-body0-vhf-bind-frame.yml'

jobs:
  bind-frame-frontier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run BODY0/VHF bind-frame regressions
        run: python -m pytest -q tests/test_ghidra_bmw_body0_vhf_bind_frame_frontier.py
      - name: Verify CLI surface
        run: python tools/ghidra/build_bmw_body0_vhf_bind_frame_frontier.py --help >/dev/null
