name: native-physics-phase687

on:
  push:
    paths:
      - 'src/core/matrix_vector_transform_runtime.py'
      - 'tests/test_matrix_vector_transform_runtime.py'
      - 'native_runtime/include/shift_constraint_sample_refresh.hpp'
      - 'native_runtime/src/constraint_sample_refresh.cpp'
      - 'native_runtime/tests/transform_machine_precision_check.cpp'
      - 'evidence/transform_machine_precision.json'
      - 'docs/PHASE687_MACHINE_BACKED_TRANSFORM_PRECISION.md'
      - '.github/workflows/native-physics-phase687.yml'
  pull_request:
    paths:
      - 'src/core/matrix_vector_transform_runtime.py'
      - 'tests/test_matrix_vector_transform_runtime.py'
      - 'native_runtime/include/shift_constraint_sample_refresh.hpp'
      - 'native_runtime/src/constraint_sample_refresh.cpp'
      - 'native_runtime/tests/transform_machine_precision_check.cpp'
      - 'evidence/transform_machine_precision.json'
      - 'docs/PHASE687_MACHINE_BACKED_TRANSFORM_PRECISION.md'
      - '.github/workflows/native-physics-phase687.yml'

jobs:
  transform-machine-precision:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run canonical transform contract regression
        run: >-
          PYTHONPATH=src/core python3 -m pytest -q
          tests/test_matrix_vector_transform_runtime.py

      - name: Validate machine evidence JSON
        run: python3 -m json.tool evidence/transform_machine_precision.json >/dev/null

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build corrected physics library and Phase 629 regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_physics shift_runtime_constraint_sample_refresh_check

      - name: Run existing constraint refresh regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_constraint_sample_refresh$'

      - name: Compile Phase 687 discriminator regression
        run: |
          mkdir -p out/native-physics-phase687
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -I native_runtime/include \
            native_runtime/tests/transform_machine_precision_check.cpp \
            native_runtime/build/libshift_runtime_physics.a \
            -o out/native-physics-phase687/transform_machine_precision_check

      - name: Verify Phase 687 report
        run: |
          out/native-physics-phase687/transform_machine_precision_check \
            > out/native-physics-phase687/transform_machine_precision.json
          grep -q '"format":"SHIFT.NativeTransformMachinePrecision/1"' \
            out/native-physics-phase687/transform_machine_precision.json
          grep -q '"qword_vector_operands_preserved":true' \
            out/native-physics-phase687/transform_machine_precision.json
          grep -q '"qword_scalar_operand_preserved":true' \
            out/native-physics-phase687/transform_machine_precision.json
          grep -q '"retail_add_order_preserved":true' \
            out/native-physics-phase687/transform_machine_precision.json
          grep -q '"ambient_x87_control_word_proven":false' \
            out/native-physics-phase687/transform_machine_precision.json
