name: native-physics-phase686

on:
  push:
    paths:
      - 'src/physics/fun_00763570_precomputed_feedback_join_runtime.py'
      - 'tests/test_fun_00763570_precomputed_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00763570_precomputed_feedback_join.hpp'
      - 'native_runtime/src/fun_00763570_precomputed_feedback_join.cpp'
      - 'native_runtime/tests/fun_00763570_precomputed_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE686_FUN_00763570_PRECOMPUTED_FEEDBACK_JOIN.md'
      - '.github/workflows/native-physics-phase686.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00763570_precomputed_feedback_join_runtime.py'
      - 'tests/test_fun_00763570_precomputed_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00763570_precomputed_feedback_join.hpp'
      - 'native_runtime/src/fun_00763570_precomputed_feedback_join.cpp'
      - 'native_runtime/tests/fun_00763570_precomputed_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE686_FUN_00763570_PRECOMPUTED_FEEDBACK_JOIN.md'
      - '.github/workflows/native-physics-phase686.yml'

jobs:
  fun-00763570-precomputed-feedback-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 686 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00763570_precomputed_feedback_join_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 686 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00763570_precomputed_feedback_join_check

      - name: Run Phase 686 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00763570_precomputed_feedback_join$'

      - name: Verify Phase 686 report
        run: |
          mkdir -p out/native-physics-phase686
          native_runtime/build/shift_runtime_fun_00763570_precomputed_feedback_join_check \
            > out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"format":"SHIFT.NativeFun00763570PrecomputedFeedbackJoin/1"' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"native_fun_00763570_batch_used":true' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"phase685_join_reused":true' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"persistent_body_result_preserved":true' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"fun_007af010_implemented":false' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"complete_fun_00763570_semantics":false' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
          grep -q '"complete_fun_00765470_semantics":false' \
            out/native-physics-phase686/fun_00763570_precomputed_feedback_join.json
