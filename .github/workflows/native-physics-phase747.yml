name: native-physics-phase747

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_shared_reference_vector.hpp'
      - 'native_runtime/tests/fun_00766510_shared_reference_vector_check.cpp'
      - 'native_runtime/cmake/phase746.cmake'
      - 'native_runtime/cmake/phase747.cmake'
      - 'tests/test_s6_fun_00766510_shared_reference_vector.py'
      - 'evidence/fun_00766510_shared_reference_vector.json'
      - 'evidence/phase747_next_blocker.md'
      - 'docs/PHASE747_FUN_00766510_SHARED_REFERENCE_VECTOR.md'
      - 'docs/PHASE747_SCOPE.md'
      - '.github/workflows/native-physics-phase747.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_shared_reference_vector.hpp'
      - 'native_runtime/tests/fun_00766510_shared_reference_vector_check.cpp'
      - 'native_runtime/cmake/phase746.cmake'
      - 'native_runtime/cmake/phase747.cmake'
      - 'tests/test_s6_fun_00766510_shared_reference_vector.py'
      - 'evidence/fun_00766510_shared_reference_vector.json'
      - 'evidence/phase747_next_blocker.md'
      - 'docs/PHASE747_FUN_00766510_SHARED_REFERENCE_VECTOR.md'
      - 'docs/PHASE747_SCOPE.md'
      - '.github/workflows/native-physics-phase747.yml'

jobs:
  shared-reference-vector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run focused Phase 747 regressions
        run: python3 -m pytest -q tests/test_s6_fun_00766510_shared_reference_vector.py

      - name: Validate Phase 747 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00766510_shared_reference_vector.json').read_text())
          assert e['format'] == 'SHIFT.Fun00766510SharedReferenceVector/1'
          assert e['ready'] is True
          assert e['owner_chain']['participant_source_offsets'] == ['0x16b4','0x16b8','0x16bc']
          assert e['writer']['value_is_immutable_setup_constant'] is False
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['contact_response_provider_removed'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 747 regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_shared_reference_vector_check

      - name: Run focused CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00766510_shared_reference_vector$'

      - name: Verify Phase 747 native report
        run: |
          mkdir -p out/native-physics-phase747
          native_runtime/build/shift_runtime_fun_00766510_shared_reference_vector_check \
            > out/native-physics-phase747/fun_00766510_shared_reference_vector.json
          grep -q '"format":"SHIFT.Fun00766510SharedReferenceVector/1"' \
            out/native-physics-phase747/fun_00766510_shared_reference_vector.json
          grep -q '"explicit_f32_to_f64_widening":true' \
            out/native-physics-phase747/fun_00766510_shared_reference_vector.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-phase747/fun_00766510_shared_reference_vector.json
