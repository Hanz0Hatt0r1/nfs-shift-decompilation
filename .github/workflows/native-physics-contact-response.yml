name: native-physics-contact-response

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_response_config.hpp'
      - 'native_runtime/include/shift_fun_00766510_direct_accumulator_surface.hpp'
      - 'native_runtime/tests/fun_00766510_response_config_check.cpp'
      - 'native_runtime/tests/fun_00766510_direct_accumulator_surface_check.cpp'
      - 'native_runtime/cmake/phase751.cmake'
      - 'native_runtime/cmake/phase752.cmake'
      - 'native_runtime/cmake/phase753.cmake'
      - 'tests/test_s6_fun_00766510_response_config.py'
      - 'tests/test_s6_fun_00766510_direct_accumulator_surface.py'
      - 'evidence/fun_00766510_response_config_native.json'
      - 'evidence/fun_00766510_direct_accumulator_surface_native.json'
      - 'docs/PHASE752_FUN_00766510_RESPONSE_CONFIG.md'
      - 'docs/PHASE753_FUN_00766510_DIRECT_ACCUMULATOR_SURFACE.md'
      - 'coordination/ci_migrations/native_physics_contact_response_752_753.json'
      - 'tests/test_ci_workflow_migration_contact_response.py'
      - '.github/workflows/native-physics-contact-response.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_response_config.hpp'
      - 'native_runtime/include/shift_fun_00766510_direct_accumulator_surface.hpp'
      - 'native_runtime/tests/fun_00766510_response_config_check.cpp'
      - 'native_runtime/tests/fun_00766510_direct_accumulator_surface_check.cpp'
      - 'native_runtime/cmake/phase751.cmake'
      - 'native_runtime/cmake/phase752.cmake'
      - 'native_runtime/cmake/phase753.cmake'
      - 'tests/test_s6_fun_00766510_response_config.py'
      - 'tests/test_s6_fun_00766510_direct_accumulator_surface.py'
      - 'evidence/fun_00766510_response_config_native.json'
      - 'evidence/fun_00766510_direct_accumulator_surface_native.json'
      - 'docs/PHASE752_FUN_00766510_RESPONSE_CONFIG.md'
      - 'docs/PHASE753_FUN_00766510_DIRECT_ACCUMULATOR_SURFACE.md'
      - 'coordination/ci_migrations/native_physics_contact_response_752_753.json'
      - 'tests/test_ci_workflow_migration_contact_response.py'
      - '.github/workflows/native-physics-contact-response.yml'
  workflow_dispatch:

concurrency:
  group: native-physics-contact-response-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contact-response-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run contact-response Python regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00766510_response_config.py
          tests/test_s6_fun_00766510_direct_accumulator_surface.py

      - name: Validate response-config evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00766510_response_config_native.json').read_text())
          assert e['format'] == 'SHIFT.Fun00766510ResponseConfig/1'
          assert e['ready'] is True
          assert e['native_contract']['table_entry_count'] == 6
          assert e['persistent_refresh']['setup_constant'] is False
          assert e['scope']['runtime_curve_scale_table_chain_internalized'] is False
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['contact_response_provider_removed'] is False
          PY

      - name: Validate direct-accumulator evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00766510_direct_accumulator_surface_native.json').read_text())
          assert e['format'] == 'SHIFT.Fun00766510DirectAccumulatorSurface/1'
          assert e['ready'] is True
          assert e['accumulator']['direct_site_count'] == 4
          assert e['native_contract']['four_sites_batched_or_reordered'] is False
          assert e['scope']['whole_caller_accumulator_closed'] is False
          assert e['scope']['external_provider_count_after'] == 7
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build consolidated contact-response regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_direct_accumulator_surface_check
          shift_runtime_fun_00766510_response_config_check
          shift_runtime_fun_00766510_optional_response_branch_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_direct_accumulator_surface|shift_runtime_fun_00766510_response_config|shift_runtime_fun_00766510_optional_response_branch)$'

      - name: Verify response-config native report
        run: |
          mkdir -p out/native-physics-contact-response
          native_runtime/build/shift_runtime_fun_00766510_response_config_check \
            > out/native-physics-contact-response/fun_00766510_response_config.json
          grep -q '"format":"SHIFT.Fun00766510ResponseConfig/1"' \
            out/native-physics-contact-response/fun_00766510_response_config.json
          grep -q '"derived_scale_offset":"0x3908"' \
            out/native-physics-contact-response/fun_00766510_response_config.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-contact-response/fun_00766510_response_config.json

      - name: Verify direct-accumulator native report
        run: |
          native_runtime/build/shift_runtime_fun_00766510_direct_accumulator_surface_check \
            > out/native-physics-contact-response/fun_00766510_direct_accumulator_surface.json
          grep -q '"format":"SHIFT.Fun00766510DirectAccumulatorSurface/1"' \
            out/native-physics-contact-response/fun_00766510_direct_accumulator_surface.json
          grep -q '"direct_site_count":4' \
            out/native-physics-contact-response/fun_00766510_direct_accumulator_surface.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-contact-response/fun_00766510_direct_accumulator_surface.json
