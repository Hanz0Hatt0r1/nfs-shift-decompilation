  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_later_response_branch.hpp'
      - 'native_runtime/include/shift_fun_00766510_early_response_branch.hpp'
      - 'native_runtime/include/shift_fun_00766510_optional_response_branch.hpp'
      - 'native_runtime/include/shift_fun_00766510_response_config.hpp'
      - 'native_runtime/include/shift_fun_00766510_direct_accumulator_surface.hpp'
      - 'native_runtime/tests/fun_00766510_later_response_branch_check.cpp'
      - 'native_runtime/tests/fun_00766510_early_response_branch_check.cpp'
      - 'native_runtime/tests/fun_00766510_optional_response_branch_check.cpp'
      - 'native_runtime/tests/fun_00766510_response_config_check.cpp'
      - 'native_runtime/tests/fun_00766510_direct_accumulator_surface_check.cpp'
      - 'native_runtime/cmake/phase748.cmake'
