name: native-physics-phase707

on:
  push:
    paths:
      - '.github/workflows/native-physics-phase707.yml'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'src/physics/bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'src/physics/persistent_bmw_vehicle_world_transform_runtime.py'
      - 'tests/test_global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'tests/test_persistent_bmw_vehicle_world_transform_runtime.py'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/retail_global_vehicle_body_owner_identity_check.cpp'
      - 'native_runtime/tests/global_vehicle_body_owner_selection_check.cpp'
      - 'native_runtime/tests/bmw_vehicle_world_matrix_runtime_handoff_check.cpp'
      - 'native_runtime/tests/persistent_bmw_vehicle_world_transform_check.cpp'
      - 'native_runtime/cmake/phase706.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'docs/PHASE703_BMW_CHASSIS_BODY_SELECTION_GATE.md'
      - 'docs/PHASE705_BMW_VEHICLE_WORLD_MATRIX_RUNTIME_HANDOFF.md'
      - 'docs/PHASE706_PERSISTENT_BMW_VEHICLE_WORLD_TRANSFORM.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
  pull_request:
    paths:
      - '.github/workflows/native-physics-phase707.yml'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'src/physics/bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'src/physics/persistent_bmw_vehicle_world_transform_runtime.py'
      - 'tests/test_global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py'
      - 'tests/test_persistent_bmw_vehicle_world_transform_runtime.py'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/retail_global_vehicle_body_owner_identity_check.cpp'
      - 'native_runtime/tests/global_vehicle_body_owner_selection_check.cpp'
      - 'native_runtime/tests/bmw_vehicle_world_matrix_runtime_handoff_check.cpp'
      - 'native_runtime/tests/persistent_bmw_vehicle_world_transform_check.cpp'
      - 'native_runtime/cmake/phase706.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'docs/PHASE703_BMW_CHASSIS_BODY_SELECTION_GATE.md'
      - 'docs/PHASE705_BMW_VEHICLE_WORLD_MATRIX_RUNTIME_HANDOFF.md'
      - 'docs/PHASE706_PERSISTENT_BMW_VEHICLE_WORLD_TRANSFORM.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'

jobs:
  retail-global-vehicle-body-owner-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Python reference regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_global_vehicle_body_owner_selection_runtime.py
          tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py
          tests/test_persistent_bmw_vehicle_world_transform_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build identity through persistent transform regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_global_vehicle_body_owner_selection_check
          shift_runtime_bmw_vehicle_world_matrix_runtime_handoff_check
          shift_runtime_persistent_bmw_vehicle_world_transform_check
          shift_runtime_retail_global_vehicle_body_owner_identity_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_global_vehicle_body_owner_selection|shift_runtime_bmw_vehicle_world_matrix_runtime_handoff|shift_runtime_persistent_bmw_vehicle_world_transform|shift_runtime_retail_global_vehicle_body_owner_identity)$'

      - name: Verify Phase 707 report
        run: |
          mkdir -p out/native-physics-phase707
          native_runtime/build/shift_runtime_retail_global_vehicle_body_owner_identity_check \
            > out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"format":"SHIFT.NativeRetailGlobalVehicleBodyOwnerIdentity/1"' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"phase":707' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"process1_contract":"SHIFT.GlobalVehicleBodyOwnerIdentity/1"' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"process1_pr":1208' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"retail_identity_ready":true' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"retail_selected_BODY_index":0' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"manual_identity_argument_removed_from_retail_wrapper":true' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"phase700_runtime_handoff_reused":true' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"phase706_commit_reused":true' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"current_retail_BODY0_bind_ready":false' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"synthetic_BODY0_bind_is_retail_proof":false' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase707/retail_global_vehicle_body_owner_identity.json
