name: native-physics-phase680

on:
  push:
    paths:
      - 'tools/ghidra/ShiftFunctionInstructionExporter.java'
      - 'tools/ghidra/analyze_fun_007afdd0_basis_rotation.py'
      - 'tools/ghidra/run_fun_007afdd0_basis_rotation.sh'
      - 'tests/test_ghidra_fun_007afdd0_basis_rotation.py'
      - 'docs/PHASE680_FUN_007AFDD0_STATIC_FREEZE.md'
      - '.github/workflows/native-physics-phase680.yml'
  pull_request:
    paths:
      - 'tools/ghidra/ShiftFunctionInstructionExporter.java'
      - 'tools/ghidra/analyze_fun_007afdd0_basis_rotation.py'
      - 'tools/ghidra/run_fun_007afdd0_basis_rotation.sh'
      - 'tests/test_ghidra_fun_007afdd0_basis_rotation.py'
      - 'docs/PHASE680_FUN_007AFDD0_STATIC_FREEZE.md'
      - '.github/workflows/native-physics-phase680.yml'

jobs:
  fun-007afdd0-static-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse targeted Ghidra runner
        run: bash -n tools/ghidra/run_fun_007afdd0_basis_rotation.sh

      - name: Verify structured p-code exporter fields
        run: |
          grep -q '"\\\"output\\\":"' tools/ghidra/ShiftFunctionInstructionExporter.java
          grep -q '"\\\"inputs\\\":\\["' tools/ghidra/ShiftFunctionInstructionExporter.java
          grep -q 'Varnode' tools/ghidra/ShiftFunctionInstructionExporter.java

      - name: Run Phase 680 analyzer regression
        run: python -m pytest -q tests/test_ghidra_fun_007afdd0_basis_rotation.py

      - name: Verify fail-closed semantics remain explicit
        run: |
          grep -q 'rodrigues_semantics_assumed.*False' tools/ghidra/analyze_fun_007afdd0_basis_rotation.py
          grep -q 'normalization_assumed.*False' tools/ghidra/analyze_fun_007afdd0_basis_rotation.py
          grep -q 'FUN_007afdd0' docs/PHASE680_FUN_007AFDD0_STATIC_FREEZE.md
