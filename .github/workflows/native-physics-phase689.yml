name: native-physics-phase689

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_composed_anchor_chain_runtime.py'
      - 'tests/test_fun_00770e80_composed_anchor_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/tests/fun_00770e80_composed_anchor_chain_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE689_FUN_00770E80_COMPOSED_ANCHOR_CHAIN.md'
      - '.github/workflows/native-physics-phase689.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_composed_anchor_chain_runtime.py'
      - 'tests/test_fun_00770e80_composed_anchor_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/tests/fun_00770e80_composed_anchor_chain_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE689_FUN_00770E80_COMPOSED_ANCHOR_CHAIN.md'
      - '.github/workflows/native-physics-phase689.yml'

jobs:
  fun-00770e80-composed-anchor-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 689 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_composed_anchor_chain_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 689 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_composed_anchor_chain_check

      - name: Run Phase 689 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_composed_anchor_chain$'

      - name: Verify Phase 689 report
        run: |
          mkdir -p out/native-physics-phase689
          native_runtime/build/shift_runtime_fun_00770e80_composed_anchor_chain_check \
            > out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"format":"SHIFT.NativeFun00770e80ComposedAnchorChain/1"' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"physics_pass_count":2' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"half_step_count":2' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"phase684_required_anchor_sequence_reused":true' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"phase688_machine_half_step_reused":true' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"persistent_body_bytes_carried_between_half_steps":true' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"per_half_step_solver_refresh_proven":false' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
          grep -q '"rendered_frame_cadence_proven":false' \
            out/native-physics-phase689/fun_00770e80_composed_anchor_chain.json
