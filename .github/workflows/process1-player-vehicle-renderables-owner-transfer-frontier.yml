name: Process 1 player vehicle renderables owner transfer frontier

on:
  push:
    paths:
      - 'tools/ghidra/build_player_vehicle_renderables_owner_transfer_frontier.py'
      - 'tests/test_ghidra_player_vehicle_renderables_owner_transfer_frontier.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDERABLES_OWNER_TRANSFER_FRONTIER.md'
      - '.github/workflows/process1-player-vehicle-renderables-owner-transfer-frontier.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_player_vehicle_renderables_owner_transfer_frontier.py'
      - 'tests/test_ghidra_player_vehicle_renderables_owner_transfer_frontier.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDERABLES_OWNER_TRANSFER_FRONTIER.md'
      - '.github/workflows/process1-player-vehicle-renderables-owner-transfer-frontier.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run owner-transfer frontier regressions
        run: python -m pytest -q tests/test_ghidra_player_vehicle_renderables_owner_transfer_frontier.py
      - name: Verify CLI surface
        run: python tools/ghidra/build_player_vehicle_renderables_owner_transfer_frontier.py --help >/dev/null
