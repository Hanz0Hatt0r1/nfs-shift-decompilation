name: native-physics-phase677

on:
  push:
    paths:
      - ".github/workflows/native-physics-phase677.yml"
      - "native_runtime/include/shift_body_record_adapter.hpp"
      - "native_runtime/src/body_record_adapter.cpp"
      - "native_runtime/tests/body_record_adapter_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_record_adapter_runtime.py"
      - "tests/test_body_record_adapter_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/native-physics-phase677.yml"
      - "native_runtime/include/shift_body_record_adapter.hpp"
      - "native_runtime/src/body_record_adapter.cpp"
      - "native_runtime/tests/body_record_adapter_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_record_adapter_runtime.py"
      - "tests/test_body_record_adapter_runtime.py"

jobs:
  body-record-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            python3-pytest \
            libvulkan-dev \
            glslang-tools \
            libxcb1-dev
      - name: Run Phase 677 Python oracle regression
        run: PYTHONPATH=src/physics python3 -m pytest -q tests/test_body_record_adapter_runtime.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 677 native regression
        run: cmake --build native_runtime/build --config Release --parallel --target shift_runtime_body_record_adapter_check
      - name: Run Phase 677 CTest regression
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_body_record_adapter$'
      - name: Verify Phase 677 report
        run: |
          mkdir -p out/native-physics-phase677
          native_runtime/build/shift_runtime_body_record_adapter_check \
            | tee out/native-physics-phase677/body_record_adapter.json
          grep -q '"format":"SHIFT.NativeBodyRecordAdapter/1"' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"body_record_size":368' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"little_endian_codec_proven":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"writer_mask_preserved":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"retail_iteration_order_proven":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"size_mismatch_rejected":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"non_finite_rejected":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"basis_rotation_arithmetic_external":true' \
            out/native-physics-phase677/body_record_adapter.json
          grep -q '"render_frame_scheduler_proven":false' \
            out/native-physics-phase677/body_record_adapter.json
