name: Native runtime Phase 711

on:
  push:
    branches: [main]
    paths:
      - 'src/resources/offline_runtime_requirements.py'
      - 'src/resources/offline_vertical_slice_profile.py'
      - 'tools/run_native_vertical_slice.py'
      - 'tests/test_offline_runtime_requirements.py'
      - 'tests/test_runtime_requirement_admission.py'
      - 'tests/test_offline_vertical_slice_profile.py'
      - 'tests/test_run_native_vertical_slice.py'
      - 'tests/test_phase711_retail_identity_runtime_join.py'
      - 'docs/PHASE711_RETAIL_IDENTITY_RUNTIME_JOIN.md'
      - '.github/workflows/native-runtime-phase711.yml'
  pull_request:
    paths:
      - 'src/resources/offline_runtime_requirements.py'
      - 'src/resources/offline_vertical_slice_profile.py'
      - 'tools/run_native_vertical_slice.py'
      - 'tests/test_offline_runtime_requirements.py'
      - 'tests/test_runtime_requirement_admission.py'
      - 'tests/test_offline_vertical_slice_profile.py'
      - 'tests/test_run_native_vertical_slice.py'
      - 'tests/test_phase711_retail_identity_runtime_join.py'
      - 'docs/PHASE711_RETAIL_IDENTITY_RUNTIME_JOIN.md'
      - '.github/workflows/native-runtime-phase711.yml'

jobs:
  phase711:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Retail identity requirements/profile/launcher regressions
        run: |
          python -m pytest -q \
            tests/test_offline_runtime_requirements.py \
            tests/test_runtime_requirement_admission.py \
            tests/test_offline_vertical_slice_profile.py \
            tests/test_run_native_vertical_slice.py \
            tests/test_phase711_retail_identity_runtime_join.py
