name: native-physics-reference-chain

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_shared_reference_vector.hpp'
      - 'native_runtime/include/shift_fun_00713630_reference_source.hpp'
      - 'native_runtime/tests/fun_00766510_shared_reference_vector_check.cpp'
      - 'native_runtime/tests/fun_00713630_reference_source_check.cpp'
      - 'native_runtime/cmake/phase746.cmake'
      - 'native_runtime/cmake/phase747.cmake'
      - 'native_runtime/cmake/phase748.cmake'
      - 'tests/test_s6_fun_00766510_shared_reference_vector.py'
      - 'tests/test_s6_fun_00713630_reference_source.py'
      - 'evidence/fun_00766510_shared_reference_vector.json'
      - 'evidence/fun_00713630_reference_source.json'
      - 'evidence/phase747_next_blocker.md'
      - 'evidence/phase748_next_blocker.md'
      - 'docs/PHASE747_FUN_00766510_SHARED_REFERENCE_VECTOR.md'
      - 'docs/PHASE747_SCOPE.md'
      - 'docs/PHASE748_FUN_00713630_REFERENCE_SOURCE.md'
      - 'docs/PHASE748_SCOPE.md'
      - 'coordination/ci_migrations/native_physics_reference_chain_747_748.json'
      - 'tests/test_ci_workflow_migration_reference_chain.py'
      - '.github/workflows/native-physics-reference-chain.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_shared_reference_vector.hpp'
      - 'native_runtime/include/shift_fun_00713630_reference_source.hpp'
      - 'native_runtime/tests/fun_00766510_shared_reference_vector_check.cpp'
      - 'native_runtime/tests/fun_00713630_reference_source_check.cpp'
      - 'native_runtime/cmake/phase746.cmake'
      - 'native_runtime/cmake/phase747.cmake'
      - 'native_runtime/cmake/phase748.cmake'
      - 'tests/test_s6_fun_00766510_shared_reference_vector.py'
      - 'tests/test_s6_fun_00713630_reference_source.py'
      - 'evidence/fun_00766510_shared_reference_vector.json'
      - 'evidence/fun_00713630_reference_source.json'
      - 'evidence/phase747_next_blocker.md'
      - 'evidence/phase748_next_blocker.md'
      - 'docs/PHASE747_FUN_00766510_SHARED_REFERENCE_VECTOR.md'
      - 'docs/PHASE747_SCOPE.md'
      - 'docs/PHASE748_FUN_00713630_REFERENCE_SOURCE.md'
      - 'docs/PHASE748_SCOPE.md'
      - 'coordination/ci_migrations/native_physics_reference_chain_747_748.json'
      - 'tests/test_ci_workflow_migration_reference_chain.py'
      - '.github/workflows/native-physics-reference-chain.yml'
  workflow_dispatch:

concurrency:
  group: native-physics-reference-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-chain-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run reference-chain Python regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00766510_shared_reference_vector.py
          tests/test_s6_fun_00713630_reference_source.py

      - name: Validate reference-chain evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          shared = json.loads(Path('evidence/fun_00766510_shared_reference_vector.json').read_text())
          assert shared['format'] == 'SHIFT.Fun00766510SharedReferenceVector/1'
          assert shared['ready'] is True
          assert shared['owner_chain']['participant_source_offsets'] == ['0x16b4', '0x16b8', '0x16bc']
          assert shared['writer']['value_is_immutable_setup_constant'] is False
          assert shared['scope']['external_provider_count_after'] == 7
          assert shared['scope']['contact_response_provider_removed'] is False

          source = json.loads(Path('evidence/fun_00713630_reference_source.json').read_text())
          assert source['format'] == 'SHIFT.Fun00713630ReferenceSource/1'
          assert source['ready'] is True
          assert source['participant_input']['sample_count'] == 3
          assert source['manager_geometry']['record_stride'] == '0x1fa0'
          assert source['native_join']['FSIN_FCOS_x87_path_native_on_x86'] is True
          assert source['scope']['external_provider_count_after'] == 7
          assert source['scope']['contact_response_provider_removed'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build consolidated reference-chain regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_shared_reference_vector_check
          shift_runtime_fun_00713630_reference_source_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_shared_reference_vector|shift_runtime_fun_00713630_reference_source)$'

      - name: Verify native reports
        run: |
          mkdir -p out/native-physics-reference-chain

          native_runtime/build/shift_runtime_fun_00766510_shared_reference_vector_check \
            > out/native-physics-reference-chain/fun_00766510_shared_reference_vector.json
          grep -q '"format":"SHIFT.Fun00766510SharedReferenceVector/1"' \
            out/native-physics-reference-chain/fun_00766510_shared_reference_vector.json
          grep -q '"explicit_f32_to_f64_widening":true' \
            out/native-physics-reference-chain/fun_00766510_shared_reference_vector.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-reference-chain/fun_00766510_shared_reference_vector.json

          native_runtime/build/shift_runtime_fun_00713630_reference_source_check \
            > out/native-physics-reference-chain/fun_00713630_reference_source.json
          grep -q '"format":"SHIFT.Fun00713630ReferenceSource/1"' \
            out/native-physics-reference-chain/fun_00713630_reference_source.json
          grep -q '"sample_count":3' \
            out/native-physics-reference-chain/fun_00713630_reference_source.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-reference-chain/fun_00713630_reference_source.json
