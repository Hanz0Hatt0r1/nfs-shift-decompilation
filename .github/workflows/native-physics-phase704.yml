name: native-physics-phase704

on:
  push:
    paths:
      - 'src/physics/bmw_body0_vhf_world_matrix_composition_runtime.py'
      - 'tests/test_bmw_body0_vhf_world_matrix_composition_runtime.py'
      - 'native_runtime/include/shift_bmw_body0_bind_frame_admission.hpp'
      - 'native_runtime/src/bmw_body0_bind_frame_admission.cpp'
      - 'native_runtime/tests/bmw_body0_bind_frame_admission_check.cpp'
      - 'native_runtime/include/shift_bmw_body0_vhf_world_matrix_composition.hpp'
      - 'native_runtime/src/bmw_body0_vhf_world_matrix_composition.cpp'
      - 'native_runtime/tests/bmw_body0_vhf_world_matrix_composition_check.cpp'
      - 'native_runtime/cmake/phase703.cmake'
      - 'native_runtime/cmake/phase704.cmake'
      - 'evidence/process2_bmw_body0_bind_frame_admission.json'
      - 'docs/PHASE704_BMW_BODY0_VHF_WORLD_MATRIX_COMPOSITION.md'
      - 'tools/ghidra/build_bmw_body0_vhf_bind_frame_frontier.py'
      - '.github/workflows/native-physics-phase704.yml'
  pull_request:
    paths:
      - 'src/physics/bmw_body0_vhf_world_matrix_composition_runtime.py'
      - 'tests/test_bmw_body0_vhf_world_matrix_composition_runtime.py'
      - 'native_runtime/include/shift_bmw_body0_bind_frame_admission.hpp'
      - 'native_runtime/src/bmw_body0_bind_frame_admission.cpp'
      - 'native_runtime/tests/bmw_body0_bind_frame_admission_check.cpp'
      - 'native_runtime/include/shift_bmw_body0_vhf_world_matrix_composition.hpp'
      - 'native_runtime/src/bmw_body0_vhf_world_matrix_composition.cpp'
      - 'native_runtime/tests/bmw_body0_vhf_world_matrix_composition_check.cpp'
      - 'native_runtime/cmake/phase703.cmake'
      - 'native_runtime/cmake/phase704.cmake'
      - 'evidence/process2_bmw_body0_bind_frame_admission.json'
      - 'docs/PHASE704_BMW_BODY0_VHF_WORLD_MATRIX_COMPOSITION.md'
      - 'tools/ghidra/build_bmw_body0_vhf_bind_frame_frontier.py'
      - '.github/workflows/native-physics-phase704.yml'

jobs:
  bmw-body0-vhf-world-matrix-composition:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 704 Python oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_bmw_body0_vhf_world_matrix_composition_runtime.py

      - name: Verify Process 2 admission handoff contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('evidence/process2_bmw_body0_bind_frame_admission.json').read_text())
          assert payload['format'] == 'SHIFT.Process2BMWBody0BindFrameAdmission/1'
          assert payload['status'] == 'ready-gate'
          assert payload['input']['required_contract'] == 'SHIFT.BMWBody0BindFrameProof/1'
          assert payload['input']['current_positive_handoff_present'] is False
          assert payload['output']['typed_admission_bridge_ready'] is True
          assert payload['output']['retail_world_transform_admitted'] is False
          assert payload['ownership']['current_blocker_owner'] == 'Process 1'
          assert payload['ownership']['process2_state'] == 'blocked-awaiting-positive-proof'
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 700, 703 and 704 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_vehicle_body_pose_runtime_handoff_check
          shift_runtime_global_vehicle_body_owner_selection_check
          shift_runtime_bmw_body0_bind_frame_admission_check
          shift_runtime_bmw_body0_vhf_world_matrix_composition_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_vehicle_body_pose_runtime_handoff|shift_runtime_global_vehicle_body_owner_selection|shift_runtime_bmw_body0_bind_frame_admission|shift_runtime_bmw_body0_vhf_world_matrix_composition)$'

      - name: Verify BODY0 bind proof admission report
        run: |
          mkdir -p out/native-physics-phase704
          native_runtime/build/shift_runtime_bmw_body0_bind_frame_admission_check \
            > out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"format":"SHIFT.NativeBMWBody0BindFrameAdmission/1"' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"upstream_contract":"SHIFT.BMWBody0BindFrameProof/1"' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"required_evidence_state":"proven-static"' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"source_targets_required":true' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"identity_bind_assumption_allowed":false' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"typed_admission_bridge_ready":true' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"current_retail_proof_present":false' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json
          grep -q '"current_retail_world_transform_ready":false' \
            out/native-physics-phase704/bmw_body0_bind_frame_admission.json

      - name: Verify Phase 704 report
        run: |
          native_runtime/build/shift_runtime_bmw_body0_vhf_world_matrix_composition_check \
            > out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"format":"SHIFT.NativeBMWBody0VHFWorldMatrixComposition/1"' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"process1_contract":"SHIFT.BMWBody0VHFBindFrameFrontier/1"' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"formula_order":"vhf_bind\*inverse(body0_bind)\*body0_runtime"' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"selected_body_index":0' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"phase646_matrix_compatible":true' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"phase646_transport_executed":true' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"current_retail_body0_bind_proven":false' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"synthetic_bind_is_retail_proof":false' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
          grep -q '"live_vulkan_buffer_mutation_enabled":false' \
            out/native-physics-phase704/bmw_body0_vhf_world_matrix_composition.json
