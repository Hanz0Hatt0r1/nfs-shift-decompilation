name: native-physics-phase688

on:
  push:
    paths:
      - 'src/physics/fun_00763570_machine_feedback_join_runtime.py'
      - 'tests/test_fun_00763570_machine_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00763570_machine_feedback_join.hpp'
      - 'native_runtime/src/fun_00763570_machine_feedback_join.cpp'
      - 'native_runtime/tests/fun_00763570_machine_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE688_FUN_00763570_MACHINE_TRANSFORM_JOIN.md'
      - '.github/workflows/native-physics-phase688.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00763570_machine_feedback_join_runtime.py'
      - 'tests/test_fun_00763570_machine_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00763570_machine_feedback_join.hpp'
      - 'native_runtime/src/fun_00763570_machine_feedback_join.cpp'
      - 'native_runtime/tests/fun_00763570_machine_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE688_FUN_00763570_MACHINE_TRANSFORM_JOIN.md'
      - '.github/workflows/native-physics-phase688.yml'

jobs:
  fun-00763570-machine-feedback-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 688 Python oracle
        run: >-
          PYTHONPATH=src/physics:src/core python3 -m pytest -q
          tests/test_fun_00763570_machine_feedback_join_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 688 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00763570_machine_feedback_join_check

      - name: Run Phase 688 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00763570_machine_feedback_join$'

      - name: Verify Phase 688 report
        run: |
          mkdir -p out/native-physics-phase688
          native_runtime/build/shift_runtime_fun_00763570_machine_feedback_join_check \
            > out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"format":"SHIFT.NativeFun00763570MachineFeedbackJoin/1"' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"fun_007af0a0_machine_helper_used":true' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"fun_007af010_machine_helper_used":true' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"phase686_join_reused":true' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"precomputed_reconstructed_vector_provider_removed":true' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"persistent_body_result_preserved":true' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
          grep -q '"ambient_x87_control_word_proven":false' \
            out/native-physics-phase688/fun_00763570_machine_feedback_join.json
