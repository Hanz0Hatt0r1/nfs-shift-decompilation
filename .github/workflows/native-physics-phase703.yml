name: native-physics-phase703

on:
  push:
    paths:
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_global_vehicle_body_owner_selection_runtime.py'
      - 'native_runtime/include/shift_global_vehicle_body_owner_selection.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/global_vehicle_body_owner_selection.cpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/global_vehicle_body_owner_selection_check.cpp'
      - 'native_runtime/cmake/phase702.cmake'
      - 'native_runtime/cmake/phase703.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'docs/PHASE703_BMW_CHASSIS_BODY_SELECTION_GATE.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/native-physics-phase703.yml'
  pull_request:
    paths:
      - 'src/physics/global_vehicle_body_owner_selection_runtime.py'
      - 'tests/test_global_vehicle_body_owner_selection_runtime.py'
      - 'native_runtime/include/shift_global_vehicle_body_owner_selection.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/src/global_vehicle_body_owner_selection.cpp'
      - 'native_runtime/src/retail_global_vehicle_body_owner_identity.cpp'
      - 'native_runtime/tests/global_vehicle_body_owner_selection_check.cpp'
      - 'native_runtime/cmake/phase702.cmake'
      - 'native_runtime/cmake/phase703.cmake'
      - 'native_runtime/cmake/phase707.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'docs/PHASE703_BMW_CHASSIS_BODY_SELECTION_GATE.md'
      - 'docs/PHASE707_RETAIL_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/native-physics-phase703.yml'

jobs:
  global-vehicle-body-owner-selection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev
      - name: Run Phase 703/707 Python regression
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_global_vehicle_body_owner_selection_runtime.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 700, 703 and 707 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_vehicle_body_pose_runtime_handoff_check
          shift_runtime_global_vehicle_body_owner_selection_check
          shift_runtime_retail_global_vehicle_body_owner_identity_check
      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_vehicle_body_pose_runtime_handoff|shift_runtime_global_vehicle_body_owner_selection|shift_runtime_retail_global_vehicle_body_owner_identity)$'
      - name: Verify Phase 703 report
        run: |
          mkdir -p out/native-physics-phase703
          native_runtime/build/shift_runtime_global_vehicle_body_owner_selection_check \
            > out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"format":"SHIFT.NativeGlobalVehicleBodyOwnerSelection/1"' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"process1_contract":"SHIFT.GlobalVehicleBodyOwnerIdentity/1"' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"current_retail_identity_ready":true' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"current_retail_selection_emitted":true' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"retail_selected_body_index":0' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"retail_body_owner_pointer_field_offset":13212' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"phase698_selector_reused":true' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"phase700_runtime_handoff_reused":true' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"obsolete_update_child_gate_required":false' out/native-physics-phase703/global_vehicle_body_owner_selection.json
          grep -q '"current_retail_body0_bind_ready":false' out/native-physics-phase703/global_vehicle_body_owner_selection.json
