name: Process 1 outer Vehicle collision LOD negative

on:
  push:
    paths:
      - 'tools/ghidra/classify_outer_vehicle_collision_lod_branch.py'
      - 'tests/test_ghidra_outer_vehicle_collision_lod_negative.py'
      - 'docs/PROCESS_1_OUTER_VEHICLE_COLLISION_LOD_NEGATIVE.md'
      - '.github/workflows/process1-outer-vehicle-collision-lod-negative.yml'
  pull_request:
    paths:
      - 'tools/ghidra/classify_outer_vehicle_collision_lod_branch.py'
      - 'tests/test_ghidra_outer_vehicle_collision_lod_negative.py'
      - 'docs/PROCESS_1_OUTER_VEHICLE_COLLISION_LOD_NEGATIVE.md'
      - '.github/workflows/process1-outer-vehicle-collision-lod-negative.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run collision LOD negative regressions
        run: python -m pytest -q tests/test_ghidra_outer_vehicle_collision_lod_negative.py
      - name: Verify CLI surface
        run: python tools/ghidra/classify_outer_vehicle_collision_lod_branch.py --help >/dev/null
