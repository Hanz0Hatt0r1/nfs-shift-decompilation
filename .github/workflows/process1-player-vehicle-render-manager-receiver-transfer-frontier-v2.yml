name: Process 1 player vehicle render-manager receiver transfer frontier v2

on:
  push:
    paths:
      - 'tools/ghidra/build_player_vehicle_render_manager_receiver_transfer_frontier_v2.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_receiver_transfer_frontier_v2.py'
      - '.github/workflows/process1-player-vehicle-render-manager-receiver-transfer-frontier-v2.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_player_vehicle_render_manager_receiver_transfer_frontier_v2.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_receiver_transfer_frontier_v2.py'
      - '.github/workflows/process1-player-vehicle-render-manager-receiver-transfer-frontier-v2.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run machine-backed receiver-transfer regressions
        run: python -m pytest -q tests/test_ghidra_player_vehicle_render_manager_receiver_transfer_frontier_v2.py
      - name: Verify CLI surface
        run: python tools/ghidra/build_player_vehicle_render_manager_receiver_transfer_frontier_v2.py --help >/dev/null
