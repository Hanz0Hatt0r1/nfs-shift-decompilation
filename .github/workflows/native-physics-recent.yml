name: native-physics-recent

on:
  push:
    paths:
      - ".github/workflows/native-physics-recent.yml"
      - "native_runtime/**"
  pull_request:
    paths:
      - ".github/workflows/native-physics-recent.yml"
      - "native_runtime/**"

jobs:
  recent-native-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libvulkan-dev \
            glslang-tools \
            libxcb1-dev
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build recent native physics checks
        run: |
          cmake --build native_runtime/build --config Release --parallel --target \
            shift_runtime_body_accumulator_primitives_check \
            shift_runtime_wheel_contact_response_check \
            shift_runtime_body_point_transform_check \
            shift_runtime_aux_contact_response_check \
            shift_runtime_wheel_force_aggregate_check \
            shift_runtime_surface_probe_check \
            shift_runtime_contact_outer_kernel_check \
            shift_runtime_aux_contact_pair_check \
            shift_runtime_wheel_longitudinal_velocity_check
      - name: Run Phase 656-665 CTest regressions
        run: |
          ctest --test-dir native_runtime/build --output-on-failure \
            -R 'shift_runtime_(body_accumulator_primitives|wheel_contact_response|body_point_transform|aux_contact_response|wheel_force_aggregate|surface_probe|contact_outer_kernel|aux_contact_pair|wheel_longitudinal_velocity)$'
      - name: Verify Phase 656-665 reports
        run: |
          mkdir -p out/native-physics-recent
          native_runtime/build/shift_runtime_body_accumulator_primitives_check \
            | tee out/native-physics-recent/body_accumulator_primitives.json
          native_runtime/build/shift_runtime_wheel_contact_response_check \
            | tee out/native-physics-recent/wheel_contact_response.json
          native_runtime/build/shift_runtime_body_point_transform_check \
            | tee out/native-physics-recent/body_point_transform.json
          native_runtime/build/shift_runtime_aux_contact_response_check \
            | tee out/native-physics-recent/aux_contact_response.json
          native_runtime/build/shift_runtime_wheel_force_aggregate_check \
            | tee out/native-physics-recent/wheel_force_aggregate.json
          native_runtime/build/shift_runtime_surface_probe_check \
            | tee out/native-physics-recent/surface_probe.json
          native_runtime/build/shift_runtime_contact_outer_kernel_check \
            | tee out/native-physics-recent/contact_outer_kernel.json
          native_runtime/build/shift_runtime_aux_contact_pair_check \
            | tee out/native-physics-recent/aux_contact_pair.json
          native_runtime/build/shift_runtime_wheel_longitudinal_velocity_check \
            | tee out/native-physics-recent/wheel_longitudinal_velocity.json
          grep -q '"format":"SHIFT.NativeBodyAccumulatorPrimitives/1"' \
            out/native-physics-recent/body_accumulator_primitives.json
          grep -q '"format":"SHIFT.NativeWheelContactResponse/1"' \
            out/native-physics-recent/wheel_contact_response.json
          grep -q '"response_input_transform_proven":true' \
            out/native-physics-recent/wheel_contact_response.json
          grep -q '"format":"SHIFT.NativeBodyPointTransform/1"' \
            out/native-physics-recent/body_point_transform.json
          grep -q '"format":"SHIFT.NativeAuxContactResponse/1"' \
            out/native-physics-recent/aux_contact_response.json
          grep -q '"active_application_proven":true' \
            out/native-physics-recent/aux_contact_response.json
          grep -q '"format":"SHIFT.NativeWheelForceAggregate/1"' \
            out/native-physics-recent/wheel_force_aggregate.json
          grep -q '"record_count":3' \
            out/native-physics-recent/wheel_force_aggregate.json
          grep -q '"format":"SHIFT.NativeSurfaceProbe/1"' \
            out/native-physics-recent/surface_probe.json
          grep -q '"parent_recursion_proven":true' \
            out/native-physics-recent/surface_probe.json
          grep -q '"same_sign_child_blend_proven":true' \
            out/native-physics-recent/surface_probe.json
          grep -q '"format":"SHIFT.NativeContactOuterKernel/1"' \
            out/native-physics-recent/contact_outer_kernel.json
          grep -q '"outer_arithmetic_proven":true' \
            out/native-physics-recent/contact_outer_kernel.json
          grep -q '"paired_submission_scales_proven":true' \
            out/native-physics-recent/contact_outer_kernel.json
          grep -q '"format":"SHIFT.NativeAuxContactPair/1"' \
            out/native-physics-recent/aux_contact_pair.json
          grep -q '"record_count":2' \
            out/native-physics-recent/aux_contact_pair.json
          grep -q '"sequential_accumulator_join_proven":true' \
            out/native-physics-recent/aux_contact_pair.json
          grep -q '"format":"SHIFT.NativeWheelLongitudinalVelocity/1"' \
            out/native-physics-recent/wheel_longitudinal_velocity.json
          grep -q '"single_wheel_handoff_proven":true' \
            out/native-physics-recent/wheel_longitudinal_velocity.json
          grep -q '"rear_pair_average_proven":true' \
            out/native-physics-recent/wheel_longitudinal_velocity.json
          grep -q '"transform_fun_007af010_external":true' \
            out/native-physics-recent/wheel_longitudinal_velocity.json
