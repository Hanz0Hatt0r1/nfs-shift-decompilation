name: native-physics-phase751

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_optional_response_branch.hpp'
      - 'native_runtime/tests/fun_00766510_optional_response_branch_check.cpp'
      - 'native_runtime/cmake/phase750.cmake'
      - 'native_runtime/cmake/phase751.cmake'
      - 'tests/test_s6_fun_00766510_optional_response_branch.py'
      - 'evidence/fun_00766510_optional_response_native.json'
      - 'docs/PHASE751_FUN_00766510_OPTIONAL_RESPONSE_BRANCH.md'
      - '.github/workflows/native-physics-phase751.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_optional_response_branch.hpp'
      - 'native_runtime/tests/fun_00766510_optional_response_branch_check.cpp'
      - 'native_runtime/cmake/phase750.cmake'
      - 'native_runtime/cmake/phase751.cmake'
      - 'tests/test_s6_fun_00766510_optional_response_branch.py'
      - 'evidence/fun_00766510_optional_response_native.json'
      - 'docs/PHASE751_FUN_00766510_OPTIONAL_RESPONSE_BRANCH.md'
      - '.github/workflows/native-physics-phase751.yml'

jobs:
  optional-response-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 751 Python regression
        run: python3 -m pytest -q tests/test_s6_fun_00766510_optional_response_branch.py

      - name: Validate Phase 751 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00766510_optional_response_native.json').read_text())
          assert e['format'] == 'SHIFT.Fun00766510OptionalResponseBranch/1'
          assert e['ready'] is True
          assert e['persistent_mutable']['setup_constant'] is False
          assert e['persistent_mutable']['writer_arithmetic_internalized'] is False
          assert e['runtime_gate']['internalized'] is True
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['contact_response_provider_removed'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 751 and Phase 750 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_optional_response_branch_check
          shift_runtime_fun_00766510_early_response_branch_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_optional_response_branch|shift_runtime_fun_00766510_early_response_branch)$'

      - name: Verify native report
        run: |
          mkdir -p out/native-physics-phase751
          native_runtime/build/shift_runtime_fun_00766510_optional_response_branch_check \
            > out/native-physics-phase751/fun_00766510_optional_response_branch.json
          grep -q '"format":"SHIFT.Fun00766510OptionalResponseBranch/1"' \
            out/native-physics-phase751/fun_00766510_optional_response_branch.json
          grep -q '"writer_arithmetic_internalized":false' \
            out/native-physics-phase751/fun_00766510_optional_response_branch.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-phase751/fun_00766510_optional_response_branch.json
