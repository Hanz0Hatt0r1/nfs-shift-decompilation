      - name: Legacy SVGP v2 compatibility smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import struct

          source = Path("out/vulkan/bundle/bundle")
          target = Path("out/vulkan/legacy_v2_bundle")
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source, target)

          packet = (source / "geometry.svpk").read_bytes()
          header_struct = struct.Struct("<4sIIIIII4f")
          attr_v3 = struct.Struct("<IIIII")
          attr_v2 = struct.Struct("<IIII")
          header = list(header_struct.unpack_from(packet))
          if header[0] != b"SVGP" or header[1] != 3:
              raise SystemExit(f"expected SVGP v3, got {header[:2]}")
          count = int(header[5])
          header[1] = 2
          legacy_attrs = []
          for index in range(count):
              row = attr_v3.unpack_from(
                  packet,
                  header_struct.size + index * attr_v3.size,
              )
              legacy_attrs.append(attr_v2.pack(*row[:4]))
          payload_offset = header_struct.size + count * attr_v3.size
          legacy = (
              header_struct.pack(*header)
              + b"".join(legacy_attrs)
              + packet[payload_offset:]
          )
          (target / "geometry.svpk").write_bytes(legacy)
          PY
          cat > out/vulkan/legacy_v2_world_transform.json <<'JSON'
          {
