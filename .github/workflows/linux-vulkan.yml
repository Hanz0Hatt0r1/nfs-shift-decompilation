name: linux-vulkan

on:
  push:
    paths:
      - ".github/workflows/linux-vulkan.yml"
      - "native_runtime/**"
      - "native_vulkan/**"
      - "*.py"
      - "tools/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/linux-vulkan.yml"
      - "native_runtime/**"
      - "native_vulkan/**"
      - "*.py"
      - "tools/**"
      - "tests/**"

jobs:
  vulkan-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan software stack
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libvulkan-dev glslang-tools mesa-vulkan-drivers vulkan-tools libxcb1-dev xvfb
      - name: Show Vulkan devices
        run: vulkaninfo --summary
      - name: Configure
        run: cmake -S native_vulkan -B native_vulkan/build
      - name: Build
        run: cmake --build native_vulkan/build --config Release --parallel
      - name: Headless Vulkan probe
        run: native_vulkan/build/shift_vulkan_probe
      - name: Headless clear
        run: |
          mkdir -p out/vulkan
          native_vulkan/build/shift_vulkan_headless_clear out/vulkan/clear.ppm > out/vulkan/clear.json
      - name: Headless triangle
        run: |
          native_vulkan/build/shift_vulkan_headless_triangle out/vulkan/triangle.ppm native_vulkan/build/shaders > out/vulkan/triangle.json
      - name: Native provenance gate regression
        run: |
          mkdir -p out/vulkan/blocked
          if native_vulkan/build/shift_vulkan_bundle_execute out/vulkan/blocked > out/vulkan/blocked/stdout.txt 2> out/vulkan/blocked/stderr.txt; then
            echo "executor unexpectedly accepted a bundle without native provenance"
            exit 1
          fi
          grep -q "native submission gate missing" out/vulkan/blocked/stderr.txt
      - name: Native Linux runtime configure
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Native Linux runtime build
        run: cmake --build native_runtime/build --config Release --parallel
      - name: Prepare mixed-resource BMW bundle
        run: python3 tools/run_linux_vulkan_smoke.py out/vulkan/bundle
      - name: Native Linux runtime frame loop
        run: |
          set -o pipefail
          mkdir -p out/vulkan/runtime
          xvfb-run -a native_runtime/build/shift_runtime \
            --bundle out/vulkan/bundle/bundle \
            --shader-dir native_runtime/build/shaders \
            --physics-manifest evidence/bmw_m3_vehicle_physics_manifest.json \
            --frames 3 | tee out/vulkan/runtime/runtime.json
      - name: Assert native runtime output
        run: |
          grep -q '"format": "SHIFT.NativeRuntimeFrameLoop/1"' out/vulkan/runtime/runtime.json
          grep -q '"frames_rendered": 3' out/vulkan/runtime/runtime.json
          grep -q '"simulation_steps": 3' out/vulkan/runtime/runtime.json
          grep -q '"material_mode": true' out/vulkan/runtime/runtime.json
          grep -q '"bundle_2d_textures": 1' out/vulkan/runtime/runtime.json
          grep -q '"bundle_cube": true' out/vulkan/runtime/runtime.json
          grep -q '"state_layer": "SHIFT.NativeRuntimeState/1"' out/vulkan/runtime/runtime.json
          grep -q '"physics_workspace_ready": true' out/vulkan/runtime/runtime.json
          grep -q '"physics_workspace_scalars": 40' out/vulkan/runtime/runtime.json
          grep -q '"status": "ok"' out/vulkan/runtime/runtime.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-vulkan-smoke
          path: out/vulkan
