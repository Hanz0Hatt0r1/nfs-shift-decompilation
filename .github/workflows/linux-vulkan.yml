          grep -q '"physics_post_solve_persistent_body_state_steps": 0' out/vulkan/runtime/input_script.json
          grep -q '"physics_solver_post_solve_body_state_applied": true' out/vulkan/runtime/input_script.json
          grep -q '"physics_solver_persistent_body_accumulator_state_applied": false' out/vulkan/runtime/input_script.json
          grep -q '"physics_solver_persistent_vehicle_state_applied": false' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_throttle": false' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_brake": false' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_steer_left": false' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_steer_right": false' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_steer_axis": 0' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_throttle_steps": 2' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_brake_steps": 1' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_steer_left_steps": 2' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_steer_right_steps": 2' out/vulkan/runtime/input_script.json
          grep -q '"vehicle_control_neutral_steps": 1' out/vulkan/runtime/input_script.json
          grep -q '"validation_errors": 0' out/vulkan/runtime/input_script.json
          grep -q '"status": "ok"' out/vulkan/runtime/input_script.json
      - name: Native Linux runtime persistent BODY accumulator frame loop
        run: |
          set -o pipefail
          xvfb-run -a native_runtime/build/shift_runtime \
            --scene-set out/vulkan/native_scene_set \
            --shader-dir native_runtime/build/shaders \
            --physics-manifest evidence/bmw_m3_vehicle_physics_manifest.json \
            --camera-state out/vulkan/camera/native_camera.json \
            --participant-boundary out/vulkan/runtime/native_physics_participant_runtime_evidence.json \
            --solver-frame out/vulkan/runtime/fixed_step_solver_frame/solver_frame.sbfr \
            --post-solve-projection out/vulkan/runtime/fixed_step_post_solve/post_solve.sbps \
            --persist-post-solve-body-state \
            --input-script out/vulkan/runtime/native_input.script \
            --validation | tee out/vulkan/runtime/input_script_persistent.json
      - name: Assert persistent BODY accumulator state crosses fixed steps
        run: |
          grep -q '"frames_rendered": 5' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_solver_frame_steps": 5' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_post_solve_projection_steps": 5' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_post_solve_projection_max_solver_join_error": 0' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_post_solve_projection_max_delta_error": 0' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_post_solve_persistent_body_state_enabled": true' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_post_solve_persistent_body_state_steps": 5' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_solver_persistent_body_accumulator_state_applied": true' out/vulkan/runtime/input_script_persistent.json
          grep -q '"physics_solver_persistent_vehicle_state_applied": false' out/vulkan/runtime/input_script_persistent.json
          grep -q '"validation_errors": 0' out/vulkan/runtime/input_script_persistent.json
          grep -q '"status": "ok"' out/vulkan/runtime/input_script_persistent.json
      - name: Reject mismatched fixed-step post-solve solved vector
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "out/vulkan/runtime/fixed_step_post_solve_input.json"
          )
          payload = json.loads(source.read_text(encoding="utf-8"))
          payload["solver_vector"][0] += 1.0
          target = Path(
              "out/vulkan/runtime/fixed_step_post_solve_mismatch_input.json"
          )
          target.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 shift_importer.py native-post-solve-projection \
            out/vulkan/runtime/fixed_step_post_solve_mismatch_input.json \
            out/vulkan/runtime/fixed_step_post_solve_mismatch
          if native_runtime/build/shift_runtime_solver_post_solve_join_check \
            out/vulkan/runtime/fixed_step_solver_frame/solver_frame.sbfr \
            out/vulkan/runtime/fixed_step_post_solve_mismatch/post_solve.sbps \
            > out/vulkan/runtime/post_solve_mismatch.stdout \
            2> out/vulkan/runtime/post_solve_mismatch.stderr; then
            echo "join checker unexpectedly accepted mismatched post-solve vector"
            exit 1
          fi
          cat out/vulkan/runtime/post_solve_mismatch.stderr
          grep -q "post-solve solved-vector join mismatch" \
            out/vulkan/runtime/post_solve_mismatch.stderr
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-vulkan-smoke
          path: out/vulkan
