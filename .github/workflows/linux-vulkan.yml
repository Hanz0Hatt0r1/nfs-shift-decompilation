          native_runtime/build/shift_runtime_generated_body_solver_frame_join_check \
            out/vulkan/runtime/fixed_step_generated_body/generated/generated_body_constraints.gbcf \
            out/vulkan/runtime/fixed_step_generated_body/solver/solver_frame.sbfr \
            | tee out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"scalar_count": 40' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"body_count": 11' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"joint_samples": 4' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"hinge_samples": 4' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"bar_samples": 20' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"max_rhs_join_error": 0' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"max_matrix_join_error": 0' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
          grep -q '"status": "ok"' \
            out/vulkan/runtime/fixed_step_generated_body/join.json
