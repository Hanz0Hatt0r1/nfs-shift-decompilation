          grep -q '"frames_rendered": 2' out/vulkan/legacy_v2_runtime.json
          grep -q '"status": "ok"' out/vulkan/legacy_v2_runtime.json
          cp -a out/vulkan/legacy_v2_bundle out/vulkan/legacy_v2_affine_bundle
          cat > out/vulkan/legacy_v2_affine_world_transform.json <<'JSON'
          {
