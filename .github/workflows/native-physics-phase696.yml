name: native-physics-phase696

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_s6_fun_007682c0_body0_delta_destination.py'
      - 'tests/test_s6_fun_007682c0_effect_input_machine_frontier.py'
      - 'evidence/fun_007682c0_body0_delta_destination.json'
      - 'evidence/fun_007682c0_effect_input_machine_frontier.json'
      - 'native_runtime/include/shift_body_record_adapter.hpp'
      - 'native_runtime/src/body_record_adapter.cpp'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_contact_outer_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_motion_read_effect_provider_chain.cpp'
      - 'native_runtime/include/shift_fun_007682c0_machine_magnitude.hpp'
      - 'native_runtime/src/fun_007682c0_machine_magnitude.cpp'
      - 'native_runtime/tests/fun_00770e80_motion_read_effect_provider_chain_check.cpp'
      - 'native_runtime/tests/fun_007682c0_machine_magnitude_check.cpp'
      - 'native_runtime/cmake/phase695.cmake'
      - 'native_runtime/cmake/phase696.cmake'
      - 'docs/PHASE696_FUN_007682C0_MOTION_READ_EFFECT_PROVIDER_JOIN.md'
      - '.github/workflows/native-physics-phase696.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_s6_fun_007682c0_body0_delta_destination.py'
      - 'tests/test_s6_fun_007682c0_effect_input_machine_frontier.py'
      - 'evidence/fun_007682c0_body0_delta_destination.json'
      - 'evidence/fun_007682c0_effect_input_machine_frontier.json'
      - 'native_runtime/include/shift_body_record_adapter.hpp'
      - 'native_runtime/src/body_record_adapter.cpp'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_contact_outer_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_motion_read_effect_provider_chain.cpp'
      - 'native_runtime/include/shift_fun_007682c0_machine_magnitude.hpp'
      - 'native_runtime/src/fun_007682c0_machine_magnitude.cpp'
      - 'native_runtime/tests/fun_00770e80_motion_read_effect_provider_chain_check.cpp'
      - 'native_runtime/tests/fun_007682c0_machine_magnitude_check.cpp'
      - 'native_runtime/cmake/phase695.cmake'
      - 'native_runtime/cmake/phase696.cmake'
      - 'docs/PHASE696_FUN_007682C0_MOTION_READ_EFFECT_PROVIDER_JOIN.md'
      - '.github/workflows/native-physics-phase696.yml'

jobs:
  fun-007682c0-motion-read-effect-provider:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 693, Phase 696, and S6 Python regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_contact_outer_provider_chain_runtime.py
          tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py
          tests/test_s6_fun_007682c0_body0_delta_destination.py
          tests/test_s6_fun_007682c0_effect_input_machine_frontier.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 693 and Phase 696 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_contact_outer_provider_chain_check
          shift_runtime_fun_00770e80_motion_read_effect_provider_chain_check
          shift_runtime_fun_007682c0_machine_magnitude_check

      - name: Run joined CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_(contact_outer_provider_chain|motion_read_effect_provider_chain)$|^shift_runtime_fun_007682c0_machine_magnitude$'

      - name: Verify S6 FUN_007682c0 reports
        run: |
          mkdir -p out/native-physics-phase696
          native_runtime/build/shift_runtime_fun_00770e80_motion_read_effect_provider_chain_check \
            > out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"format":"SHIFT.NativeFun00770e80MotionReadEffectProviderChain/1"' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"fun_007682c0_typed_effect_provider":true' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"fun_007682c0_legacy_delta_observer_optional":true' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"fun_007682c0_body_identity_application_external":false' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"fun_007682c0_body0_delta_application_internal":true' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"fun_007682c0_effect_production_external":true' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json
          grep -q '"host_sqrt_substitution_allowed":false' \
            out/native-physics-phase696/fun_007682c0_motion_read_effect_provider_chain.json

          native_runtime/build/shift_runtime_fun_007682c0_machine_magnitude_check \
            > out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"format":"SHIFT.Fun007682c0MachineMagnitude/1"' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"ready":true' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"retail_x87_control_word":639' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"pc_cisqrt_resolved_to_fsqrt":true' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"planar_squared_f32_checkpoint":true' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"host_std_sqrt_used_for_retail_path":false' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
          grep -q '"fun_007595d0_response_complete":false' \
            out/native-physics-phase696/fun_007682c0_machine_magnitude.json
