name: native-physics-phase732

on:
  push:
    paths:
      - 'evidence/fun_007675f0_surface_probe_join.json'
      - 'evidence/phase732_next_blocker.md'
      - 'docs/PHASE732_FUN_007675F0_SURFACE_PROBE_JOIN.md'
      - 'docs/PHASE732_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_surface_probe.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_join_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_state_ownership_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_filter_cap_ownership_check.cpp'
      - 'native_runtime/cmake/phase731.cmake'
      - 'native_runtime/cmake/phase732.cmake'
      - 'tests/test_s6_fun_007675f0_surface_probe_join.py'
      - '.github/workflows/native-physics-phase732.yml'
  pull_request:
    paths:
      - 'evidence/fun_007675f0_surface_probe_join.json'
      - 'evidence/phase732_next_blocker.md'
      - 'docs/PHASE732_FUN_007675F0_SURFACE_PROBE_JOIN.md'
      - 'docs/PHASE732_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_surface_probe.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_join_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_state_ownership_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_filter_cap_ownership_check.cpp'
      - 'native_runtime/cmake/phase731.cmake'
      - 'native_runtime/cmake/phase732.cmake'
      - 'tests/test_s6_fun_007675f0_surface_probe_join.py'
      - '.github/workflows/native-physics-phase732.yml'

jobs:
  fun-007675f0-surface-probe-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 732 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007675f0_surface_probe_join.py
          tests/test_s6_fun_007675f0_distance_filter_cap_ownership.py
          tests/test_s6_fun_007675f0_distance_state_ownership.py
          tests/test_s6_fun_007675f0_body_motion_ownership.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 732 and dependent regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007675f0_surface_probe_join_check
          shift_runtime_surface_probe_check
          shift_runtime_fun_007675f0_distance_filter_cap_ownership_check
          shift_runtime_fun_007675f0_distance_state_ownership_check
          shift_runtime_fun_007675f0_body_motion_ownership_check
          shift_runtime_fun_00770e80_contact_outer_provider_chain_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007675f0_surface_probe_join|shift_runtime_surface_probe|shift_runtime_fun_007675f0_distance_filter_cap_ownership|shift_runtime_fun_007675f0_distance_state_ownership|shift_runtime_fun_007675f0_body_motion_ownership|shift_runtime_fun_00770e80_contact_outer_provider_chain|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 732 report
        run: |
          mkdir -p out/native-physics-phase732
          native_runtime/build/shift_runtime_fun_007675f0_surface_probe_join_check \
            > out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"format":"SHIFT.Fun007675f0SurfaceProbeJoin/1"' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"planar_delta_internal":true' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"surface_scalar_internal":true' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"production_node_boundary_required":true' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"remaining_production_fields":5' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
          grep -q '"external_provider_count_reduced":false' \
            out/native-physics-phase732/fun_007675f0_surface_probe_join.json
