name: native-physics-phase679

on:
  push:
    paths:
      - ".github/workflows/native-physics-phase679.yml"
      - "native_runtime/include/shift_body_feedback_integration_join.hpp"
      - "native_runtime/src/body_feedback_integration_join.cpp"
      - "native_runtime/tests/body_feedback_integration_join_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_feedback_integration_join_runtime.py"
      - "tests/test_body_feedback_integration_join_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/native-physics-phase679.yml"
      - "native_runtime/include/shift_body_feedback_integration_join.hpp"
      - "native_runtime/src/body_feedback_integration_join.cpp"
      - "native_runtime/tests/body_feedback_integration_join_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_feedback_integration_join_runtime.py"
      - "tests/test_body_feedback_integration_join_runtime.py"

jobs:
  feedback-integration-anchor-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            python3-pytest \
            libvulkan-dev \
            glslang-tools \
            libxcb1-dev
      - name: Run Phase 679 Python scheduling oracle
        run: PYTHONPATH=src/physics python3 -m pytest -q tests/test_body_feedback_integration_join_runtime.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 679 native regression
        run: cmake --build native_runtime/build --config Release --parallel --target shift_runtime_body_feedback_integration_join_check
      - name: Run Phase 679 CTest regression
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_body_feedback_integration_join$'
      - name: Verify Phase 679 report
        run: |
          mkdir -p out/native-physics-phase679
          native_runtime/build/shift_runtime_body_feedback_integration_join_check \
            | tee out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"format":"SHIFT.NativeBodyFeedbackIntegrationJoin/1"' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"post_solve_feedback_function":"FUN_007b4110"' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"body_array_function":"FUN_007b2270"' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"feedback_before_integration_proven":true' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"raw_handoff_proven":true' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"basis_rotation_arithmetic_external":true' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"complete_half_step_implemented":false' \
            out/native-physics-phase679/body_feedback_integration_join.json
          grep -q '"render_frame_scheduler_proven":false' \
            out/native-physics-phase679/body_feedback_integration_join.json
