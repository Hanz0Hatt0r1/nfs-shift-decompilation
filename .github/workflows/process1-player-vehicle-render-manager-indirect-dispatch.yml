name: Process 1 player vehicle render-manager indirect dispatch

on:
  pull_request:
    paths:
      - 'tools/ghidra/analyze_player_vehicle_render_manager_indirect_dispatch.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_indirect_dispatch.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDER_MANAGER_INDIRECT_DISPATCH.md'
      - '.github/workflows/process1-player-vehicle-render-manager-indirect-dispatch.yml'
  push:
    paths:
      - 'tools/ghidra/analyze_player_vehicle_render_manager_indirect_dispatch.py'
      - 'tests/test_ghidra_player_vehicle_render_manager_indirect_dispatch.py'
      - 'docs/PROCESS_1_PLAYER_VEHICLE_RENDER_MANAGER_INDIRECT_DISPATCH.md'
      - '.github/workflows/process1-player-vehicle-render-manager-indirect-dispatch.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run indirect dispatch regressions
        run: python -m pytest -q tests/test_ghidra_player_vehicle_render_manager_indirect_dispatch.py
      - name: Verify CLI surface
        run: python tools/ghidra/analyze_player_vehicle_render_manager_indirect_dispatch.py --help >/dev/null
