concurrency:
  group: native-physics-world-transform-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-transform-chain-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Python regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_vehicle_body_pose_selection_runtime.py
          tests/test_vehicle_body_pose_runtime_handoff.py
          tests/test_bmw_wheel_spindle_body_topology_runtime.py
          tests/test_global_vehicle_body_owner_selection_runtime.py
          tests/test_bmw_body0_vhf_world_matrix_composition_runtime.py
          tests/test_bmw_body0_bind_frame_proof_packet.py
          tests/test_bmw_body0_bind_frame_runtime_admission.py
          tests/test_bmw_vehicle_world_matrix_runtime_handoff_runtime.py
          tests/test_persistent_bmw_vehicle_world_transform_runtime.py
          tests/test_bmw_persistent_world_transform_runtime_wiring.py
          tests/test_ci_workflow_migration_world_transform_chain.py

      - name: Verify Process 2 admission handoff contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          admission = json.loads(Path('evidence/process2_bmw_body0_bind_frame_admission.json').read_text())
          assert admission['format'] == 'SHIFT.Process2BMWBody0BindFrameAdmission/1'
          assert admission['status'] == 'ready-gate'
          assert admission['input']['required_contract'] == 'SHIFT.BMWBody0BindFrameProof/1'
          assert admission['input']['current_positive_handoff_present'] is False
          assert admission['output']['typed_admission_bridge_ready'] is True
          assert admission['output']['retail_world_transform_admitted'] is False
          assert admission['ownership']['current_blocker_owner'] == 'Process 1'

          packet = json.loads(Path('evidence/process2_bmw_body0_bind_frame_proof_packet.json').read_text())
          assert packet['format'] == 'SHIFT.Process2BMWBody0BindFrameProofPacket/1'
          assert packet['status'] == 'ready-gate'
          assert packet['input']['required_contract'] == 'SHIFT.BMWBody0BindFrameProof/1'
          assert packet['input']['current_positive_handoff_present'] is False
          assert packet['output']['packet_contract'] == 'SHIFT.NativeBMWBody0BindFrameProofPacket/1'
          assert packet['output']['positive_only_builder_ready'] is True
          assert packet['output']['native_packet_loader_ready'] is True
          assert packet['output']['strict_native_admission_reused'] is True
          assert packet['output']['retail_world_transform_admitted'] is False
          assert packet['ownership']['current_blocker_owner'] == 'Process 1'

          runtime = json.loads(Path('evidence/process2_bmw_body0_bind_frame_runtime_admission.json').read_text())
          assert runtime['format'] == 'SHIFT.Process2BMWBody0BindFrameRuntimeAdmission/1'
          assert runtime['status'] == 'ready-gate'
          assert runtime['input']['required_packet_contract'] == 'SHIFT.NativeBMWBody0BindFrameProofPacket/1'
          assert runtime['input']['current_positive_handoff_present'] is False
          assert runtime['output']['production_fixed_step_hook_ready'] is True
          assert runtime['output']['admission_runs_before_native_fixed_step'] is True
          assert runtime['output']['retail_scheduler_claimed'] is False
          assert runtime['output']['vehicle_world_transform_committed'] is False
          assert runtime['ownership']['current_blocker_owner'] == 'Process 1'
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build consolidated native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime
          shift_runtime_vehicle_body_pose_selection_check
          shift_runtime_vehicle_body_pose_runtime_handoff_check
          shift_runtime_constraint_relation_state_dispatch_check
          shift_runtime_bmw_wheel_spindle_body_topology_check
          shift_runtime_global_vehicle_body_owner_selection_check
          shift_runtime_retail_global_vehicle_body_owner_identity_check
          shift_runtime_bmw_body0_bind_frame_admission_check
          shift_runtime_bmw_body0_bind_frame_proof_packet_check
          shift_runtime_bmw_body0_bind_frame_runtime_admission_check
          shift_runtime_bmw_body0_vhf_world_matrix_composition_check
          shift_runtime_bmw_vehicle_world_matrix_runtime_handoff_check
          shift_runtime_persistent_bmw_vehicle_world_transform_check
          shift_runtime_bmw_persistent_world_transform_runtime_wiring_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_vehicle_body_pose_selection|shift_runtime_vehicle_body_pose_runtime_handoff|shift_runtime_constraint_relation_state_dispatch|shift_runtime_bmw_wheel_spindle_body_topology|shift_runtime_global_vehicle_body_owner_selection|shift_runtime_retail_global_vehicle_body_owner_identity|shift_runtime_bmw_body0_bind_frame_admission|shift_runtime_bmw_body0_bind_frame_proof_packet|shift_runtime_bmw_body0_bind_frame_runtime_admission|shift_runtime_bmw_body0_vhf_world_matrix_composition|shift_runtime_bmw_vehicle_world_matrix_runtime_handoff|shift_runtime_persistent_bmw_vehicle_world_transform|shift_runtime_bmw_persistent_world_transform_runtime_wiring)$'

      - name: Verify native reports and semantic gates
        run: |
          OUT=out/native-physics-world-transform-chain
          mkdir -p "$OUT"

          native_runtime/build/shift_runtime_vehicle_body_pose_selection_check > "$OUT/vehicle_body_pose_selection.json"
          grep -q '"format":"SHIFT.NativeVehicleBodyPoseSelection/1"' "$OUT/vehicle_body_pose_selection.json"
          grep -q '"selection_requires_identity_proof":true' "$OUT/vehicle_body_pose_selection.json"
          grep -q '"current_process1_frontier_admitted":false' "$OUT/vehicle_body_pose_selection.json"
          grep -q '"vehicle_world_transform_proven":false' "$OUT/vehicle_body_pose_selection.json"
          grep -q '"renderer_transport_enabled":false' "$OUT/vehicle_body_pose_selection.json"
          grep -q '"fixed_step_auto_schedule":false' "$OUT/vehicle_body_pose_selection.json"

          native_runtime/build/shift_runtime_vehicle_body_pose_runtime_handoff_check > "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"format":"SHIFT.NativeVehicleBodyPoseRuntimeHandoff/1"' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"phase":700' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"phase698_selector_reused":true' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"phase699_provider_frontier_preserved":true' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"runtime_state_mutated":false' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"current_process1_chassis_body_selected":false' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"vehicle_world_transform_proven":false' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"renderer_transport_enabled":false' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"fixed_step_auto_schedule":false' "$OUT/vehicle_body_pose_runtime_handoff.json"
          grep -q '"deep_outer_update_executable_schedule_enabled":false' "$OUT/vehicle_body_pose_runtime_handoff.json"

          native_runtime/build/shift_runtime_bmw_wheel_spindle_body_topology_check > "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"format":"SHIFT.NativeBMWWheelSpindleBodyTopology/1"' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"wheel_body_indices":\[3,4,7,8\]' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"spindle_body_indices":\[1,2,5,6\]' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"rear_axle_body_index_ready":false' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"main_chassis_body_selected":true' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"main_chassis_body_index":0' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"update_child_to_vehicle_solver_base_continuity_proven":false' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"vehicle_body_selection_ready":false' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"full_vehicle_constraint_body_map_ready":false' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"distinct_body_indices_assumed":false' "$OUT/bmw_wheel_spindle_body_topology.json"
          grep -q '"phase698_positive_selection_admissible":false' "$OUT/bmw_wheel_spindle_body_topology.json"

          native_runtime/build/shift_runtime_global_vehicle_body_owner_selection_check > "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"format":"SHIFT.NativeGlobalVehicleBodyOwnerSelection/1"' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"process1_contract":"SHIFT.GlobalVehicleBodyOwnerIdentity/1"' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"current_retail_identity_ready":true' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"current_retail_selection_emitted":true' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"retail_selected_body_index":0' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"retail_body_owner_pointer_field_offset":13212' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"phase698_selector_reused":true' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"phase700_runtime_handoff_reused":true' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"obsolete_update_child_gate_required":false' "$OUT/global_vehicle_body_owner_selection.json"
          grep -q '"current_retail_body0_bind_ready":false' "$OUT/global_vehicle_body_owner_selection.json"

          native_runtime/build/shift_runtime_bmw_body0_bind_frame_runtime_admission_check > "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"format":"SHIFT.NativeBMWBody0BindFrameRuntimeAdmission/1"' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"environment":"SHIFT_NATIVE_BMW_BODY0_BIND_PROOF_PACKET"' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"absent_packet_is_inert":true' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"positive_packet_admitted_before_tick":true' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"path_change_rejected":true' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"retail_scheduler_claimed":false' "$OUT/bmw_body0_bind_frame_runtime_admission.json"
          grep -q '"vehicle_world_transform_committed":false' "$OUT/bmw_body0_bind_frame_runtime_admission.json"

          native_runtime/build/shift_runtime_bmw_body0_bind_frame_proof_packet_check > "$OUT/bmw_body0_bind_frame_proof_packet.json"
          grep -q '"format":"SHIFT.NativeBMWBody0BindFrameProofPacket/1"' "$OUT/bmw_body0_bind_frame_proof_packet.json"
          grep -q '"magic":"BBFP"' "$OUT/bmw_body0_bind_frame_proof_packet.json"
          grep -q '"native_loader_ready":true' "$OUT/bmw_body0_bind_frame_proof_packet.json"
          grep -q '"strict_admission_reused":true' "$OUT/bmw_body0_bind_frame_proof_packet.json"
