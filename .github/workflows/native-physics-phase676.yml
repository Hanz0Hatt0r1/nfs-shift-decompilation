name: native-physics-phase676

on:
  push:
    paths:
      - ".github/workflows/native-physics-phase676.yml"
      - "native_runtime/include/shift_body_frame_integration.hpp"
      - "native_runtime/src/body_frame_integration.cpp"
      - "native_runtime/tests/body_array_basis_callback_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_array_basis_callback_runtime.py"
      - "tests/test_body_array_basis_callback_runtime.py"
  pull_request:
    paths:
      - ".github/workflows/native-physics-phase676.yml"
      - "native_runtime/include/shift_body_frame_integration.hpp"
      - "native_runtime/src/body_frame_integration.cpp"
      - "native_runtime/tests/body_array_basis_callback_check.cpp"
      - "native_runtime/cmake/recent_physics.cmake"
      - "src/physics/body_array_basis_callback_runtime.py"
      - "tests/test_body_array_basis_callback_runtime.py"

jobs:
  body-array-basis-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            python3-pytest \
            libvulkan-dev \
            glslang-tools \
            libxcb1-dev
      - name: Run Phase 676 Python oracle regression
        run: PYTHONPATH=src/physics python3 -m pytest -q tests/test_body_array_basis_callback_runtime.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 676 native regression
        run: cmake --build native_runtime/build --config Release --parallel --target shift_runtime_body_array_basis_callback_check
      - name: Run Phase 676 CTest regression
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_body_array_basis_callback$'
      - name: Verify Phase 676 report
        run: |
          mkdir -p out/native-physics-phase676
          native_runtime/build/shift_runtime_body_array_basis_callback_check \
            | tee out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"format":"SHIFT.NativeBodyArrayBasisCallback/1"' \
            out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"body_stride":368' \
            out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"retail_iteration_order_proven":true' \
            out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"basis_provider_inside_each_body_proven":true' \
            out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"basis_rotation_arithmetic_external":true' \
            out/native-physics-phase676/body_array_basis_callback.json
          grep -q '"render_frame_scheduler_proven":false' \
            out/native-physics-phase676/body_array_basis_callback.json
