name: Process 2 Phase 709 patch

on:
  push:
    branches:
      - process-2/phase709-continuous-native-loop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: process-2/phase709-continuous-native-loop
          fetch-depth: 0
      - name: Apply Phase 709
        run: python3 tools/_phase709_apply.py
      - name: Commit Phase 709
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "runtime: add continuous native loop policy (Phase 709)"
          git push origin HEAD:process-2/phase709-continuous-native-loop
