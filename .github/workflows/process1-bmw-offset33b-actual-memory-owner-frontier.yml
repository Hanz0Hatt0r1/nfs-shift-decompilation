name: Process 1 BMW offset33b actual memory owner frontier

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_memory_load_provenance_actual_object.py'
      - 'tools/ghidra/analyze_bmw_offset33b_actual_field_owner_frontier.py'
      - 'tests/test_ghidra_bmw_offset33b_memory_load_actual_object_adapter.py'
      - 'tests/test_ghidra_bmw_offset33b_actual_field_owner_frontier.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ACTUAL_MEMORY_OWNER_FRONTIER.md'
      - '.github/workflows/process1-bmw-offset33b-actual-memory-owner-frontier.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_memory_load_provenance_actual_object.py'
      - 'tools/ghidra/analyze_bmw_offset33b_actual_field_owner_frontier.py'
      - 'tests/test_ghidra_bmw_offset33b_memory_load_actual_object_adapter.py'
      - 'tests/test_ghidra_bmw_offset33b_actual_field_owner_frontier.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ACTUAL_MEMORY_OWNER_FRONTIER.md'
      - '.github/workflows/process1-bmw-offset33b-actual-memory-owner-frontier.yml'

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run actual-object memory adapter regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_memory_load_actual_object_adapter.py
      - name: Run actual field-owner frontier regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_actual_field_owner_frontier.py
      - name: Preserve memory-LOAD engine regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_memory_load_provenance.py
      - name: Preserve actual additional-mass zero regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_actual_additional_mass_bootstrap_zero.py
      - name: Preserve Vehicle reference-Y zero regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_vehicle_reference_y_bootstrap_zero.py
      - name: Verify CLI surfaces
        run: >-
          python tools/ghidra/analyze_bmw_offset33b_memory_load_provenance_actual_object.py --help >/dev/null
          && python tools/ghidra/analyze_bmw_offset33b_actual_field_owner_frontier.py --help >/dev/null
