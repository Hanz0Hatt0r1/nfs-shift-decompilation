name: native-physics-phase697

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'src/physics/fun_00770e80_motion_read_runtime_state.py'
      - 'tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_motion_read_runtime_state.py'
      - 'evidence/fun_007682c0_body0_delta_destination.json'
      - 'native_runtime/include/shift_body_record_adapter.hpp'
      - 'native_runtime/src/body_record_adapter.cpp'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_motion_read_effect_provider_chain.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_motion_read_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase696.cmake'
      - 'native_runtime/cmake/phase697.cmake'
      - 'docs/PHASE697_FUN_007682C0_MOTION_READ_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase697.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'src/physics/fun_00770e80_motion_read_runtime_state.py'
      - 'tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py'
      - 'tests/test_fun_00770e80_motion_read_runtime_state.py'
      - 'evidence/fun_007682c0_body0_delta_destination.json'
      - 'native_runtime/include/shift_body_record_adapter.hpp'
      - 'native_runtime/src/body_record_adapter.cpp'
      - 'native_runtime/include/shift_fun_00770e80_composed_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_composed_anchor_chain.cpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/src/fun_00770e80_motion_read_effect_provider_chain.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_motion_read_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase696.cmake'
      - 'native_runtime/cmake/phase697.cmake'
      - 'docs/PHASE697_FUN_007682C0_MOTION_READ_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase697.yml'

jobs:
  fun-007682c0-motion-read-runtime-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 694 through Phase 697 Python regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_contact_outer_runtime_state.py
          tests/test_fun_00770e80_motion_read_effect_provider_chain_runtime.py
          tests/test_fun_00770e80_motion_read_runtime_state.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 695 through Phase 697 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_persistent_body_pose_runtime_state_check
          shift_runtime_fun_00770e80_motion_read_effect_provider_chain_check
          shift_runtime_fun_00770e80_motion_read_runtime_state_check

      - name: Run persistent joined CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_persistent_body_pose_runtime_state|shift_runtime_fun_00770e80_motion_read_effect_provider_chain|shift_runtime_fun_00770e80_motion_read_runtime_state)$'

      - name: Verify Phase 697 report
        run: |
          mkdir -p out/native-physics-phase697
          native_runtime/build/shift_runtime_fun_00770e80_motion_read_runtime_state_check \
            > out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"format":"SHIFT.NativeFun00770e80MotionReadRuntimeState/1"' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"explicit_update_count":2' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"body_pose_snapshot_generation":2' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"motion_read_delta_application_call_count":2' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"persistent_body_bytes_carried_between_explicit_updates":true' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"persistent_pose_snapshots_committed":true' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"phase696_motion_read_chain_reused":true' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"motion_read_body_identity_application_external":false' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"motion_read_body0_delta_application_internal":true' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"motion_read_machine_scalar_production_external":true' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
          grep -q '"host_sqrt_substitution_allowed":false' \
            out/native-physics-phase697/fun_007682c0_motion_read_runtime_state.json
