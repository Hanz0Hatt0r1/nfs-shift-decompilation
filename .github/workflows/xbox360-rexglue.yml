name: Xbox 360 migration gate ledger

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "PROCESS_INSTRUCTIONS.md"
      - "xbox360/**"
      - "docs/XBOX360_REXGLUE_MIGRATION.md"
      - "coordination/xbox360_rexglue_status.json"
      - "tools/xbox360/**"
      - ".github/workflows/xbox360-rexglue.yml"
  pull_request:
    paths:
      - "README.md"
      - "ROADMAP.md"
      - "PROCESS_INSTRUCTIONS.md"
      - "xbox360/**"
      - "docs/XBOX360_REXGLUE_MIGRATION.md"
      - "coordination/xbox360_rexglue_status.json"
      - "tools/xbox360/**"
      - ".github/workflows/xbox360-rexglue.yml"

permissions:
  contents: read

jobs:
  validate-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate evidence-gated Xbox 360 status
        run: python3 tools/xbox360/validate_status.py
      - name: Check retail queue completion evidence
        run: |
          python3 tools/xbox360/test_guest_callback_frontier.py
          python3 tools/xbox360/test_queue_completion_conditions.py
          python3 tools/xbox360/test_timebase_helper_823a0248.py
          python3 tools/xbox360/test_callback_setter_823a5730.py
          python3 tools/xbox360/test_registered_callback_82649b68.py
          python3 tools/xbox360/test_callback_gate_writer_826489d0.py
      - name: Check retail missing-asset return paths
        run: |
          python3 tools/xbox360/test_linux_missing_asset_caller_semantics.py
          python3 tools/xbox360/test_linux_menu_background_missing_flow.py
