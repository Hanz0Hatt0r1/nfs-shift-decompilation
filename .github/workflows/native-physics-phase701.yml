name: native-physics-phase701

on:
  push:
    paths:
      - 'src/physics/native_vehicle_external_provider_frontier.py'
      - 'src/physics/native_vehicle_provider_session_runtime.py'
      - 'tests/test_native_vehicle_external_provider_frontier.py'
      - 'tests/test_native_vehicle_provider_session_runtime.py'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/cmake/phase700.cmake'
      - 'native_runtime/cmake/phase701.cmake'
      - 'docs/PHASE699_NATIVE_VEHICLE_EXTERNAL_PROVIDER_FRONTIER.md'
      - 'docs/PHASE701_NATIVE_VEHICLE_PROVIDER_SESSION.md'
      - '.github/workflows/native-physics-phase701.yml'
  pull_request:
    paths:
      - 'src/physics/native_vehicle_external_provider_frontier.py'
      - 'src/physics/native_vehicle_provider_session_runtime.py'
      - 'tests/test_native_vehicle_external_provider_frontier.py'
      - 'tests/test_native_vehicle_provider_session_runtime.py'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/cmake/phase700.cmake'
      - 'native_runtime/cmake/phase701.cmake'
      - 'docs/PHASE699_NATIVE_VEHICLE_EXTERNAL_PROVIDER_FRONTIER.md'
      - 'docs/PHASE701_NATIVE_VEHICLE_PROVIDER_SESSION.md'
      - '.github/workflows/native-physics-phase701.yml'

jobs:
  deep-provider-session:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 699 and 701 Python regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_native_vehicle_external_provider_frontier.py
          tests/test_native_vehicle_provider_session_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 697 and 701 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_motion_read_runtime_state_check
          shift_runtime_native_vehicle_provider_session_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00770e80_motion_read_runtime_state|shift_runtime_native_vehicle_provider_session)$'

      - name: Verify Phase 701 report
        run: |
          mkdir -p out/native-physics-phase701
          native_runtime/build/shift_runtime_native_vehicle_provider_session_check \
            > out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"format":"SHIFT.NativeVehicleProviderSession/1"' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"phase697_persistent_outer_path_reused":true' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"phase699_external_provider_count":9' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"session_step_count":2' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"persistent_body_state_reused":true' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"provider_admission_before_execution":true' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"participant_gate_before_provider_side_effects":true' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"provider_semantics_promoted":false' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"vehicle_body_identity_proven":false' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"vehicle_world_transform_proven":false' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase701/native_vehicle_provider_session.json
          grep -q '"deep_outer_update_executable_schedule_enabled":false' \
            out/native-physics-phase701/native_vehicle_provider_session.json
