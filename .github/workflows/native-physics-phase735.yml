name: native-physics-phase735

on:
  push:
    paths:
      - 'evidence/fun_007675f0_body_owned_scalars.json'
      - 'evidence/phase735_next_blocker.md'
      - 'docs/PHASE735_FUN_007675F0_BODY_OWNED_SCALARS.md'
      - 'docs/PHASE735_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_fun_007675f0_body_owned_scalars.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_007675f0_body_owned_scalars_check.cpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_join_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_state_ownership_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_filter_cap_ownership_check.cpp'
      - 'native_runtime/cmake/phase734.cmake'
      - 'native_runtime/cmake/phase735.cmake'
      - 'tests/test_s6_fun_007675f0_body_owned_scalars.py'
      - '.github/workflows/native-physics-phase735.yml'
  pull_request:
    paths:
      - 'evidence/fun_007675f0_body_owned_scalars.json'
      - 'evidence/phase735_next_blocker.md'
      - 'docs/PHASE735_FUN_007675F0_BODY_OWNED_SCALARS.md'
      - 'docs/PHASE735_SCOPE.md'
      - 'native_runtime/include/shift_contact_outer_kernel.hpp'
      - 'native_runtime/include/shift_fun_007675f0_body_owned_scalars.hpp'
      - 'native_runtime/src/contact_outer_kernel.cpp'
      - 'native_runtime/src/fun_00770e80_contact_outer_provider_chain.cpp'
      - 'native_runtime/tests/fun_007675f0_body_owned_scalars_check.cpp'
      - 'native_runtime/tests/fun_007675f0_surface_probe_join_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_state_ownership_check.cpp'
      - 'native_runtime/tests/fun_007675f0_distance_filter_cap_ownership_check.cpp'
      - 'native_runtime/cmake/phase734.cmake'
      - 'native_runtime/cmake/phase735.cmake'
      - 'tests/test_s6_fun_007675f0_body_owned_scalars.py'
      - '.github/workflows/native-physics-phase735.yml'

jobs:
  fun-007675f0-body-owned-scalars:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 735 proof regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007675f0_body_owned_scalars.py
          tests/test_s6_fun_007675f0_param3_ownership.py
          tests/test_s6_fun_007675f0_surface_probe_join.py
          tests/test_s6_fun_007675f0_distance_state_ownership.py
          tests/test_s6_fun_007675f0_distance_filter_cap_ownership.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 735 and dependent regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007675f0_body_owned_scalars_check
          shift_runtime_fun_007675f0_param3_ownership_check
          shift_runtime_fun_007675f0_surface_probe_join_check
          shift_runtime_fun_007675f0_distance_state_ownership_check
          shift_runtime_fun_007675f0_distance_filter_cap_ownership_check
          shift_runtime_fun_00770e80_contact_outer_provider_chain_check
          shift_runtime_native_vehicle_provider_session_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007675f0_body_owned_scalars|shift_runtime_fun_007675f0_param3_ownership|shift_runtime_fun_007675f0_surface_probe_join|shift_runtime_fun_007675f0_distance_state_ownership|shift_runtime_fun_007675f0_distance_filter_cap_ownership|shift_runtime_fun_00770e80_contact_outer_provider_chain|shift_runtime_native_vehicle_provider_session)$'

      - name: Verify Phase 735 report
        run: |
          mkdir -p out/native-physics-phase735
          native_runtime/build/shift_runtime_fun_007675f0_body_owned_scalars_check \
            > out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
          grep -q '"format":"SHIFT.Fun007675f0BodyOwnedScalars/1"' \
            out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
          grep -q '"xbox_counterpart":"sub_825939F0"' \
            out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
          grep -q '"base_scalar_internal":true' \
            out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
          grep -q '"alignment_scalar_internal":true' \
            out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
          grep -q '"projected_scalar_external":true' \
            out/native-physics-phase735/fun_007675f0_body_owned_scalars.json
