name: native-physics-phase691

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_scalar_provider_anchor_chain_runtime.py'
      - 'tests/test_fun_00770e80_scalar_provider_anchor_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_scalar_provider_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_scalar_provider_anchor_chain.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_scalar_provider_anchor_chain_check.cpp'
      - 'native_runtime/cmake/phase690.cmake'
      - 'native_runtime/cmake/phase691.cmake'
      - 'docs/PHASE691_FUN_007AFDD0_SCALAR_PROVIDER_OUTER_JOIN.md'
      - '.github/workflows/native-physics-phase691.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_scalar_provider_anchor_chain_runtime.py'
      - 'tests/test_fun_00770e80_scalar_provider_anchor_chain_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_scalar_provider_anchor_chain.hpp'
      - 'native_runtime/src/fun_00770e80_scalar_provider_anchor_chain.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_scalar_provider_anchor_chain_check.cpp'
      - 'native_runtime/cmake/phase690.cmake'
      - 'native_runtime/cmake/phase691.cmake'
      - 'docs/PHASE691_FUN_007AFDD0_SCALAR_PROVIDER_OUTER_JOIN.md'
      - '.github/workflows/native-physics-phase691.yml'

jobs:
  fun-007afdd0-scalar-provider-outer-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 691 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_scalar_provider_anchor_chain_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 691 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_scalar_provider_anchor_chain_check

      - name: Run Phase 691 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_scalar_provider_anchor_chain$'

      - name: Verify Phase 691 report
        run: |
          mkdir -p out/native-physics-phase691
          native_runtime/build/shift_runtime_fun_00770e80_scalar_provider_anchor_chain_check \
            > out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"format":"SHIFT.NativeFun00770e80ScalarProviderAnchorChain/1"' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"scalar_provider_call_count":4' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"zero_noop_count":4' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"fun_007afdd0_source_core_used":true' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"arbitrary_basis_callback_external":false' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"machine_scalar_production_external":true' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"host_libm_substitution":false' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase691/fun_00770e80_scalar_provider_anchor_chain.json
