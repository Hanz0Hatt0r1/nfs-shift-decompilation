name: CI

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run complete Python suite
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native IR
        run: cmake -S native_ir -B native_ir/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native IR
        run: cmake --build native_ir/build --parallel
      - name: Generate deterministic native parser fixtures
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          out = Path("native_ir/ci-fixtures")
          out.mkdir(parents=True, exist_ok=True)
          mgeo = bytearray(b"MGEO")
          mgeo += struct.pack("<HHIIIIII", 1, 0, 4, 6, 1, 1, 4, 0)
          mgeo += struct.pack("<12f", *([0.0] * 12))
          mgeo += struct.pack("<12f", *([0.0] * 12))
          mgeo += struct.pack("<I", 2)
          mgeo += struct.pack("<8f", *([0.0] * 8))
          mgeo += struct.pack("<6I", 0, 1, 2, 0, 2, 3)
          (out / "mesh.mgeo").write_bytes(mgeo)
          cmesh = bytearray(b"CMES")
          cmesh += struct.pack("<HHIIII", 1, 0, 363, 1887, 629, 0)
          cmesh += struct.pack("<1089f", *([0.0] * 1089))
          cmesh += struct.pack("<1887I", *([0] * 1887))
          (out / "collision.cmesh").write_bytes(cmesh)
          PY
      - name: Run native IR regression
        run: ./native_ir/build/test_ir native_ir/ci-fixtures/mesh.mgeo native_ir/ci-fixtures/collision.cmesh

  capture-producer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure D3D9 capture producer
        run: cmake -S native_capture -B native_capture/build -A Win32
      - name: Build D3D9 capture producer
        run: cmake --build native_capture/build --config Release
      - name: Verify selected-session rate sampler self-test
        shell: pwsh
        run: |
          $sampler = Resolve-Path "native_capture/build/Release/shift_selected_session_rate_snapshot.exe"
          $snapshot = Join-Path $env:RUNNER_TEMP "selected_session_rate_snapshot.json"
          & $sampler --self-test --stable-samples 3 --output $snapshot
          if ($LASTEXITCODE -ne 0) {
            throw "selected-session rate sampler self-test failed with exit code $LASTEXITCODE"
          }
          $report = Get-Content -Raw $snapshot | ConvertFrom-Json
          if ($report.format -ne "SHIFT.SelectedSessionPhysicsTweakerRateSnapshot/1" -or
              $report.status -ne "self-test-passed" -or
              $report.ready -or $report.admission_eligible -or
              -not $report.self_test -or
              -not $report.retail_identity.identity_ready -or
              $report.selected_session.loaded_tick_rate_hz -ne 240 -or
              $report.current_manager.rate_hz -ne 210 -or
              $report.current_manager.equals_loaded_tick_rate -or
              -not $report.current_manager.relationships_valid -or
              $report.adjudication.selected_session_loaded_rate_observed_after_PhysicsTweaker_load -or
              $report.adjudication.current_manager_rate_matches_loaded_at_observation -or
              $report.adjudication.retail_inner_substep_execution_admitted) {
            $report | ConvertTo-Json -Depth 8 | Write-Host
            throw "selected-session rate sampler self-test contract mismatch"
          }
      - name: Verify capture tools have no VC runtime dependency
        shell: pwsh
        run: |
          $targets = @(
            (Resolve-Path "native_capture/build/Release/d3d9.dll"),
            (Resolve-Path "native_capture/build/Release/shift_selected_session_rate_snapshot.exe")
          )
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) {
            throw "Visual Studio installation path was not found"
          }
          $dumpbin = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC/*/bin/Hostx64/x86/dumpbin.exe") |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }
          $forbidden = @("MSVCP", "VCRUNTIME", "api-ms-win-crt")
          foreach ($target in $targets) {
            $dependents = & $dumpbin.FullName /nologo /dependents $target
            foreach ($prefix in $forbidden) {
              if ($dependents -match [regex]::Escape($prefix)) {
                $dependents | Write-Host
                throw "$target unexpectedly depends on $prefix"
              }
            }
          }
      - name: Verify D3D9 exports and passthrough forwarding
        shell: pwsh
        run: |
          $dll = Resolve-Path "native_capture/build/Release/d3d9.dll"
          $smoke = Resolve-Path "native_capture/build/Release/shift_d3d9_proxy_smoke.exe"
          $log = Join-Path $env:RUNNER_TEMP "shift_d3d9_proxy_smoke.jsonl"
          & $smoke $dll $log
          if ($LASTEXITCODE -ne 0) {
            throw "D3D9 proxy smoke test failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $log)) {
            throw "D3D9 proxy smoke log was not created"
          }
          Get-Content $log | ForEach-Object {
            $_ | ConvertFrom-Json | Out-Null
          }
      - name: Verify explicit D3D9 backend chainload
        shell: pwsh
        run: |
          $dll = Resolve-Path "native_capture/build/Release/d3d9.dll"
          $smoke = Resolve-Path "native_capture/build/Release/shift_d3d9_proxy_smoke.exe"
          $log = Join-Path $env:RUNNER_TEMP "shift_d3d9_proxy_backend_smoke.jsonl"
          $env:SHIFT_D3D9_BACKEND = Join-Path $env:WINDIR "System32\d3d9.dll"
          try {
            & $smoke $dll $log
            if ($LASTEXITCODE -ne 0) {
              throw "D3D9 backend smoke test failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item Env:SHIFT_D3D9_BACKEND -ErrorAction SilentlyContinue
          }
          $events = Get-Content $log | ForEach-Object { $_ | ConvertFrom-Json }
          $selected = $events | Where-Object event -eq "proxy_d3d9_backend_selected" | Select-Object -Last 1
          if (-not $selected -or $selected.source -ne "environment") {
            $events | ConvertTo-Json -Depth 5 | Write-Host
            throw "proxy did not report the explicit environment backend"
          }
      - name: Parse PowerShell capture launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/run_shift_capture.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "tools/run_shift_capture.ps1 has PowerShell parse errors"
          }
      - name: Upload D3D9 proxy build
        uses: actions/upload-artifact@v4
        with:
          name: shift-d3d9-proxy-win32
          path: |
            native_capture/build/Release/d3d9.dll
            native_capture/build/Release/shift_d3d9_proxy_smoke.exe
            native_capture/build/Release/shift_selected_session_rate_snapshot.exe
          if-no-files-found: error
