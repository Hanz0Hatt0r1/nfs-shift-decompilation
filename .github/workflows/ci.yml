name: CI

on:
  push:
    branches: ["main", "work/**", "audit/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Run repository Python suite
        run: python -m pytest -q --ignore=tests/test_formats.py --ignore=tests/test_shader_asm.py
      - name: Run shader and format tests without external game fixtures
        run: |
          python -m pytest -q tests/test_shader_asm.py
          python -m pytest -q tests/test_formats.py -k "not test_real_bmt_material and not test_real_bmt_specialization_flags and not test_real_bml_container and not test_real_meb_mesh_and_mgeo and not test_real_csm_collision_mesh and not test_real_meb_skinning_payload"
      - name: Probe full Python suite against current CI environment
        continue-on-error: true
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native IR
        run: cmake -S native_ir -B native_ir/build -DCMAKE_BUILD_TYPE=Release
      - name: Build native IR
        run: cmake --build native_ir/build --parallel
      - name: Generate deterministic native parser fixtures
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          out=Path("native_ir/audit-fixtures")
          out.mkdir(parents=True,exist_ok=True)
          mgeo=bytearray(b"MGEO")
          mgeo += struct.pack("<HHIIIIII",1,0,4,6,1,1,4,0)
          mgeo += struct.pack("<12f", *([0.0]*12))
          mgeo += struct.pack("<12f", *([0.0]*12))
          mgeo += struct.pack("<I",2)
          mgeo += struct.pack("<8f", *([0.0]*8))
          mgeo += struct.pack("<6I",0,1,2,0,2,3)
          Path(out/"mesh.mgeo").write_bytes(mgeo)
          cmesh=bytearray(b"CMES")
          cmesh += struct.pack("<HHIIII",1,0,363,1887,629,0)
          cmesh += struct.pack("<1089f", *([0.0]*1089))
          cmesh += struct.pack("<1887I", *([0]*1887))
          Path(out/"collision.cmesh").write_bytes(cmesh)
          PY
      - name: Run native IR parser regression
        run: ./native_ir/build/test_ir native_ir/audit-fixtures/mesh.mgeo native_ir/audit-fixtures/collision.cmesh
