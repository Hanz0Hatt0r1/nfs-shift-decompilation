name: native-physics-phase681

on:
  push:
    paths:
      - 'src/physics/fun_007afdd0_source_core.py'
      - 'tests/test_fun_007afdd0_source_core.py'
      - 'native_runtime/include/shift_fun_007afdd0_source_core.hpp'
      - 'native_runtime/src/fun_007afdd0_source_core.cpp'
      - 'native_runtime/tests/fun_007afdd0_source_core_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'evidence/fun_007afdd0_source_core.json'
      - 'docs/PHASE681_FUN_007AFDD0_SOURCE_CORE.md'
      - '.github/workflows/native-physics-phase681.yml'
  pull_request:
    paths:
      - 'src/physics/fun_007afdd0_source_core.py'
      - 'tests/test_fun_007afdd0_source_core.py'
      - 'native_runtime/include/shift_fun_007afdd0_source_core.hpp'
      - 'native_runtime/src/fun_007afdd0_source_core.cpp'
      - 'native_runtime/tests/fun_007afdd0_source_core_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'evidence/fun_007afdd0_source_core.json'
      - 'docs/PHASE681_FUN_007AFDD0_SOURCE_CORE.md'
      - '.github/workflows/native-physics-phase681.yml'

jobs:
  fun-007afdd0-source-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 681 Python oracle regression
        run: PYTHONPATH=src/physics python3 -m pytest -q tests/test_fun_007afdd0_source_core.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 681 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007afdd0_source_core_check

      - name: Run Phase 681 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_007afdd0_source_core$'

      - name: Verify Phase 681 report and evidence gate
        run: |
          mkdir -p out/native-physics-phase681
          native_runtime/build/shift_runtime_fun_007afdd0_source_core_check \
            > out/native-physics-phase681/fun_007afdd0_source_core.json
          grep -q '"format":"SHIFT.NativeFun007afdd0SourceCore/1"' \
            out/native-physics-phase681/fun_007afdd0_source_core.json
          grep -q '"machine_precision_gate_required":true' \
            out/native-physics-phase681/fun_007afdd0_source_core.json
          grep -q '"native_callback_replacement_ready":false' \
            out/native-physics-phase681/fun_007afdd0_source_core.json
          python3 -m json.tool evidence/fun_007afdd0_source_core.json >/dev/null
          grep -q '"machine_precision_ready": false' evidence/fun_007afdd0_source_core.json
