name: native-physics-phase743

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_selected_bmw_application_point.hpp'
      - 'native_runtime/tests/fun_00766510_selected_bmw_application_point_check.cpp'
      - 'native_runtime/cmake/phase742.cmake'
      - 'native_runtime/cmake/phase743.cmake'
      - 'tests/test_s6_fun_00766510_selected_bmw_application_point.py'
      - 'evidence/fun_00766510_selected_bmw_application_point.json'
      - 'evidence/phase743_next_blocker.md'
      - 'docs/PHASE743_FUN_00766510_SELECTED_BMW_APPLICATION_POINT.md'
      - 'docs/PHASE743_SCOPE.md'
      - '.github/workflows/native-physics-phase743.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_selected_bmw_application_point.hpp'
      - 'native_runtime/tests/fun_00766510_selected_bmw_application_point_check.cpp'
      - 'native_runtime/cmake/phase742.cmake'
      - 'native_runtime/cmake/phase743.cmake'
      - 'tests/test_s6_fun_00766510_selected_bmw_application_point.py'
      - 'evidence/fun_00766510_selected_bmw_application_point.json'
      - 'evidence/phase743_next_blocker.md'
      - 'docs/PHASE743_FUN_00766510_SELECTED_BMW_APPLICATION_POINT.md'
      - 'docs/PHASE743_SCOPE.md'
      - '.github/workflows/native-physics-phase743.yml'

jobs:
  selected-bmw-application-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev
      - name: Run Phase 743 proof regression
        run: python3 -m pytest -q tests/test_s6_fun_00766510_selected_bmw_application_point.py
      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Phase 743 and Phase 742 dependency
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_selected_bmw_application_point_check
          shift_runtime_fun_00766510_primary_response_application_check
      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_selected_bmw_application_point|shift_runtime_fun_00766510_primary_response_application)$'
      - name: Verify Phase 743 native report
        run: |
          mkdir -p out/native-physics-phase743
          native_runtime/build/shift_runtime_fun_00766510_selected_bmw_application_point_check \
            > out/native-physics-phase743/fun_00766510_selected_bmw_application_point.json
          grep -q '"format":"SHIFT.Fun00766510SelectedBMWApplicationPoint/1"' \
            out/native-physics-phase743/fun_00766510_selected_bmw_application_point.json
          grep -q '"aliases_phase727_body_rotated_local":true' \
            out/native-physics-phase743/fun_00766510_selected_bmw_application_point.json
          grep -q '"runtime_provider_handoff_joined":false' \
            out/native-physics-phase743/fun_00766510_selected_bmw_application_point.json
