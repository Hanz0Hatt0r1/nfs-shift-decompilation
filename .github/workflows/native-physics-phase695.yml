name: native-physics-phase695

on:
  push:
    paths:
      - 'src/physics/persistent_body_pose_snapshot_runtime.py'
      - 'tests/test_persistent_body_pose_snapshot_runtime.py'
      - 'native_runtime/include/shift_persistent_body_pose_snapshot.hpp'
      - 'native_runtime/src/persistent_body_pose_snapshot.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/tests/persistent_body_pose_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase694.cmake'
      - 'native_runtime/cmake/phase695.cmake'
      - 'docs/PHASE695_PERSISTENT_BODY_POSE_SNAPSHOT.md'
      - '.github/workflows/native-physics-phase695.yml'
  pull_request:
    paths:
      - 'src/physics/persistent_body_pose_snapshot_runtime.py'
      - 'tests/test_persistent_body_pose_snapshot_runtime.py'
      - 'native_runtime/include/shift_persistent_body_pose_snapshot.hpp'
      - 'native_runtime/src/persistent_body_pose_snapshot.cpp'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/tests/persistent_body_pose_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase694.cmake'
      - 'native_runtime/cmake/phase695.cmake'
      - 'docs/PHASE695_PERSISTENT_BODY_POSE_SNAPSHOT.md'
      - '.github/workflows/native-physics-phase695.yml'

jobs:
  persistent-body-pose-snapshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 695 Python pose oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_persistent_body_pose_snapshot_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 694 and Phase 695 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_contact_outer_runtime_state_check
          shift_runtime_persistent_body_pose_runtime_state_check

      - name: Run persistent runtime-state CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_(fun_00770e80_contact_outer_runtime_state|persistent_body_pose_runtime_state)$'

      - name: Verify Phase 695 report
        run: |
          mkdir -p out/native-physics-phase695
          native_runtime/build/shift_runtime_persistent_body_pose_runtime_state_check \
            > out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"format":"SHIFT.NativePersistentBodyPoseSnapshot/1"' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"snapshot_generation":2' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"explicit_update_count":2' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"persistent_snapshot_matches_committed_body_bytes":true' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"body_to_vehicle_identity_proven":false' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"vehicle_world_transform_proven":false' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"renderer_transport_enabled":false' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase695/persistent_body_pose_runtime_state.json
