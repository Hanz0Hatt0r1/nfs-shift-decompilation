name: Process 1 vehicle RenderHierarchy resource owner

on:
  push:
    paths:
      - 'tools/ghidra/analyze_vehicle_render_hierarchy_resource_owner.py'
      - 'tests/test_ghidra_vehicle_render_hierarchy_resource_owner.py'
      - 'docs/PROCESS_1_VEHICLE_RENDER_HIERARCHY_RESOURCE_OWNER_JOIN.md'
      - '.github/workflows/process1-vehicle-render-hierarchy-resource-owner.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_vehicle_render_hierarchy_resource_owner.py'
      - 'tests/test_ghidra_vehicle_render_hierarchy_resource_owner.py'
      - 'docs/PROCESS_1_VEHICLE_RENDER_HIERARCHY_RESOURCE_OWNER_JOIN.md'
      - '.github/workflows/process1-vehicle-render-hierarchy-resource-owner.yml'

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run focused regressions
        run: python -m pytest -q tests/test_ghidra_vehicle_render_hierarchy_resource_owner.py
      - name: Check CLI surface
        run: python tools/ghidra/analyze_vehicle_render_hierarchy_resource_owner.py --help
