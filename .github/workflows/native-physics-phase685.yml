name: native-physics-phase685

on:
  push:
    paths:
      - 'src/physics/fun_00765470_wheel_feedback_join_runtime.py'
      - 'tests/test_fun_00765470_wheel_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00765470_wheel_feedback_join.hpp'
      - 'native_runtime/src/fun_00765470_wheel_feedback_join.cpp'
      - 'native_runtime/tests/fun_00765470_wheel_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE685_FUN_00765470_WHEEL_FEEDBACK_JOIN.md'
      - '.github/workflows/native-physics-phase685.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00765470_wheel_feedback_join_runtime.py'
      - 'tests/test_fun_00765470_wheel_feedback_join_runtime.py'
      - 'native_runtime/include/shift_fun_00765470_wheel_feedback_join.hpp'
      - 'native_runtime/src/fun_00765470_wheel_feedback_join.cpp'
      - 'native_runtime/tests/fun_00765470_wheel_feedback_join_check.cpp'
      - 'native_runtime/cmake/recent_physics.cmake'
      - 'docs/PHASE685_FUN_00765470_WHEEL_FEEDBACK_JOIN.md'
      - '.github/workflows/native-physics-phase685.yml'

jobs:
  fun-00765470-wheel-feedback-join:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 685 Python scheduling oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00765470_wheel_feedback_join_runtime.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 685 native regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00765470_wheel_feedback_join_check

      - name: Run Phase 685 CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00765470_wheel_feedback_join$'

      - name: Verify Phase 685 report
        run: |
          mkdir -p out/native-physics-phase685
          native_runtime/build/shift_runtime_fun_00765470_wheel_feedback_join_check \
            > out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"format":"SHIFT.NativeFun00765470WheelFeedbackJoin/1"' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"wheel_anchor_before_feedback_integration_proven":true' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"phase679_join_reused":true' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"persistent_body_result_preserved":true' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"intervening_local_work_modeled":false' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
          grep -q '"complete_fun_00765470_semantics":false' \
            out/native-physics-phase685/fun_00765470_wheel_feedback_join.json
