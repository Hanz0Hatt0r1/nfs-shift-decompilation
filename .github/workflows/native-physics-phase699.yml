name: native-physics-phase699

on:
  push:
    paths:
      - 'src/physics/vehicle_body_pose_selection_runtime.py'
      - 'src/physics/vehicle_body_pose_runtime_handoff.py'
      - 'tests/test_vehicle_body_pose_selection_runtime.py'
      - 'tests/test_vehicle_body_pose_runtime_handoff.py'
      - 'native_runtime/include/shift_vehicle_body_pose_selection.hpp'
      - 'native_runtime/include/shift_vehicle_body_pose_runtime_handoff.hpp'
      - 'native_runtime/src/vehicle_body_pose_selection.cpp'
      - 'native_runtime/src/vehicle_body_pose_runtime_handoff.cpp'
      - 'native_runtime/tests/vehicle_body_pose_runtime_handoff_check.cpp'
      - 'native_runtime/cmake/phase698.cmake'
      - 'native_runtime/cmake/phase699.cmake'
      - 'docs/PHASE699_VEHICLE_BODY_POSE_RUNTIME_HANDOFF.md'
      - '.github/workflows/native-physics-phase699.yml'
  pull_request:
    paths:
      - 'src/physics/vehicle_body_pose_selection_runtime.py'
      - 'src/physics/vehicle_body_pose_runtime_handoff.py'
      - 'tests/test_vehicle_body_pose_selection_runtime.py'
      - 'tests/test_vehicle_body_pose_runtime_handoff.py'
      - 'native_runtime/include/shift_vehicle_body_pose_selection.hpp'
      - 'native_runtime/include/shift_vehicle_body_pose_runtime_handoff.hpp'
      - 'native_runtime/src/vehicle_body_pose_selection.cpp'
      - 'native_runtime/src/vehicle_body_pose_runtime_handoff.cpp'
      - 'native_runtime/tests/vehicle_body_pose_runtime_handoff_check.cpp'
      - 'native_runtime/cmake/phase698.cmake'
      - 'native_runtime/cmake/phase699.cmake'
      - 'docs/PHASE699_VEHICLE_BODY_POSE_RUNTIME_HANDOFF.md'
      - '.github/workflows/native-physics-phase699.yml'

jobs:
  vehicle-body-pose-runtime-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 698 and 699 Python oracles
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_vehicle_body_pose_selection_runtime.py
          tests/test_vehicle_body_pose_runtime_handoff.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 698 and 699 native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_vehicle_body_pose_selection_check
          shift_runtime_vehicle_body_pose_runtime_handoff_check

      - name: Run Phase 698 and 699 CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_vehicle_body_pose_(selection|runtime_handoff)$'

      - name: Verify Phase 699 report
        run: |
          mkdir -p out/native-physics-phase699
          native_runtime/build/shift_runtime_vehicle_body_pose_runtime_handoff_check \
            > out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"format":"SHIFT.NativeVehicleBodyPoseRuntimeHandoff/1"' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"phase698_selector_reused":true' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"native_runtime_state_admission_required":true' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"runtime_state_mutated":false' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"vehicle_world_transform_proven":false' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"renderer_transport_enabled":false' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
          grep -q '"deep_outer_update_executable_schedule_enabled":false' \
            out/native-physics-phase699/vehicle_body_pose_runtime_handoff.json
