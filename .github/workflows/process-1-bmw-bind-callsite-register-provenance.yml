name: process-1-bmw-bind-callsite-register-provenance

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_CALLSITE_REGISTER_PROVENANCE.md'
      - '.github/workflows/process-1-bmw-bind-callsite-register-provenance.yml'
      - 'tools/ghidra/analyze_fun_00765470_body_owner_receiver.py'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_CALLSITE_REGISTER_PROVENANCE.md'
      - '.github/workflows/process-1-bmw-bind-callsite-register-provenance.yml'
      - 'tools/ghidra/analyze_fun_00765470_body_owner_receiver.py'

jobs:
  bind-callsite-register-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run focused provenance regressions
        run: python -m pytest -q tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py
      - name: Regress reused FUN_00765470 register engine
        run: python -m pytest -q tests/test_ghidra_fun_00765470_body_owner_receiver.py
      - name: Verify CLI surface
        run: python tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py --help >/dev/null
