name: native-physics-phase694

on:
  push:
    paths:
      - 'src/physics/fun_00770e80_contact_outer_runtime_state.py'
      - 'tests/test_fun_00770e80_contact_outer_runtime_state.py'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_outer_update_fixture.hpp'
      - 'native_runtime/tests/fun_00770e80_scalar_provider_anchor_chain_check.cpp'
      - 'native_runtime/tests/fun_00770e80_contact_outer_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase693.cmake'
      - 'native_runtime/cmake/phase694.cmake'
      - 'docs/PHASE694_FUN_007675F0_CONTACT_OUTER_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase694.yml'
  pull_request:
    paths:
      - 'src/physics/fun_00770e80_contact_outer_runtime_state.py'
      - 'tests/test_fun_00770e80_contact_outer_runtime_state.py'
      - 'native_runtime/src/runtime_explicit_outer_update_state.hpp'
      - 'native_runtime/src/runtime_state.hpp'
      - 'native_runtime/tests/fun_00770e80_outer_update_fixture.hpp'
      - 'native_runtime/tests/fun_00770e80_scalar_provider_anchor_chain_check.cpp'
      - 'native_runtime/tests/fun_00770e80_contact_outer_runtime_state_check.cpp'
      - 'native_runtime/cmake/phase693.cmake'
      - 'native_runtime/cmake/phase694.cmake'
      - 'docs/PHASE694_FUN_007675F0_CONTACT_OUTER_RUNTIME_STATE.md'
      - '.github/workflows/native-physics-phase694.yml'

jobs:
  fun-007675f0-contact-outer-runtime-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 694 Python state oracle
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_contact_outer_runtime_state.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 691 and Phase 694 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_scalar_provider_anchor_chain_check
          shift_runtime_fun_00770e80_contact_outer_runtime_state_check

      - name: Run persistent outer-update CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_fun_00770e80_(scalar_provider_anchor_chain|contact_outer_runtime_state)$'

      - name: Verify Phase 694 report
        run: |
          mkdir -p out/native-physics-phase694
          native_runtime/build/shift_runtime_fun_00770e80_contact_outer_runtime_state_check \
            > out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"format":"SHIFT.NativeFun00770e80ContactOuterRuntimeState/1"' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"explicit_update_count":2' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"contact_outer_input_provider_call_count":2' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"contact_outer_native_call_count":2' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"persistent_body_bytes_carried_between_explicit_updates":true' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"participant_gate_before_provider_side_effects":true' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"fixed_step_auto_schedule":false' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
          grep -q '"machine_scalar_production_external":true' \
            out/native-physics-phase694/fun_00770e80_contact_outer_runtime_state.json
