name: Native runtime Phase 710

on:
  push:
    branches: [main]
    paths:
      - 'native_runtime/src/runtime_loop_policy.hpp'
      - 'native_runtime/tests/runtime_loop_policy_check.cpp'
      - 'tests/test_native_runtime_phase710_fixed_step_pacing.py'
      - 'docs/PHASE710_NATIVE_FIXED_STEP_PACING.md'
      - '.github/workflows/native-runtime-phase710.yml'
  pull_request:
    paths:
      - 'native_runtime/src/runtime_loop_policy.hpp'
      - 'native_runtime/tests/runtime_loop_policy_check.cpp'
      - 'tests/test_native_runtime_phase710_fixed_step_pacing.py'
      - 'docs/PHASE710_NATIVE_FIXED_STEP_PACING.md'
      - '.github/workflows/native-runtime-phase710.yml'

jobs:
  phase710:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libvulkan-dev libxcb1-dev glslang-tools python3-pytest
      - name: Configure
        run: cmake -S native_runtime -B native_runtime/build -G Ninja -DBUILD_TESTING=ON
      - name: Build native loop policy and runtime
        run: cmake --build native_runtime/build --target shift_runtime_loop_policy_check shift_runtime
      - name: CTest fixed-step pacing
        run: ctest --test-dir native_runtime/build --output-on-failure -R '^shift_runtime_loop_policy$'
      - name: Python scheduling boundary
        run: python3 -m pytest -q tests/test_native_runtime_phase710_fixed_step_pacing.py tests/test_native_runtime_contract.py
