name: native-physics-phase711

on:
  push:
    paths:
      - '.github/workflows/native-physics-phase711.yml'
      - 'evidence/bmw_offset33b_selector_complete_numeric.json'
      - 'native_runtime/include/shift_bmw_offset33b_race_mode_selector.hpp'
      - 'native_runtime/src/bmw_offset33b_race_mode_selector.cpp'
      - 'native_runtime/tests/bmw_offset33b_race_mode_selector_check.cpp'
      - 'native_runtime/cmake/phase707.cmake'
      - 'native_runtime/cmake/phase711.cmake'
      - 'docs/PROCESS_2_BMW_OFFSET33B_RACE_MODE_SELECTOR.md'
  pull_request:
    paths:
      - '.github/workflows/native-physics-phase711.yml'
      - 'evidence/bmw_offset33b_selector_complete_numeric.json'
      - 'native_runtime/include/shift_bmw_offset33b_race_mode_selector.hpp'
      - 'native_runtime/src/bmw_offset33b_race_mode_selector.cpp'
      - 'native_runtime/tests/bmw_offset33b_race_mode_selector_check.cpp'
      - 'native_runtime/cmake/phase707.cmake'
      - 'native_runtime/cmake/phase711.cmake'
      - 'docs/PROCESS_2_BMW_OFFSET33B_RACE_MODE_SELECTOR.md'

jobs:
  bmw-offset33b-race-mode-selector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libvulkan-dev glslang-tools libxcb1-dev

      - name: Validate source Process 1 contract
        run: |
          python3 -m json.tool evidence/bmw_offset33b_selector_complete_numeric.json >/dev/null
          grep -q '"BMW_numeric_offset33b_selector_family_ready": true' \
            evidence/bmw_offset33b_selector_complete_numeric.json
          grep -q '"outer_vehicle_root_to_VHF_vehicle_root_ready": false' \
            evidence/bmw_offset33b_selector_complete_numeric.json
          grep -q '"vehicle_world_transform_ready": false' \
            evidence/bmw_offset33b_selector_complete_numeric.json

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build selector regression
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_bmw_offset33b_race_mode_selector_check

      - name: Run focused CTest regression
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^shift_runtime_bmw_offset33b_race_mode_selector$'

      - name: Verify Phase 711 report
        run: |
          mkdir -p out/native-physics-phase711
          native_runtime/build/shift_runtime_bmw_offset33b_race_mode_selector_check \
            > out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"format":"SHIFT.NativeBMWOffset33bRaceModeSelector/1"' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"phase":711' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"process1_contract":"SHIFT.BMWOffset33bSelectorCompleteNumeric/1"' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"selector_combinations":6' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"unique_translations":3' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"difficulty_3_rejected":true' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"body0_to_outer_vehicle_ready_when_selector_bound":true' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"outer_vehicle_to_vhf_ready":false' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"body0_bind_frame_proof_ready":false' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
          grep -q '"vehicle_world_transform_ready":false' \
            out/native-physics-phase711/bmw_offset33b_race_mode_selector.json
