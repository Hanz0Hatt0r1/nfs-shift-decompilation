name: process1-body0-bind-static-proof-runner

on:
  push:
    paths:
      - 'tools/ghidra/run_bmw_body0_bind_static_proof.py'
      - 'tests/test_ghidra_run_bmw_body0_bind_static_proof.py'
      - 'tools/ghidra/build_bmw_body0_bind_initialization_frontier.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/join_bmw_body0_bind_pose_writer_abi.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_stack_value_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_target_role.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_STATIC_PROOF_RUNNER.md'
      - '.github/workflows/process1-body0-bind-static-proof-runner.yml'
  pull_request:
    paths:
      - 'tools/ghidra/run_bmw_body0_bind_static_proof.py'
      - 'tests/test_ghidra_run_bmw_body0_bind_static_proof.py'
      - 'tools/ghidra/build_bmw_body0_bind_initialization_frontier.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/join_bmw_body0_bind_pose_writer_abi.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_stack_value_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_target_role.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_STATIC_PROOF_RUNNER.md'
      - '.github/workflows/process1-body0-bind-static-proof-runner.yml'

jobs:
  static-proof-runner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run runner orchestration regressions
        run: python -m pytest -q tests/test_ghidra_run_bmw_body0_bind_static_proof.py
      - name: Preserve terminal proof-stage regressions
        run: >-
          python -m pytest -q
          tests/test_ghidra_bmw_body0_bind_pose_writer_target_role.py
          tests/test_ghidra_bmw_body0_bind_pose_writer_value_provenance.py
      - name: Verify runner CLI
        run: python tools/ghidra/run_bmw_body0_bind_static_proof.py --help >/dev/null
