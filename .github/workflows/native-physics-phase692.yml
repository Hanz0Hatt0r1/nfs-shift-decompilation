name: native-physics-phase692

on:
  push:
    paths:
      - 'tools/ghidra/analyze_fun_007afdd0_scalar_provenance.py'
      - 'tools/ghidra/run_fun_007afdd0_scalar_provenance.sh'
      - 'tests/test_ghidra_fun_007afdd0_scalar_provenance.py'
      - 'docs/PHASE692_FUN_007AFDD0_SCALAR_PROVENANCE.md'
      - '.github/workflows/native-physics-phase692.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_fun_007afdd0_scalar_provenance.py'
      - 'tools/ghidra/run_fun_007afdd0_scalar_provenance.sh'
      - 'tests/test_ghidra_fun_007afdd0_scalar_provenance.py'
      - 'docs/PHASE692_FUN_007AFDD0_SCALAR_PROVENANCE.md'
      - '.github/workflows/native-physics-phase692.yml'

jobs:
  fun-007afdd0-scalar-provenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: python3 -m pip install --user pytest

      - name: Check runner syntax
        run: bash -n tools/ghidra/run_fun_007afdd0_scalar_provenance.sh

      - name: Run Phase 680 and Phase 692 static analyzer regressions
        run: >-
          python3 -m pytest -q
          tests/test_ghidra_fun_007afdd0_basis_rotation.py
          tests/test_ghidra_fun_007afdd0_scalar_provenance.py
