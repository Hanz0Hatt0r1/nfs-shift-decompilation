      - 'native_runtime/cmake/phase743.cmake'
      - 'native_runtime/cmake/phase744.cmake'
      - 'native_runtime/cmake/phase745.cmake'
      - 'tests/test_s6_fun_00766510_selected_bmw_application_point.py'
      - 'tests/test_s6_fun_00765c40_collision_output_handoff.py'
      - 'tests/test_s6_fun_00765c40_external_pass_result.py'
      - 'tests/test_s6_fun_00765c40_query_input_boundary.py'
      - 'tests/test_s6_fun_00765c40_query_cache_lifetime.py'
      - 'tests/test_s6_fun_00766510_same_pass_session_handoff.py'
      - 'evidence/fun_00766510_selected_bmw_application_point.json'
      - 'evidence/fun_00765c40_collision_output_handoff.json'
      - 'evidence/fun_00766510_same_pass_session_handoff.json'
      - 'evidence/phase743_next_blocker.md'
      - 'evidence/phase744_next_blocker.md'
      - 'evidence/phase745_next_blocker.md'
      - 'docs/PHASE743_FUN_00766510_SELECTED_BMW_APPLICATION_POINT.md'
      - 'docs/PHASE743_SCOPE.md'
      - 'docs/PHASE744_FUN_00765C40_COLLISION_OUTPUT_HANDOFF.md'
      - 'docs/PHASE744_SCOPE.md'
      - 'docs/PHASE745_FUN_00766510_SAME_PASS_SESSION_HANDOFF.md'
      - 'docs/PHASE745_SCOPE.md'
      - 'coordination/ci_migrations/native_physics_contact_handoff_743_745.json'
      - 'tests/test_ci_workflow_migration_contact_handoff.py'
      - '.github/workflows/native-physics-contact-handoff.yml'
  workflow_dispatch:

concurrency:
  group: native-physics-contact-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contact-handoff-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run contact-handoff Python regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00766510_selected_bmw_application_point.py
          tests/test_s6_fun_00765c40_collision_output_handoff.py
          tests/test_s6_fun_00765c40_external_pass_result.py
          tests/test_s6_fun_00765c40_query_input_boundary.py
          tests/test_s6_fun_00765c40_query_cache_lifetime.py
          tests/test_s6_fun_00766510_same_pass_session_handoff.py

      - name: Validate collision-output handoff evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00765c40_collision_output_handoff.json').read_text())
          assert e['format'] == 'SHIFT.Fun00765c40CollisionOutputHandoff/1'
          assert e['ready'] is True
          assert e['contracts']['external_result'] == 'SHIFT.Fun00765c40ExternalPassResult/4'
          assert e['selected_bmw_result_rule']['collision_output_required'] is True
          assert e['native_scalar_handoff']['implemented'] is True
          assert e['native_scalar_handoff']['session_wired'] is False
          assert e['dependencies']['phase742_primary_response_application_internalized'] is True
          assert e['dependencies']['phase743_application_point_source_owner_closed'] is True
          assert e['next_blocker']['phase'] == 745
          assert e['scope']['external_provider_count_after'] == 7
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build consolidated contact-handoff regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_primary_response_application_check
          shift_runtime_fun_00766510_selected_bmw_application_point_check
          shift_runtime_fun_00765c40_collision_output_handoff_check
          shift_runtime_fun_00765c40_external_pass_result_check
          shift_runtime_fun_00765c40_selected_bmw_query_fallback_check
          shift_runtime_fun_00765c40_query_cache_lifetime_check
          shift_runtime_fun_00766510_same_pass_handoff_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_primary_response_application|shift_runtime_fun_00766510_selected_bmw_application_point|shift_runtime_fun_00765c40_collision_output_handoff|shift_runtime_fun_00765c40_external_pass_result|shift_runtime_fun_00765c40_selected_bmw_query_fallback|shift_runtime_fun_00765c40_query_cache_lifetime|shift_runtime_fun_00766510_same_pass_handoff|shift_runtime_native_vehicle_provider_session|shift_runtime_fun_007594e0_session_angle|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify application-point native report
        run: |
          mkdir -p out/native-physics-contact-handoff
          native_runtime/build/shift_runtime_fun_00766510_selected_bmw_application_point_check \
            > out/native-physics-contact-handoff/fun_00766510_selected_bmw_application_point.json
          grep -q '"format":"SHIFT.Fun00766510SelectedBMWApplicationPoint/1"' \
            out/native-physics-contact-handoff/fun_00766510_selected_bmw_application_point.json
          grep -q '"aliases_phase727_body_rotated_local":true' \
            out/native-physics-contact-handoff/fun_00766510_selected_bmw_application_point.json
          grep -q '"runtime_provider_handoff_joined":false' \
            out/native-physics-contact-handoff/fun_00766510_selected_bmw_application_point.json

      - name: Verify collision-output native report
        run: |
          native_runtime/build/shift_runtime_fun_00765c40_collision_output_handoff_check \
            > out/native-physics-contact-handoff/fun_00765c40_collision_output_handoff.json
          grep -q '"format":"SHIFT.Fun00765c40CollisionOutputHandoff/1"' \
            out/native-physics-contact-handoff/fun_00765c40_collision_output_handoff.json
          grep -q '"external_result_format":"SHIFT.Fun00765c40ExternalPassResult/4"' \
            out/native-physics-contact-handoff/fun_00765c40_collision_output_handoff.json
          grep -q '"selected_collision_output_required":true' \
            out/native-physics-contact-handoff/fun_00765c40_collision_output_handoff.json
          grep -q '"upper_lower_clamp_native":true' \
            out/native-physics-contact-handoff/fun_00765c40_collision_output_handoff.json

      - name: Verify same-pass native report
        run: |
          native_runtime/build/shift_runtime_fun_00766510_same_pass_handoff_check \
            > out/native-physics-contact-handoff/fun_00766510_same_pass_handoff.json
          grep -q '"format":"SHIFT.Fun00766510ExternalPassInput/1"' \
            out/native-physics-contact-handoff/fun_00766510_same_pass_handoff.json
          grep -q '"provider_count":7' \
            out/native-physics-contact-handoff/fun_00766510_same_pass_handoff.json
