    paths:
      - 'native_runtime/include/shift_fun_00766510_selected_bmw_application_point.hpp'
      - 'native_runtime/tests/fun_00766510_selected_bmw_application_point_check.cpp'
      - 'native_runtime/include/shift_fun_00765c40_external_pass_result.hpp'
