jobs:
  fun-007682c0-machine-effect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run S6 proof/frontier regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007682c0_machine_effect_production.py
          tests/test_s6_fun_007682c0_derived_projection_state.py
          tests/test_s6_fun_007594e0_machine_angle.py
          tests/test_s6_bmw_m3_e36_response_field_4054.py
          tests/test_native_vehicle_external_provider_frontier_current.py
          tests/test_single_process_coordination.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build machine-input closure and active-session regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007682c0_machine_effect_check
          shift_runtime_fun_007682c0_projection_state_check
          shift_runtime_fun_007594e0_machine_angle_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_bmw_m3_e36_response_field_4054_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007682c0_(machine_effect|projection_state)|shift_runtime_fun_007594e0_(machine_angle|session_angle)|shift_runtime_bmw_m3_e36_response_field_4054|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 718 machine-effect report
        run: |
          mkdir -p out/native-physics-phase718
          native_runtime/build/shift_runtime_fun_007682c0_machine_effect_check \
            > out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"format":"SHIFT.NativeFun007682c0MachineEffect/1"' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"retail_x87_fsqrt":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"retail_x87_control_word_0x027f":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"host_std_sqrt_used":false' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"effect_arithmetic_internal":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"body0_delta_before_half_step":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json

      - name: Verify Phase 719 derived projection report
        run: |
          native_runtime/build/shift_runtime_fun_007682c0_projection_state_check \
            > out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"format":"SHIFT.Fun007682c0DerivedProjectionState/1"' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"initial_fields_zero":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"legacy_projection_provider_values_ignored":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"legacy_response_4054_provider_value_ignored":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"setup_response_4054_consumed":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"post_outer_delta_over_dt":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json
          grep -q '"f32_store_checkpoint":true' \
            out/native-physics-phase718/fun_007682c0_projection_state.json

      - name: Verify Phase 720 machine-angle reports
        run: |
          native_runtime/build/shift_runtime_fun_007594e0_machine_angle_check \
            > out/native-physics-phase718/fun_007594e0_machine_angle.json
          native_runtime/build/shift_runtime_fun_007594e0_session_angle_check \
            > out/native-physics-phase718/fun_007594e0_session_angle.json
          grep -q '"format":"SHIFT.NativeFun007594e0MachineAngle/1"' \
            out/native-physics-phase718/fun_007594e0_machine_angle.json
          grep -q '"retail_x87_fpatan":true' \
            out/native-physics-phase718/fun_007594e0_machine_angle.json
          grep -q '"signed_zero_quadrant_preserved":true' \
            out/native-physics-phase718/fun_007594e0_machine_angle.json
          grep -q '"host_std_atan2_used":false' \
            out/native-physics-phase718/fun_007594e0_machine_angle.json
          grep -q '"format":"SHIFT.NativeFun007594e0SessionAngle/1"' \
            out/native-physics-phase718/fun_007594e0_session_angle.json
          grep -q '"external_steering_field_present":false' \
            out/native-physics-phase718/fun_007594e0_session_angle.json
          grep -q '"same_value_used_by_both_passes":true' \
            out/native-physics-phase718/fun_007594e0_session_angle.json

      - name: Verify Phase 721 BMW setup response report
        run: |
          native_runtime/build/shift_runtime_bmw_m3_e36_response_field_4054_check \
            > out/native-physics-phase718/bmw_m3_e36_response_field_4054.json
          grep -q '"format":"SHIFT.BMWM3E36ResponseField4054/1"' \
            out/native-physics-phase718/bmw_m3_e36_response_field_4054.json
          grep -q '"response_4054_bits":"0x402ccccd"' \
            out/native-physics-phase718/bmw_m3_e36_response_field_4054.json
          grep -q '"retail_x87_fabs_store":true' \
            out/native-physics-phase718/bmw_m3_e36_response_field_4054.json
          grep -q '"setup_fixed":true' \
            out/native-physics-phase718/bmw_m3_e36_response_field_4054.json
