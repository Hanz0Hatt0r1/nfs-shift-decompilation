name: native-physics-phase718

on:
  push:
    paths:
      - 'evidence/fun_007682c0_machine_effect_production.json'
      - 'evidence/playable_slice_single_process_execution.json'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_007682c0_machine_effect_production.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_single_process_coordination.py'
      - 'native_runtime/include/shift_fun_007682c0_machine_effect.hpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_machine_input_provider_chain.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/fun_007682c0_machine_effect.cpp'
      - 'native_runtime/src/fun_00770e80_motion_read_machine_input_provider_chain.cpp'
      - 'native_runtime/src/runtime_motion_read_machine_input_state.hpp'
      - 'native_runtime/src/runtime_motion_read_machine_input_state.cpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_007682c0_machine_effect_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase707.cmake'
      - 'native_runtime/cmake/phase718.cmake'
      - '.github/workflows/native-physics-phase718.yml'
  pull_request:
    paths:
      - 'evidence/fun_007682c0_machine_effect_production.json'
      - 'evidence/playable_slice_single_process_execution.json'
      - 'src/physics/native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_s6_fun_007682c0_machine_effect_production.py'
      - 'tests/test_native_vehicle_external_provider_frontier_current.py'
      - 'tests/test_single_process_coordination.py'
      - 'native_runtime/include/shift_fun_007682c0_machine_effect.hpp'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_machine_input_provider_chain.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/fun_007682c0_machine_effect.cpp'
      - 'native_runtime/src/fun_00770e80_motion_read_machine_input_provider_chain.cpp'
      - 'native_runtime/src/runtime_motion_read_machine_input_state.hpp'
      - 'native_runtime/src/runtime_motion_read_machine_input_state.cpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_007682c0_machine_effect_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase707.cmake'
      - 'native_runtime/cmake/phase718.cmake'
      - '.github/workflows/native-physics-phase718.yml'

jobs:
  fun-007682c0-machine-effect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run S6 proof/frontier regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_007682c0_machine_effect_production.py
          tests/test_native_vehicle_external_provider_frontier_current.py
          tests/test_single_process_coordination.py

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build machine-effect and active-session regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_007682c0_machine_effect_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_007682c0_machine_effect|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 718 machine-effect report
        run: |
          mkdir -p out/native-physics-phase718
          native_runtime/build/shift_runtime_fun_007682c0_machine_effect_check \
            > out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"format":"SHIFT.NativeFun007682c0MachineEffect/1"' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"retail_x87_fsqrt":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"retail_x87_control_word_0x027f":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"host_std_sqrt_used":false' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"effect_arithmetic_internal":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
          grep -q '"body0_delta_before_half_step":true' \
            out/native-physics-phase718/fun_007682c0_machine_effect.json
