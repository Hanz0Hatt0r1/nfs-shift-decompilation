name: Process 1 BMW offset33b store provenance

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_store_provenance.py'
      - 'tests/test_ghidra_bmw_offset33b_store_provenance.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_STORE_PROVENANCE.md'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'evidence/bmw_body0_vehicle_root_bind_relation.json'
      - '.github/workflows/process1-bmw-offset33b-store-provenance.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_store_provenance.py'
      - 'tests/test_ghidra_bmw_offset33b_store_provenance.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_STORE_PROVENANCE.md'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'evidence/bmw_body0_vehicle_root_bind_relation.json'
      - '.github/workflows/process1-bmw-offset33b-store-provenance.yml'

jobs:
  frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run offset33b store provenance regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_store_provenance.py
      - name: Preserve shared p-code/register provenance regressions
        run: >-
          python -m pytest -q
          tests/test_ghidra_bmw_body0_bind_callsite_register_provenance.py
          tests/test_ghidra_bmw_body0_bind_pose_writer_value_provenance.py
          tests/test_ghidra_register_relative_accesses.py
      - name: Verify CLI surface
        run: python tools/ghidra/analyze_bmw_offset33b_store_provenance.py --help >/dev/null
