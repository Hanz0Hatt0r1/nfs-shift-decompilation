name: Process 2 Phase 709 contract fix

on:
  push:
    branches:
      - process-2/phase709-continuous-native-loop

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: process-2/phase709-continuous-native-loop
          fetch-depth: 0
      - name: Apply contract fix
        run: python3 tools/_phase709_contract_fix.py
      - name: Commit contract fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_native_runtime_contract.py
          git diff --cached --check
          git commit -m "test: preserve Phase 601 cardinality contract after loop policy split"
          git push origin HEAD:process-2/phase709-continuous-native-loop
