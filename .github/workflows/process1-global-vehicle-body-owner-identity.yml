name: process1-global-vehicle-body-owner-identity

on:
  push:
    paths:
      - 'tools/ghidra/build_global_vehicle_body_owner_identity.py'
      - 'tests/test_ghidra_global_vehicle_body_owner_identity.py'
      - 'docs/PROCESS_1_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/process1-global-vehicle-body-owner-identity.yml'
  pull_request:
    paths:
      - 'tools/ghidra/build_global_vehicle_body_owner_identity.py'
      - 'tests/test_ghidra_global_vehicle_body_owner_identity.py'
      - 'docs/PROCESS_1_GLOBAL_VEHICLE_BODY_OWNER_IDENTITY.md'
      - '.github/workflows/process1-global-vehicle-body-owner-identity.yml'

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: sudo apt-get update && sudo apt-get install -y python3-pytest
      - name: Run composed identity regression
        run: python3 -m pytest -q tests/test_ghidra_global_vehicle_body_owner_identity.py
