name: native-physics-phase752

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00766510_response_config.hpp'
      - 'native_runtime/tests/fun_00766510_response_config_check.cpp'
      - 'native_runtime/cmake/phase751.cmake'
      - 'native_runtime/cmake/phase752.cmake'
      - 'tests/test_s6_fun_00766510_response_config.py'
      - 'evidence/fun_00766510_response_config_native.json'
      - 'docs/PHASE752_FUN_00766510_RESPONSE_CONFIG.md'
      - '.github/workflows/native-physics-phase752.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00766510_response_config.hpp'
      - 'native_runtime/tests/fun_00766510_response_config_check.cpp'
      - 'native_runtime/cmake/phase751.cmake'
      - 'native_runtime/cmake/phase752.cmake'
      - 'tests/test_s6_fun_00766510_response_config.py'
      - 'evidence/fun_00766510_response_config_native.json'
      - 'docs/PHASE752_FUN_00766510_RESPONSE_CONFIG.md'
      - '.github/workflows/native-physics-phase752.yml'

jobs:
  response-config-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run Phase 752 Python regression
        run: python3 -m pytest -q tests/test_s6_fun_00766510_response_config.py

      - name: Validate Phase 752 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00766510_response_config_native.json').read_text())
          assert e['format'] == 'SHIFT.Fun00766510ResponseConfig/1'
          assert e['ready'] is True
          assert e['native_contract']['table_entry_count'] == 6
          assert e['persistent_refresh']['setup_constant'] is False
          assert e['scope']['runtime_curve_scale_table_chain_internalized'] is False
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['contact_response_provider_removed'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 752 and Phase 751 regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00766510_response_config_check
          shift_runtime_fun_00766510_optional_response_branch_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00766510_response_config|shift_runtime_fun_00766510_optional_response_branch)$'

      - name: Verify native report
        run: |
          mkdir -p out/native-physics-phase752
          native_runtime/build/shift_runtime_fun_00766510_response_config_check \
            > out/native-physics-phase752/fun_00766510_response_config.json
          grep -q '"format":"SHIFT.Fun00766510ResponseConfig/1"' \
            out/native-physics-phase752/fun_00766510_response_config.json
          grep -q '"derived_scale_offset":"0x3908"' \
            out/native-physics-phase752/fun_00766510_response_config.json
          grep -q '"contact_response_provider_removed":false' \
            out/native-physics-phase752/fun_00766510_response_config.json
