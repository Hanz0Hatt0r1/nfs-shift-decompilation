name: Process 1 BMW offset33b actual additional-mass writer frontier

on:
  push:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_actual_additional_mass_writer_frontier.py'
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'tests/test_ghidra_bmw_offset33b_actual_additional_mass_writer_frontier.py'
      - 'tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ACTUAL_ADDITIONAL_MASS_WRITER_FRONTIER.md'
      - '.github/workflows/process1-bmw-offset33b-actual-additional-mass-writer-frontier.yml'
  pull_request:
    paths:
      - 'tools/ghidra/analyze_bmw_offset33b_actual_additional_mass_writer_frontier.py'
      - 'tools/ghidra/analyze_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_callsite_register_provenance.py'
      - 'tools/ghidra/analyze_bmw_body0_bind_pose_writer_value_provenance.py'
      - 'tools/ghidra/analyze_register_relative_accesses.py'
      - 'tests/test_ghidra_bmw_offset33b_actual_additional_mass_writer_frontier.py'
      - 'tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py'
      - 'docs/PROCESS_1_BMW_OFFSET33B_ACTUAL_ADDITIONAL_MASS_WRITER_FRONTIER.md'
      - '.github/workflows/process1-bmw-offset33b-actual-additional-mass-writer-frontier.yml'

jobs:
  writer-frontier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run actual additional-mass writer frontier regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_actual_additional_mass_writer_frontier.py
      - name: Preserve PR 1250 retraction regressions
        run: python -m pytest -q tests/test_ghidra_bmw_offset33b_additional_mass_bootstrap_zero.py
      - name: Verify analyzer CLI
        run: python tools/ghidra/analyze_bmw_offset33b_actual_additional_mass_writer_frontier.py --help >/dev/null
      - name: Verify targeted exporter CLI
        run: bash tools/ghidra/run_shift_function_instructions.sh --help >/dev/null 2>&1 || test $? -ne 0
