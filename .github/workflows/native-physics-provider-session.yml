name: native-physics-provider-session

on:
  push:
    paths:
      - 'src/physics/native_vehicle_external_provider_frontier.py'
      - 'src/physics/native_vehicle_provider_session_runtime.py'
      - 'tools/build_native_vehicle_external_provider_frontier.py'
      - 'tests/test_fun_00770e80_motion_read_runtime_state.py'
      - 'tests/test_native_vehicle_external_provider_frontier.py'
      - 'tests/test_native_vehicle_provider_session_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/include/shift_fun_00770e80_scalar_provider_anchor_chain.hpp'
      - 'native_runtime/include/shift_fun_00770e80_two_half_step_schedule.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/include/shift_persistent_vehicle_vulkan_upload.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/src/runtime_loop_policy.hpp'
      - 'native_runtime/src/selected_session_physics_tweaker_rate_handoff.hpp'
      - 'native_runtime/src/materialized_selected_session_physics_tweaker_rate.hpp'
      - 'native_runtime/src/selected_session_retail_vehicle_execution.hpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_physics_tweaker_rate_handoff_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase700.cmake'
      - 'native_runtime/cmake/phase701.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'evidence/s5_retail_outer_update_cadence.json'
      - 'evidence/process2_runtime_scheduler_authority.json'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_POSE_WRITER_ABI.md'
      - 'docs/PHASE699_NATIVE_VEHICLE_EXTERNAL_PROVIDER_FRONTIER.md'
      - 'docs/PHASE701_NATIVE_VEHICLE_PROVIDER_SESSION.md'
      - 'docs/PHASE708_PROVIDER_FRONTIER_REFRESH_AFTER_RETAIL_IDENTITY.md'
      - 'coordination/ci_migrations/native_physics_provider_session_699_701.json'
      - 'tests/test_ci_workflow_migration_provider_session.py'
      - '.github/workflows/native-physics-provider-session.yml'
  pull_request:
    paths:
      - 'src/physics/native_vehicle_external_provider_frontier.py'
      - 'src/physics/native_vehicle_provider_session_runtime.py'
      - 'tools/build_native_vehicle_external_provider_frontier.py'
      - 'tests/test_fun_00770e80_motion_read_runtime_state.py'
      - 'tests/test_native_vehicle_external_provider_frontier.py'
      - 'tests/test_native_vehicle_provider_session_runtime.py'
      - 'native_runtime/include/shift_fun_00770e80_motion_read_effect_provider_chain.hpp'
      - 'native_runtime/include/shift_fun_00770e80_scalar_provider_anchor_chain.hpp'
      - 'native_runtime/include/shift_fun_00770e80_two_half_step_schedule.hpp'
      - 'native_runtime/include/shift_retail_global_vehicle_body_owner_identity.hpp'
      - 'native_runtime/include/shift_persistent_vehicle_vulkan_upload.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/src/runtime_loop_policy.hpp'
      - 'native_runtime/src/selected_session_physics_tweaker_rate_handoff.hpp'
      - 'native_runtime/src/materialized_selected_session_physics_tweaker_rate.hpp'
      - 'native_runtime/src/selected_session_retail_vehicle_execution.hpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_physics_tweaker_rate_handoff_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase700.cmake'
      - 'native_runtime/cmake/phase701.cmake'
      - 'evidence/global_vehicle_body_owner_identity_retail.json'
      - 'evidence/s5_retail_outer_update_cadence.json'
      - 'evidence/process2_runtime_scheduler_authority.json'
      - 'docs/PROCESS_1_BMW_BODY0_BIND_POSE_WRITER_ABI.md'
      - 'docs/PHASE699_NATIVE_VEHICLE_EXTERNAL_PROVIDER_FRONTIER.md'
      - 'docs/PHASE701_NATIVE_VEHICLE_PROVIDER_SESSION.md'
      - 'docs/PHASE708_PROVIDER_FRONTIER_REFRESH_AFTER_RETAIL_IDENTITY.md'
      - 'coordination/ci_migrations/native_physics_provider_session_699_701.json'
      - 'tests/test_ci_workflow_migration_provider_session.py'
      - '.github/workflows/native-physics-provider-session.yml'
  workflow_dispatch:

concurrency:
  group: native-physics-provider-session-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-session-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run provider frontier and session Python regressions
        run: >-
          PYTHONPATH=src/physics python3 -m pytest -q
          tests/test_fun_00770e80_motion_read_runtime_state.py
          tests/test_native_vehicle_external_provider_frontier.py
          tests/test_native_vehicle_provider_session_runtime.py
          tests/test_ci_workflow_migration_provider_session.py

      - name: Build machine-readable Process 1 provider handoff
        run: |
          mkdir -p out/native-physics-provider-session
          python3 tools/build_native_vehicle_external_provider_frontier.py \
            out/native-physics-provider-session/native_vehicle_external_provider_frontier.json

      - name: Verify fail-closed provider inventory and cadence closure
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path(
              'out/native-physics-provider-session/native_vehicle_external_provider_frontier.json'
          ).read_text(encoding='utf-8'))
          assert report['format'] == 'SHIFT.NativeVehicleExternalProviderFrontier/1'
          assert report['phase'] == 699
          assert report['refresh_after_phase'] == 707
          assert report['refresh_label'] == \
              'Process 2 Phase 708 coordination refresh + S5 retail cadence closure'
          assert report['external_provider_count'] == 9
          assert report['implement_now'] == []
          assert len(report['process1_handoff_requests']) == 9
          assert report['runtime_only_blocked'] == []

          joins = {row['id']: row for row in report['cross_chain_joins']}
          assert joins['outer_update_cadence_owner']['state'] == 'retail_proven_and_consumed'
          assert joins['outer_update_cadence_owner']['process2_action'] == 'closed'
          assert joins['outer_update_cadence_owner']['blockers'] == []
          assert joins['body_to_vehicle_identity']['state'] == 'retail_proven_and_consumed'
          assert joins['body_to_vehicle_identity']['process2_action'] == 'closed'
          assert joins['body_to_vehicle_identity']['blockers'] == []
          assert joins['body_pose_to_renderer_world_transform']['state'] == \
              'renderer_sink_ready_retail_bind_witness_pending'

          closed = {row['boundary']: row for row in report['closed_boundaries']}
          assert closed['global vehicle/BODY-owner identity composition contract']['retail_identity_ready'] is True
          assert closed['native retail BODY-owner identity producer']['phase'] == 707
          assert closed['BODY0 bind pose-writer physical ABI']['BODY0_bind_frame_proof_ready'] is False
          assert closed['live vehicle Vulkan vertex upload']['phase'] == 647
          assert closed['persistent Phase706 transform -> live Vulkan upload']['phase'] == 649

          guards = report['guards']
          assert guards['two_half_steps_preserved'] is True
          assert guards['persistent_body_state_preserved'] is True
          assert guards['fixed_step_auto_schedule_allowed'] is False
          assert guards['retail_outer_cadence_ready'] is True
          assert guards['retail_outer_scheduler_authority'] == 'RetailEvidence'
          assert guards['retail_outer_dispatch_transaction_ready'] is True
          assert guards['selected_session_inner_rate_ready'] is False
          assert guards['render_loop_equated_to_outer_dispatch'] is False
          assert guards['host_sqrt_substitution_allowed'] is False
          assert guards['host_sin_substitution_allowed'] is False
          assert guards['host_cos_substitution_allowed'] is False
          assert guards['retail_body_owner_identity_ready'] is True
          assert guards['retail_identity_injected_by_caller'] is False
          assert guards['body_pose_to_vehicle_transform_promotion_allowed'] is False
          assert guards['body0_pose_writer_physical_abi_implies_semantic_bind_roles'] is False
          assert guards['phase649_renderer_sink_ready'] is True
          assert guards['phase649_renderer_sink_is_retail_transform_producer'] is False
          assert guards['original_game_execution_required'] is False
          assert guards['new_runtime_capture_required'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build provider-session native regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00770e80_motion_read_runtime_state_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_physics_tweaker_rate_handoff_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00770e80_motion_read_runtime_state|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_physics_tweaker_rate_handoff|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify provider-session native reports
        run: |
          OUT=out/native-physics-provider-session
          mkdir -p "$OUT"

          native_runtime/build/shift_runtime_native_vehicle_provider_session_check \
            > "$OUT/native_vehicle_provider_session.json"
          grep -q '"format":"SHIFT.NativeVehicleProviderSession/1"' "$OUT/native_vehicle_provider_session.json"
          grep -q '"phase697_persistent_outer_path_reused":true' "$OUT/native_vehicle_provider_session.json"
          grep -q '"phase699_external_provider_count":9' "$OUT/native_vehicle_provider_session.json"
          grep -q '"session_step_count":2' "$OUT/native_vehicle_provider_session.json"
          grep -q '"persistent_body_state_reused":true' "$OUT/native_vehicle_provider_session.json"
          grep -q '"provider_admission_before_execution":true' "$OUT/native_vehicle_provider_session.json"
          grep -q '"participant_gate_before_provider_side_effects":true' "$OUT/native_vehicle_provider_session.json"
          grep -q '"retail_inner_batch_bridge_ready":true' "$OUT/native_vehicle_provider_session.json"
          grep -q '"selected_session_rate_promoted":false' "$OUT/native_vehicle_provider_session.json"
          grep -q '"provider_semantics_promoted":false' "$OUT/native_vehicle_provider_session.json"
          grep -q '"vehicle_body_identity_proven":false' "$OUT/native_vehicle_provider_session.json"
          grep -q '"vehicle_world_transform_proven":false' "$OUT/native_vehicle_provider_session.json"
          grep -q '"fixed_step_auto_schedule":false' "$OUT/native_vehicle_provider_session.json"
          grep -q '"deep_outer_update_executable_schedule_enabled":false' "$OUT/native_vehicle_provider_session.json"

          native_runtime/build/shift_runtime_selected_session_physics_tweaker_rate_handoff_check \
            > "$OUT/selected_session_rate_handoff.json"
          grep -q '"format":"SHIFT.SelectedSessionPhysicsTweakerRateNativeHandoffRegression/1"' "$OUT/selected_session_rate_handoff.json"
          grep -q '"typed_handoff_admission_ready":true' "$OUT/selected_session_rate_handoff.json"
          grep -q '"fixture_is_retail_selected_session_rate":false' "$OUT/selected_session_rate_handoff.json"
          grep -q '"materialized_pc_rate_hz":180' "$OUT/selected_session_rate_handoff.json"
          grep -q '"materialized_pc_rate_admitted":true' "$OUT/selected_session_rate_handoff.json"

          native_runtime/build/shift_runtime_selected_session_retail_vehicle_execution_check \
            > "$OUT/selected_session_retail_execution.json"
          grep -q '"format":"SHIFT.SelectedSessionRetailVehicleExecution/1"' "$OUT/selected_session_retail_execution.json"
          grep -q '"selected_session_rate_hz":180' "$OUT/selected_session_retail_execution.json"
          grep -q '"normal_outer_substeps":6' "$OUT/selected_session_retail_execution.json"
          grep -q '"two_dispatch_persistent_steps":12' "$OUT/selected_session_retail_execution.json"
          grep -q '"retail_inner_substep_execution_admitted":true' "$OUT/selected_session_retail_execution.json"
          grep -q '"provider_semantics_promoted":false' "$OUT/selected_session_retail_execution.json"
          grep -q '"render_frame_equivalence_claimed":false' "$OUT/selected_session_retail_execution.json"
