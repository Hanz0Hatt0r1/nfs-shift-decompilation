name: native-physics-phase740

on:
  push:
    paths:
      - 'native_runtime/include/shift_fun_00765c40_external_pass_result.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_external_pass_result_check.cpp'
      - 'native_runtime/tests/fun_00765c40_query_cache_lifetime_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase739.cmake'
      - 'native_runtime/cmake/phase740.cmake'
      - 'tests/test_s6_fun_00765c40_external_pass_result.py'
      - 'tests/test_s6_fun_00765c40_query_input_boundary.py'
      - 'tests/test_s6_fun_00765c40_load_term_ownership.py'
      - 'tests/test_s6_fun_00765c40_selected_bmw_world_position.py'
      - 'tests/test_s6_fun_00765c40_query_cache_lifetime.py'
      - 'evidence/fun_00765c40_query_cache_lifetime.json'
      - 'evidence/phase740_next_blocker.md'
      - 'docs/PHASE740_FUN_00765C40_QUERY_CACHE_LIFETIME.md'
      - 'docs/PHASE740_SCOPE.md'
      - '.github/workflows/native-physics-phase725.yml'
      - '.github/workflows/native-physics-phase740.yml'
  pull_request:
    paths:
      - 'native_runtime/include/shift_fun_00765c40_external_pass_result.hpp'
      - 'native_runtime/include/shift_native_vehicle_provider_session.hpp'
      - 'native_runtime/src/native_vehicle_provider_session.cpp'
      - 'native_runtime/tests/fun_00765c40_external_pass_result_check.cpp'
      - 'native_runtime/tests/fun_00765c40_query_cache_lifetime_check.cpp'
      - 'native_runtime/tests/fun_007594e0_session_angle_check.cpp'
      - 'native_runtime/tests/native_vehicle_provider_session_check.cpp'
      - 'native_runtime/tests/selected_session_retail_vehicle_execution_check.cpp'
      - 'native_runtime/cmake/phase739.cmake'
      - 'native_runtime/cmake/phase740.cmake'
      - 'tests/test_s6_fun_00765c40_external_pass_result.py'
      - 'tests/test_s6_fun_00765c40_query_input_boundary.py'
      - 'tests/test_s6_fun_00765c40_load_term_ownership.py'
      - 'tests/test_s6_fun_00765c40_selected_bmw_world_position.py'
      - 'tests/test_s6_fun_00765c40_query_cache_lifetime.py'
      - 'evidence/fun_00765c40_query_cache_lifetime.json'
      - 'evidence/phase740_next_blocker.md'
      - 'docs/PHASE740_FUN_00765C40_QUERY_CACHE_LIFETIME.md'
      - 'docs/PHASE740_SCOPE.md'
      - '.github/workflows/native-physics-phase725.yml'
      - '.github/workflows/native-physics-phase740.yml'

jobs:
  query-cache-lifetime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ python3-pytest libvulkan-dev glslang-tools libxcb1-dev

      - name: Run focused Phase 740 regressions
        run: >-
          python3 -m pytest -q
          tests/test_s6_fun_00765c40_query_cache_lifetime.py
          tests/test_s6_fun_00765c40_external_pass_result.py
          tests/test_s6_fun_00765c40_query_input_boundary.py
          tests/test_s6_fun_00765c40_load_term_ownership.py
          tests/test_s6_fun_00765c40_selected_bmw_world_position.py

      - name: Validate Phase 740 evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          e = json.loads(Path('evidence/fun_00765c40_query_cache_lifetime.json').read_text())
          assert e['format'] == 'SHIFT.Fun00765c40QueryCacheLifetime/1'
          assert e['ready'] is True
          assert e['caller_state']['offset'] == 'HDVehicle+0x38dc'
          assert e['caller_state']['setup_seed'] == 0
          assert e['runtime_join']['pass1_consumes_pass0_returned_handle'] is True
          assert e['runtime_join']['transactional_rollback'] is True
          assert e['scope']['external_provider_count_after'] == 7
          assert e['scope']['collision_provider_internalized'] is False
          PY

      - name: Configure native runtime
        run: cmake -S native_runtime -B native_runtime/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Phase 740 and affected provider regressions
        run: >-
          cmake --build native_runtime/build --config Release --parallel
          --target shift_runtime_fun_00765c40_query_cache_lifetime_check
          shift_runtime_fun_00765c40_external_pass_result_check
          shift_runtime_fun_007594e0_session_angle_check
          shift_runtime_native_vehicle_provider_session_check
          shift_runtime_selected_session_retail_vehicle_execution_check

      - name: Run focused CTest regressions
        run: >-
          ctest --test-dir native_runtime/build --output-on-failure
          -R '^(shift_runtime_fun_00765c40_query_cache_lifetime|shift_runtime_fun_00765c40_external_pass_result|shift_runtime_fun_007594e0_session_angle|shift_runtime_native_vehicle_provider_session|shift_runtime_selected_session_retail_vehicle_execution)$'

      - name: Verify Phase 740 native report
        run: |
          mkdir -p out/native-physics-phase740
          native_runtime/build/shift_runtime_fun_00765c40_query_cache_lifetime_check \
            > out/native-physics-phase740/fun_00765c40_query_cache_lifetime.json
          grep -q '"format":"SHIFT.Fun00765c40QueryCacheLifetime/1"' \
            out/native-physics-phase740/fun_00765c40_query_cache_lifetime.json
          grep -q '"caller_offset":"0x38dc"' \
            out/native-physics-phase740/fun_00765c40_query_cache_lifetime.json
          grep -q '"zero_seed":true' \
            out/native-physics-phase740/fun_00765c40_query_cache_lifetime.json
          grep -q '"pass_to_pass_handoff":true' \
            out/native-physics-phase740/fun_00765c40_query_cache_lifetime.json
